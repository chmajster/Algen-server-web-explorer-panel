name: Temporary credential module selector patch

on:
  push:
    branches:
      - feat/credential-module-multiselect

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/credential-module-multiselect
          fetch-depth: 0
      - name: Apply credential module selector patch
        run: python .github/scripts/.tmp_patch_credential_module_select.py
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/features/modules/hosts/HostsManagerApp.tsx frontend/src/features/modules/hosts/HostsManagerApp.test.tsx frontend/src/features/modules/hosts/hosts-credential-module-select.css frontend/src/locales/pl-PL.json frontend/src/locales/en-US.json
          git commit -m 'feat: add credential module multi-select'
          git push origin HEAD:feat/credential-module-multiselect
