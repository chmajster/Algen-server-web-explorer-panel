name: Temporary dynamic credentials form patch

on:
  push:
    branches:
      - feature/dynamic-credentials-form

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dynamic-credentials-form
          fetch-depth: 0
      - name: Normalize credential translations
        run: python .github/scripts/normalize_dynamic_credentials_locales.py
      - name: Commit locale normalization
        run: |
          git add frontend/src/locales/pl-PL.json frontend/src/locales/en-US.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: keep credential translations minimal"
          git push origin HEAD:feature/dynamic-credentials-form
