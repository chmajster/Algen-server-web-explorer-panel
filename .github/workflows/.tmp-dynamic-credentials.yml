name: Temporary dynamic credentials form patch

on:
  push:
    branches:
      - feature/dynamic-credentials-form

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dynamic-credentials-form
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_dynamic_credentials.py
      - name: Commit patch
        run: |
          git add frontend/src/features/modules/hosts/HostsManagerApp.tsx frontend/src/features/modules/hosts/HostsManagerApp.test.tsx frontend/src/locales/pl-PL.json frontend/src/locales/en-US.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: make credentials form type-aware"
          git push origin HEAD:feature/dynamic-credentials-form
