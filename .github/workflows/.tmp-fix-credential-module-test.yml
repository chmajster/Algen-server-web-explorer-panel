name: Temporary credential selector test fix

on:
  push:
    branches:
      - feat/credential-module-multiselect

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/credential-module-multiselect
          fetch-depth: 0
      - name: Apply test scope fix
        run: python .github/scripts/.tmp_fix_credential_module_test.py
      - name: Commit test fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/features/modules/hosts/HostsManagerApp.test.tsx
          git commit -m 'test: scope credential module selector lookup'
          git push origin HEAD:feat/credential-module-multiselect
