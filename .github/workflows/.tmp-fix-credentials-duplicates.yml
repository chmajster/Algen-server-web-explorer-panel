name: Temporary credentials duplicate repair

on:
  push:
    branches:
      - feature/dynamic-credentials-form

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dynamic-credentials-form
          fetch-depth: 0
      - name: Repair duplicate settings
        run: python .github/scripts/fix_credentials_duplicate_settings.py
      - name: Commit repair
        run: |
          git add frontend/src/features/modules/hosts/HostsManagerApp.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: remove duplicated Hosts Manager settings"
          git push origin HEAD:feature/dynamic-credentials-form
