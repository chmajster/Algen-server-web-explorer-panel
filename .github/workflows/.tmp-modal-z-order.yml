name: Temporary modal z-order patch

on:
  push:
    branches:
      - fix/modal-window-z-order

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/modal-window-z-order
          fetch-depth: 0
      - name: Apply modal z-order behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          modal_path = Path('frontend/src/components/Modal.tsx')
          text = modal_path.read_text()

          replacements = [
              (
                  'const visibleDialogOrder: symbol[] = [];\nconst DIALOG_MARGIN = 8;',
                  'const visibleDialogOrder: symbol[] = [];\nlet dialogZIndexCounter = 3500;\nconst DIALOG_MARGIN = 8;'
              ),
              (
                  'function isActiveDialog(token: symbol) {\n  return visibleDialogOrder[visibleDialogOrder.length - 1] === token;\n}\n\nfunction viewportSize() {',
                  'function isActiveDialog(token: symbol) {\n  return visibleDialogOrder[visibleDialogOrder.length - 1] === token;\n}\n\nfunction nextDialogZIndex() {\n  dialogZIndexCounter += 1;\n  return dialogZIndexCounter;\n}\n\nfunction viewportSize() {'
              ),
              (
                  '  const [dialogToken] = useState(() => Symbol("dialog"));\n  const panel = useRef<HTMLDivElement>(null);',
                  '  const [dialogToken] = useState(() => Symbol("dialog"));\n  const [layerZIndex, setLayerZIndex] = useState(() => nextDialogZIndex());\n  const panel = useRef<HTMLDivElement>(null);'
              ),
              (
                  '  function minimize() {\n',
                  '  function focusDialog() {\n    const wasActive = isActiveDialog(dialogToken);\n    activateDialog(dialogToken);\n    if (!wasActive) setLayerZIndex(nextDialogZIndex());\n  }\n\n  function minimize() {\n'
              ),
              (
                  '  function restore() {\n    releaseDialogMinimizedSlot(minimizedSlotRef.current);\n    minimizedSlotRef.current = null;\n    setMinimizedSlot(null);\n  }',
                  '  function restore() {\n    releaseDialogMinimizedSlot(minimizedSlotRef.current);\n    minimizedSlotRef.current = null;\n    focusDialog();\n    setMinimizedSlot(null);\n  }'
              ),
              (
                  '    activateDialog(dialogToken);\n    const current = rect || (panel.current ? measuredDialogRect(panel.current) : null);',
                  '    focusDialog();\n    const current = rect || (panel.current ? measuredDialogRect(panel.current) : null);'
              ),
              (
                  '      style={{ position: "fixed", zIndex: 3500, inset: 0, pointerEvents: "none" }}',
                  '      style={{ position: "fixed", zIndex: layerZIndex, inset: 0, pointerEvents: "none" }}'
              ),
              (
                  '        onPointerDown={(event) => { activateDialog(dialogToken); event.stopPropagation(); }}\n        onFocusCapture={() => activateDialog(dialogToken)}',
                  '        onPointerDown={(event) => { focusDialog(); event.stopPropagation(); }}\n        onFocusCapture={focusDialog}'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Modal patch target not found:\n{old}')
              if old.startswith('    activateDialog(dialogToken);'):
                  text = text.replace(old, new)
              else:
                  text = text.replace(old, new, 1)

          modal_path.write_text(text)

          test_path = Path('frontend/src/components/Modal.windowing.test.tsx')
          test = test_path.read_text()
          marker = '\n});\n'
          addition = '''\n\n  it("brings the clicked dialog in front of other modal windows", () => {\n    render(<>\n      <Modal title="Edit Lab" onClose={vi.fn()}><p>Edit form</p></Modal>\n      <Modal title="Lab Settings" onClose={vi.fn()}><p>Settings form</p></Modal>\n    </>);\n\n    const editLab = screen.getByRole("dialog", { name: "Edit Lab" });\n    const labSettings = screen.getByRole("dialog", { name: "Lab Settings" });\n    const editLayer = editLab.closest<HTMLElement>(".dialog-window-layer");\n    const settingsLayer = labSettings.closest<HTMLElement>(".dialog-window-layer");\n\n    expect(editLayer).not.toBeNull();\n    expect(settingsLayer).not.toBeNull();\n    expect(Number(settingsLayer?.style.zIndex)).toBeGreaterThan(Number(editLayer?.style.zIndex));\n\n    fireEvent.pointerDown(editLab, { clientX: 200, clientY: 160 });\n    expect(Number(editLayer?.style.zIndex)).toBeGreaterThan(Number(settingsLayer?.style.zIndex));\n\n    fireEvent.pointerDown(labSettings, { clientX: 240, clientY: 190 });\n    expect(Number(settingsLayer?.style.zIndex)).toBeGreaterThan(Number(editLayer?.style.zIndex));\n  });\n'''
          if addition.strip() in test:
              raise SystemExit('z-order test already present')
          if not test.endswith(marker):
              raise SystemExit('Unexpected Modal.windowing.test.tsx ending')
          test = test[:-len(marker)] + addition + marker
          test_path.write_text(test)
          PY
      - name: Commit modal z-order change
        run: |
          git add frontend/src/components/Modal.tsx frontend/src/components/Modal.windowing.test.tsx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: focus modal windows on click"
          git push origin HEAD:fix/modal-window-z-order
