name: Generate strict CodeMirror lockfile

on:
  push:
    branches:
      - feature/codemirror-text-editor

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Synchronize package-lock.json with strict peer resolution
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify deterministic install
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test text editor
        working-directory: frontend
        run: npm test -- TextEditor.test.tsx
      - name: Commit generated lockfile and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/_generate-codemirror-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/_generate-codemirror-lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(frontend): regenerate strict dependency lockfile"
          git push origin HEAD:feature/codemirror-text-editor
