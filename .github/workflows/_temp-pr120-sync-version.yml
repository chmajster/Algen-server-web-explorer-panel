name: Temporary PR 120 version sync

on:
  push:
    branches:
      - perf/webnas-performance-optimization

permissions:
  contents: write

jobs:
  sync-version:
    name: Synchronize release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Synchronize metadata from VERSION
        run: |
          set -euo pipefail
          python scripts/sync-version.py
          python scripts/sync-version.py --check

      - name: Commit generated lockfile metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: sync frontend lockfile version to 0.1.25"
          git push origin "HEAD:${GITHUB_REF_NAME}"
