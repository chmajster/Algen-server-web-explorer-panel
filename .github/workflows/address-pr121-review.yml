name: Address PR 121 review

on:
  push:
    branches:
      - feature/firewall-security-network-tools

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/firewall-security-network-tools
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          cd frontend
          npm ci
      - name: Apply review fixes
        run: python .github/scripts/address_pr121_review.py
      - name: Regenerate API contract
        working-directory: frontend
        run: npm run api:generate
      - name: Validate hardening
        run: |
          python -m ruff check backend/app/modules/firewall_manager backend/app/modules/network_tools backend/app/modules/security_center backend/app/privileged_broker backend/tests/test_firewall_manager.py backend/tests/test_network_tools.py backend/tests/test_security_center.py
          python -m mypy
          python -m pytest -q backend/tests/test_firewall_manager.py backend/tests/test_network_tools.py backend/tests/test_security_center.py backend/tests/test_architecture_boundaries.py backend/tests/test_privileged_broker_final_boundary.py
          cd frontend
          npm run typecheck
          npm run api:check
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/address_pr121_review.py .github/workflows/address-pr121-review.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: address PR 121 security review"
          git push origin HEAD:feature/firewall-security-network-tools
