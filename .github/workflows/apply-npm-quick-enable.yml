name: Apply NPM quick-enable patch

on:
  push:
    branches:
      - ui/npm-auto-update-quick-enable

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ui/npm-auto-update-quick-enable
          fetch-depth: 0

      - name: Add quick-enable action to NPM settings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/features/settings/SettingsApp.tsx")
          text = path.read_text()

          replacements = [
              (
                  '  const [runningUpdate, setRunningUpdate] = useState(false);\n  const [updateDialog, setUpdateDialog] = useState<UpdateDialogState | null>(null);',
                  '  const [runningUpdate, setRunningUpdate] = useState(false);\n  const [savingNpmAutoUpdate, setSavingNpmAutoUpdate] = useState(false);\n  const [updateDialog, setUpdateDialog] = useState<UpdateDialogState | null>(null);',
              ),
              (
                  '  async function runUpdateNow(npmAuditFix = false) {',
                  '''  async function enableAutomaticNpmUpdates() {\n    if (!updatePolicy || updatePolicy.npm_audit_fix) return;\n    setSavingNpmAutoUpdate(true);\n    try {\n      const saved = await api.saveAutoUpdate({\n        check_enabled: true,\n        enabled: updatePolicy.enabled,\n        interval_hours: updatePolicy.interval_hours,\n        update_config: updatePolicy.update_config,\n        npm_audit_fix: true,\n      });\n      setUpdatePolicy(saved);\n      toast(t("settings.saved"), "ok", "admin");\n    } catch (error) {\n      const message = error instanceof Error ? error.message : t("error.generic");\n      toast(message, "error", "admin");\n    } finally {\n      setSavingNpmAutoUpdate(false);\n    }\n  }\n  async function runUpdateNow(npmAuditFix = false) {''',
              ),
              (
                  '      <SettingRow title={t("settings.automaticNpmUpdates")} description={t("settings.automaticNpmUpdatesHint")}><span className={`settings-status-pill ${updatePolicy?.npm_audit_fix ? "success" : ""}`}>{updatePolicy ? t(updatePolicy.npm_audit_fix ? "common.enabled" : "common.disabled") : "—"}</span></SettingRow>',
                  '''      <div className="update-settings-status npm-auto-update-status">\n        <SettingRow title={t("settings.automaticNpmUpdates")} description={t("settings.automaticNpmUpdatesHint")}><span className={`settings-status-pill ${updatePolicy?.npm_audit_fix ? "success" : ""}`}>{updatePolicy ? t(updatePolicy.npm_audit_fix ? "common.enabled" : "common.disabled") : "—"}</span></SettingRow>\n        {!updatePolicy?.npm_audit_fix && <button className="button-primary" type="button" disabled={!updatePolicy || savingNpmAutoUpdate} onClick={() => void enableAutomaticNpmUpdates()}><ShieldCheck className={savingNpmAutoUpdate ? "spin" : ""} />{locale === "pl-PL" ? "Włącz" : "Enable"}</button>}\n      </div>''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, got {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Remove one-time workflow and commit patch
        run: |
          rm .github/workflows/apply-npm-quick-enable.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/settings/SettingsApp.tsx .github/workflows/apply-npm-quick-enable.yml
          git commit -m "Add quick enable button for automatic NPM updates"
          git push origin HEAD:ui/npm-auto-update-quick-enable
