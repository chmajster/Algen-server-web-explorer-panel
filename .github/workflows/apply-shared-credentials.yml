name: Apply shared credentials patch

on:
  push:
    branches:
      - feature/shared-credentials

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-credentials
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply patch
        run: python .github/scripts/apply_shared_credentials.py
      - name: Commit final changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add shared credential vault'
          git push origin HEAD:feature/shared-credentials
