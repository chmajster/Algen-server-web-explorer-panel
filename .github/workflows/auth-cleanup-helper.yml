name: Auth cleanup helper

on:
  push:
    branches:
      - feat/ldap-authentication
    paths:
      - .github/workflows/auth-cleanup-helper.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ldap-authentication
          fetch-depth: 0
      - name: Remove stale imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/local_auth.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from .audit import logger\n', '')
          path.write_text(text, encoding='utf-8')

          path = Path('backend/tests/test_local_auth.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from typing import Any\n', '')
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/auth-cleanup-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(auth): remove stale imports"
          git push origin HEAD:feat/ldap-authentication
