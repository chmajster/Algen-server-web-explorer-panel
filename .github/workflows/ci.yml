name: Automated tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check backend

      - name: Run mypy
        run: python -m mypy

      - name: Build Python package
        run: python -m build

      - name: Upload Python package
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  backend-tests:
    name: Backend tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rsync

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Run pytest
        run: |
          mkdir -p reports
          python -m pytest -ra \
            --junitxml="reports/backend-python-${{ matrix.python-version }}.xml"

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report-python-${{ matrix.python-version }}
          path: reports/backend-python-${{ matrix.python-version }}.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run Vitest
        run: |
          mkdir -p reports
          npm test -- \
            --reporter=github-actions \
            --reporter=junit \
            --outputFile=reports/frontend-junit.xml

      - name: Build frontend
        run: npm run build

      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-report
          path: frontend/reports/frontend-junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  shell-syntax:
    name: Shell script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' script; do
            found=1
            echo "Checking ${script}"
            bash -n "${script}"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

          if [[ "${found}" -eq 0 ]]; then
            echo "No Bash scripts found."
          fi

  ci-status:
    name: CI status
    if: always()
    needs:
      - backend-quality
      - backend-tests
      - frontend
      - shell-syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Write summary
        run: |
          {
            echo "## Automated test summary"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Backend quality | ${{ needs.backend-quality.result }} |"
            echo "| Backend tests | ${{ needs.backend-tests.result }} |"
            echo "| Frontend | ${{ needs.frontend.result }} |"
            echo "| Shell syntax | ${{ needs.shell-syntax.result }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Require every test job to pass
        run: |
          if [ "${{ needs.backend-quality.result }}" != "success" ] || \
             [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.shell-syntax.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
