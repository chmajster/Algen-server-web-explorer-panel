name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  backend:
    name: Backend lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev rsync

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: Ruff
        run: ruff check backend

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest backend/tests

  frontend:
    name: Frontend lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Component tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install security tools
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt

      - name: pip-audit
        run: pip-audit -r backend/requirements.txt

      - name: Bandit
        run: bandit -c pyproject.toml -r backend/app

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh uninstall.sh dev-start.sh scripts/*.sh

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install build

      - name: Build backend wheel
        run: python -m build --wheel

      - name: Upload backend wheel
        uses: actions/upload-artifact@v4
        with:
          name: backend-wheel
          path: dist/*.whl

      - name: Optional .deb build
        run: |
          if [ -d packaging/debian ]; then
            sudo apt-get update
            sudo apt-get install -y dpkg-dev debhelper
            dpkg-buildpackage -us -uc -b
          else
            echo "No packaging/debian directory; skipping .deb build."
          fi
