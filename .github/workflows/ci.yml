name: Automated tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify synchronized project version
        run: python scripts/sync-version.py --check
      - name: Verify synchronized backend runtime dependencies
        run: python scripts/sync-python-deps.py --check

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run Ruff
        run: python -m ruff check backend scripts/export_openapi.py scripts/rollback_release.py
      - name: Run mypy
        run: python -m mypy
      - name: Run Bandit
        run: python -m bandit -c pyproject.toml -r backend/app
      - name: Validate module manifests and architecture boundaries
        run: python -m pytest -q backend/tests/test_module_registry.py backend/tests/test_architecture_boundaries.py
      - name: Build Python package
        run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rsync
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run unit pytest
        run: |
          mkdir -p reports
          python -m pytest -ra -m "not integration and not system" --junitxml=reports/backend-unit.xml
      - name: Upload backend unit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-unit-report
          path: reports/backend-unit.xml
          if-no-files-found: ignore
          retention-days: 14

  backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install integration dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run controlled integration tests
        run: python -m pytest -ra -m integration

  backend-security:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install audit tooling
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Audit runtime dependencies
        run: python -m pip_audit -r backend/requirements.txt

  frontend:
    name: Frontend quality, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend runtime for OpenAPI export
        working-directory: .
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Run npm high/critical audit
        run: npm audit --audit-level=high
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript type check
        run: npm run typecheck
      - name: Check generated OpenAPI contract
        run: npm run api:check
      - name: Run Vitest
        run: |
          mkdir -p reports
          npm test -- --reporter=github-actions --reporter=junit --outputFile=reports/frontend-junit.xml
      - name: Build frontend
        run: npm run build
      - name: Enforce frontend bundle budget
        run: npm run bundle:check
      - name: Verify deployed frontend contract
        working-directory: .
        run: python scripts/verify_frontend_build.py frontend/dist
      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-report
          path: frontend/reports/frontend-junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run controlled browser E2E
        run: npm run test:e2e:ci
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  shell-syntax:
    name: Shell script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' script; do
            found=1
            echo "Checking ${script}"
            bash -n "${script}"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if [[ "${found}" -eq 0 ]]; then
            echo "No Bash scripts found."
          fi

  ci-status:
    name: CI status
    if: always()
    needs:
      - version-consistency
      - backend-quality
      - backend-tests
      - backend-integration
      - backend-security
      - frontend
      - e2e
      - shell-syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write summary
        run: |
          {
            echo "## Automated test summary"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Version consistency | ${{ needs.version-consistency.result }} |"
            echo "| Backend quality | ${{ needs.backend-quality.result }} |"
            echo "| Backend unit | ${{ needs.backend-tests.result }} |"
            echo "| Backend integration | ${{ needs.backend-integration.result }} |"
            echo "| Backend security | ${{ needs.backend-security.result }} |"
            echo "| Frontend | ${{ needs.frontend.result }} |"
            echo "| Playwright E2E | ${{ needs.e2e.result }} |"
            echo "| Shell syntax | ${{ needs.shell-syntax.result }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Require every test job to pass
        run: |
          if [ "${{ needs.version-consistency.result }}" != "success" ] || \
             [ "${{ needs.backend-quality.result }}" != "success" ] || \
             [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.backend-integration.result }}" != "success" ] || \
             [ "${{ needs.backend-security.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ] || \
             [ "${{ needs.shell-syntax.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
