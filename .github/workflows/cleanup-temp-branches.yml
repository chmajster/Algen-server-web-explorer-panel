name: Temporary branch cleanup

on:
  push:
    branches:
      - feature/infrastructure-managers
    paths:
      - .github/workflows/cleanup-temp-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "tmp-do-not-use"
            "tmp-do-not-use-2"
            "tmp-do-not-use-3"
            "tmp-do-not-use-4"
            "tmp-do-not-use-5"
            "tmp-do-not-use-6"
            "tmp-do-not-use-7"
            "release/0.1.29-infrastructure-managers"
          )

          for branch in "${branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "Deleted ${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done
