name: Generate Compliance API contract temporary

on:
  push:
    branches: [feat/compliance-manager]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/compliance-manager
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate API contract
        working-directory: frontend
        run: npm run api:generate
      - name: Commit generated contract
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/generated/api-types.ts; then
            echo "API contract already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/generated/api-types.ts
          git commit -m "chore: regenerate OpenAPI TypeScript contract"
          git push origin HEAD:feat/compliance-manager
