name: Finalize PR35 release metadata

on:
  push:
    branches:
      - feat/dcst-enterprise-ui

permissions:
  contents: write

jobs:
  finalize:
    name: Synchronize release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: feat/dcst-enterprise-ui
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Bump and synchronize version
        run: python scripts/sync-version.py --bump patch

      - name: Promote Unreleased notes to v0.1.22
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          if "## v0.1.22 — 2026-08-28" not in text:
              marker = "## Unreleased\n\n"
              replacement = (
                  "## Unreleased\n\n"
                  "## v0.1.22 — 2026-08-28\n\n"
                  "- Reworked the DCST network-security control plane and hardened bulk blocking, live deletion warnings, preview concurrency, inventory permissions, policy-sync timestamps, and raw firewall-log filtering.\n"
              )
              if marker not in text:
                  raise SystemExit("CHANGELOG.md does not contain the expected Unreleased section")
              text = text.replace(marker, replacement, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary finalizer
        run: rm .github/workflows/finalize-pr35.yml

      - name: Verify synchronized version
        run: python scripts/sync-version.py --check

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION pyproject.toml frontend/package.json frontend/package-lock.json CHANGELOG.md .github/workflows/finalize-pr35.yml
          git commit -m "Release v0.1.22 metadata for DCST"
          git push origin HEAD:feat/dcst-enterprise-ui
