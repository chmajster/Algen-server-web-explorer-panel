name: Apply credential save fix

on:
  push:
    branches:
      - fix/hosts-manager-credential-save

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply credential state patch
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("frontend/src/features/modules/hosts/HostsManagerApp.tsx")
          text = app.read_text()

          section_start = text.index('  else if (section === "credentials")')
          section_end = text.index('  else\n', section_start)
          section = text[section_start:section_end]
          if 'refresh={refresh}' not in section:
              raise SystemExit('credentials parent refresh prop not found')
          section = section.replace('refresh={refresh}', 'onItemsChange={setCredentials}', 1)
          text = text[:section_start] + section + text[section_end:]

          start = text.index('function Credentials({')
          end = text.index('\nfunction Repositories({', start)
          block = text[start:end]
          if '  refresh,\n' not in block or '  refresh: () => Promise<void>;\n' not in block:
              raise SystemExit('credentials refresh props not found')
          block = block.replace('  refresh,\n', '  onItemsChange,\n', 1)
          block = block.replace('  refresh: () => Promise<void>;\n', '  onItemsChange: (items: HostsManagerCredential[]) => void;\n', 1)

          state_marker = '  const [shareSelectionInitialized, setShareSelectionInitialized] = useState(false);\n'
          if state_marker not in block:
              raise SystemExit('credential share state marker not found')
          block = block.replace(state_marker, state_marker + '  const [saving, setSaving] = useState(false);\n', 1)

          save_start = block.index('  async function save(event: React.FormEvent) {')
          remove_start = block.index('  async function remove(item: HostsManagerCredential) {', save_start)
          columns_start = block.index('  const environmentNames = ', remove_start)
          new_actions = '''  async function save(event: React.FormEvent) {
            event.preventDefault();
            if (saving) return;
            setSaving(true);
            try {
              const saved = await api.saveHostsManagerCredential({
                name, type, username, environment_id: environmentId || null, secret, passphrase, description,
                shared_with: [...new Set(sharedWith)], confirm: true,
              }, editing?.id);
              if (!saved?.id) {
                throw new ApiError("Backend zapisał poświadczenie, ale nie zwrócił jego identyfikatora.", 500, "CREDENTIAL_SAVE_INVALID_RESPONSE");
              }
              const normalized = { ...saved, host_count: saved.host_count ?? editing?.host_count ?? 0 };
              onItemsChange([
                ...items.filter((item) => item.id !== normalized.id),
                normalized,
              ].sort((left, right) => left.name.localeCompare(right.name)));
              setSecret("");
              setPassphrase("");
              setEditing(null);
              setOpen(false);
            } catch (error) {
              toast(hostsManagerError(error, t), "error", "admin", "hosts-manager");
            } finally {
              setSaving(false);
            }
          }

          async function remove(item: HostsManagerCredential) {
            if (!(await confirmDialog(t("hosts.credentials.deleteConfirm"), t))) return;
            try {
              await api.deleteHostsManagerCredential(item.id);
              onItemsChange(items.filter((candidate) => candidate.id !== item.id));
            } catch (error) {
              toast(hostsManagerError(error, t), "error", "admin", "hosts-manager");
            }
          }

          '''
          block = block[:save_start] + new_actions + block[columns_start:]
          button = 'footer={<button className="button-primary" type="submit" form="credential-form">'
          if button not in block:
              raise SystemExit('credential save button not found')
          block = block.replace(button, 'footer={<button className="button-primary" type="submit" form="credential-form" disabled={saving}>', 1)
          text = text[:start] + block + text[end:]
          app.write_text(text)

          client = Path("frontend/src/modules/hosts-manager/api/client.ts")
          client_text = client.read_text()
          old = 'saveHostsManagerCredential: (payload: Record<string, unknown>, id = "") => request<Record<string, unknown>>'
          new = 'saveHostsManagerCredential: (payload: Record<string, unknown>, id = "") => request<HostsManagerCredential>'
          if old not in client_text:
              raise SystemExit('save credential API type marker not found')
          client.write_text(client_text.replace(old, new, 1))

          test = Path("frontend/src/features/modules/hosts/HostsManagerApp.test.tsx")
          test_text = test.read_text()
          marker = '  it("keeps APMID selectors for enrollment without duplicating the management form", async () => {'
          if marker not in test_text:
              raise SystemExit('test insertion marker not found')
          regression = '''  it("shows a newly saved credential immediately without refreshing the whole workspace", async () => {
            const saved = {
              id: "c".repeat(32), name: "Proxmox test", type: "username_password" as const, username: "root@pam",
              description: "", secret_configured: true, active: true, created_at: 2, updated_at: 2,
              environment_id: null, last_used_at: null, host_count: 0, shared_with: ["hosts-manager"],
            };
            vi.mocked(api.saveHostsManagerCredential).mockResolvedValue(saved);
            const toast = vi.fn();
            render(<HostsManagerApp permissions={[...permissions, "hosts-manager.credentials.view", "hosts-manager.credentials.manage"]} t={t} toast={toast} />);
            await screen.findByText("hosts.dashboard.total");
            fireEvent.click(screen.getByRole("button", { name: /module.section.credentials/ }));
            fireEvent.click(await screen.findByRole("button", { name: "hosts.credentials.add" }));

            const dialog = screen.getByRole("dialog");
            fireEvent.change(within(dialog).getByLabelText("common.name"), { target: { value: saved.name } });
            fireEvent.change(within(dialog).getByLabelText("hosts.credentials.field.login"), { target: { value: saved.username } });
            fireEvent.change(within(dialog).getByLabelText("hosts.credentials.field.password"), { target: { value: "secret" } });
            const dashboardCalls = vi.mocked(api.hostsManagerDashboard).mock.calls.length;

            fireEvent.click(within(dialog).getByRole("button", { name: "action.save" }));

            await waitFor(() => expect(api.saveHostsManagerCredential).toHaveBeenCalledTimes(1));
            expect(await screen.findByText(saved.name)).toBeInTheDocument();
            expect(api.hostsManagerDashboard).toHaveBeenCalledTimes(dashboardCalls);
            expect(toast).not.toHaveBeenCalledWith(expect.stringContaining("CREDENTIAL_SAVE_INVALID_RESPONSE"), expect.anything(), expect.anything(), expect.anything());
          });

          '''
          if 'shows a newly saved credential immediately without refreshing the whole workspace' not in test_text:
              test_text = test_text.replace(marker, regression + marker, 1)
          test.write_text(test_text)

          Path(".github/workflows/fix-credential-save-ui.yml").unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep saved credentials visible immediately"
          git push origin HEAD:fix/hosts-manager-credential-save
