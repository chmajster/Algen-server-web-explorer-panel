name: Isolate credential regression test

on:
  push:
    branches:
      - fix/hosts-manager-credential-save

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch test isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("frontend/src/features/modules/hosts/HostsManagerApp.test.tsx")
          text = path.read_text()
          old = 'describe("HostsManagerApp", () => {\n  beforeEach(() => {\n    vi.spyOn(HTMLAnchorElement.prototype, "click")'
          new = 'describe("HostsManagerApp", () => {\n  beforeEach(() => {\n    vi.clearAllMocks();\n    vi.spyOn(HTMLAnchorElement.prototype, "click")'
          if old not in text:
              raise SystemExit("beforeEach marker not found")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/fix-credential-test-isolation.yml").unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: isolate Hosts Manager credential mocks"
          git push origin HEAD:fix/hosts-manager-credential-save
