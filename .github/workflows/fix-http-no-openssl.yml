name: Ensure default HTTP has no TLS dependency

on:
  push:
    branches:
      - feat/optional-https-settings
    paths:
      - .github/workflows/fix-http-no-openssl.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/optional-https-settings
          fetch-depth: 0
      - name: Patch TLS bootstrap behavior and test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          release = Path("scripts/webnas_release.py")
          text = release.read_text(encoding="utf-8")
          old = '''    def ensure_tls_certificate(self) -> None:
                  transport = self.transport_settings()
                  raw_cert = transport.tls_cert
          '''
          new = '''    def ensure_tls_certificate(self) -> None:
                  transport = self.transport_settings()
                  if not transport.use_https:
                      return
                  raw_cert = transport.tls_cert
          '''
          if old not in text:
              raise SystemExit("ensure_tls_certificate block not found")
          release.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("backend/tests/test_release_deployment.py")
          text = tests.read_text(encoding="utf-8")
          marker = '''def test_tls_bootstrap_reports_missing_openssl(monkeypatch, tmp_path: Path):
          '''
          if marker not in text:
              raise SystemExit("TLS bootstrap test marker not found")
          test = '''def test_http_transport_does_not_require_openssl(monkeypatch, tmp_path: Path):
              target = deployment(tmp_path)
              cert = tmp_path / "tls" / "webnas.crt"
              key = tmp_path / "tls" / "webnas.key"
              target.config.write_text(
                  f"server:\\n  use_https: false\\n  tls_cert: {cert}\\n  tls_key: {key}\\n",
                  encoding="utf-8",
              )
              monkeypatch.setattr(release_module.shutil, "which", lambda _name: None)

              target.ensure_tls_certificate()

              assert not cert.exists()
              assert not key.exists()


          '''
          tests.write_text(text.replace(marker, test + marker, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/fix-http-no-openssl.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove TLS dependency from default HTTP mode"
          git push origin HEAD:feat/optional-https-settings
