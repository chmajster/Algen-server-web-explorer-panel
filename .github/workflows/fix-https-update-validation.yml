name: Fix HTTPS-aware update validation

on:
  push:
    branches:
      - feat/optional-https-settings
    paths:
      - .github/workflows/fix-https-update-validation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/optional-https-settings
          fetch-depth: 0
      - name: Update installer transport detection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("install-standard.sh")
          text = path.read_text(encoding="utf-8")
          old = '''validate_release_installation() {
            section "Validation"
            local scheme="http"
            local curl_options=(--fail --silent --show-error --max-time 3)
            grep -Eq '^\\s*use_https:\\s*true\\s*$' "$CONFIG_FILE" && scheme="https" && curl_options+=(--insecure)
            systemctl is-active --quiet nginx || fail "Stable nginx gateway is not active"
            [[ -L "${INSTALL_DIR}/current" ]] || fail "Active release symlink is unavailable"
            [[ -f "${INSTALL_DIR}/current/frontend/dist/index.html" ]] || fail "Active frontend is unavailable"
            curl "${curl_options[@]}" "${scheme}://127.0.0.1:${PORT}/api/health" >/dev/null || fail "Public health endpoint did not survive the release handover"
            ok "Gateway, active backend, frontend and public health endpoint are ready"
          }
          '''
          new = '''effective_transport_scheme() {
            local transport_state="${DATA_DIR}/settings/transport.json"
            if [[ -f "$transport_state" ]]; then
              if grep -Eq '"use_https"[[:space:]]*:[[:space:]]*true' "$transport_state"; then
                printf '%s' "https"
              else
                printf '%s' "http"
              fi
              return
            fi
            if grep -Eq '^\\s*use_https:\\s*true\\s*$' "$CONFIG_FILE"; then
              printf '%s' "https"
            else
              printf '%s' "http"
            fi
          }

          validate_release_installation() {
            section "Validation"
            local scheme=""
            local curl_options=(--fail --silent --show-error --max-time 3)
            scheme="$(effective_transport_scheme)"
            [[ "$scheme" != "https" ]] || curl_options+=(--insecure)
            systemctl is-active --quiet nginx || fail "Stable nginx gateway is not active"
            [[ -L "${INSTALL_DIR}/current" ]] || fail "Active release symlink is unavailable"
            [[ -f "${INSTALL_DIR}/current/frontend/dist/index.html" ]] || fail "Active frontend is unavailable"
            curl "${curl_options[@]}" "${scheme}://127.0.0.1:${PORT}/api/health" >/dev/null || fail "Public health endpoint did not survive the release handover"
            ok "Gateway, active backend, frontend and public health endpoint are ready"
          }
          '''
          if old not in text:
              raise SystemExit("validate_release_installation block not found")
          text = text.replace(old, new, 1)
          old_finish = '''print_finish() {
            local ip_addr
            ip_addr="$(hostname -I 2>/dev/null | awk '{print $1}')"
            [[ -n "$ip_addr" ]] || ip_addr="IP_SERWERA"
            section "Installation complete"
            printf '%b[OK]%b WebNAS panel: http://%s:%s\\n' "$GREEN" "$RESET" "$ip_addr" "$PORT"
          '''
          new_finish = '''print_finish() {
            local scheme ip_addr
            scheme="$(effective_transport_scheme)"
            ip_addr="$(hostname -I 2>/dev/null | awk '{print $1}')"
            [[ -n "$ip_addr" ]] || ip_addr="IP_SERWERA"
            section "Installation complete"
            printf '%b[OK]%b WebNAS panel: %s://%s:%s\\n' "$GREEN" "$RESET" "$scheme" "$ip_addr" "$PORT"
          '''
          if old_finish not in text:
              raise SystemExit("print_finish block not found")
          path.write_text(text.replace(old_finish, new_finish, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/fix-https-update-validation.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Keep update health checks aligned with HTTPS settings"
          git push origin HEAD:feat/optional-https-settings
