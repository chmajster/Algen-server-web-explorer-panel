name: Fix legacy credential typing

on:
  push:
    branches:
      - feature/shared-credentials

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-credentials
          fetch-depth: 0
      - name: Fix legacy credential share typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/modules/hosts_manager/service.py')
          text = path.read_text(encoding='utf-8')
          old = '                        shares = json.dumps(list(DEFAULT_CREDENTIAL_SHARES.get(credential_type, ("hosts-manager",))))\n'
          new = '                        default_shares = DEFAULT_CREDENTIAL_SHARES[credential_type] if credential_type is not None else ("hosts-manager",)\n                        shares = json.dumps(list(default_shares))\n'
          if text.count(old) != 1:
              raise SystemExit('expected legacy credential share expression not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-legacy-credential-mypy.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: type legacy credential share defaults'
          git push origin HEAD:feature/shared-credentials
