name: Fix legacy credential sharing

on:
  push:
    branches:
      - feature/shared-credentials

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-credentials
          fetch-depth: 0
      - name: Apply legacy credential sharing fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/modules/hosts_manager/service.py')
          text = path.read_text(encoding='utf-8')
          old_import = '''from .models import (\n    ApmidInput, CredentialInput, EnrollmentTokenInput, EnvironmentInput, GroupInput, HostInput, HostnamePatternInput,\n    HostsManagerSettingsUpdate, PowerProfileInput, RepositoryInput, hostname_template_parts, render_hostname,\n)'''
          new_import = '''from .models import (\n    ApmidInput, CredentialInput, CredentialType, DEFAULT_CREDENTIAL_SHARES, EnrollmentTokenInput, EnvironmentInput, GroupInput, HostInput, HostnamePatternInput,\n    HostsManagerSettingsUpdate, PowerProfileInput, RepositoryInput, hostname_template_parts, render_hostname,\n)'''
          old_insert = '''                        target.execute("""INSERT OR IGNORE INTO credentials(id,name,type,username,description,encrypted_secret,active,created_at,updated_at,created_by,updated_by)\n                            VALUES(?,?,?,?,?,?,?,?,?,?,?)""", (item["id"], item["name"], item["type"], item.get("username", ""), item.get("description", ""), encrypted, item.get("active", 1), item["created_at"], item["updated_at"], item["created_by"], item["updated_by"]))'''
          new_insert = '''                        try:\n                            credential_type = CredentialType(str(item["type"]))\n                        except ValueError:\n                            credential_type = None\n                        shares = json.dumps(list(DEFAULT_CREDENTIAL_SHARES.get(credential_type, ("hosts-manager",))))\n                        target.execute("""INSERT OR IGNORE INTO credentials(id,name,type,username,description,encrypted_secret,active,shared_with_json,created_at,updated_at,created_by,updated_by)\n                            VALUES(?,?,?,?,?,?,?,?,?,?,?,?)""", (item["id"], item["name"], item["type"], item.get("username", ""), item.get("description", ""), encrypted, item.get("active", 1), shares, item["created_at"], item["updated_at"], item["created_by"], item["updated_by"]))'''
          if text.count(old_import) != 1 or text.count(old_insert) != 1:
              raise SystemExit('expected legacy credential migration blocks not found exactly once')
          text = text.replace(old_import, new_import, 1).replace(old_insert, new_insert, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-legacy-credential-shares.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: preserve sharing ACL during legacy credential migration'
          git push origin HEAD:feature/shared-credentials
