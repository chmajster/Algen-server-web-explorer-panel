name: Fix PR112 Bandit once

on:
  push:
    branches:
      - security/complete-privileged-broker-migration

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/complete-privileged-broker-migration
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Make broker config fallbacks explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/privileged_broker/extended_policy.py')
          text = path.read_text(encoding='utf-8')
          old_package = '''    try:\n        roots.append(Path(get_config().paths.data_dir))\n    except Exception:  # noqa: BLE001\n        pass\n    return str(base._safe_absolute_path(value, roots=roots))\n'''
          new_package = '''    try:\n        configured_root = Path(get_config().paths.data_dir)\n    except Exception:  # noqa: BLE001 - invalid/unavailable config falls back to fixed package roots.\n        configured_root = None\n    if configured_root is not None:\n        roots.append(configured_root)\n    return str(base._safe_absolute_path(value, roots=roots))\n'''
          if text.count(old_package) != 1:
              raise SystemExit('unexpected package-path fallback')
          text = text.replace(old_package, new_package, 1)

          old_mount = '''        try:\n            roots.append(Path(get_config().paths.data_dir))\n        except Exception:  # noqa: BLE001\n            pass\n        safe_path = base._safe_absolute_path(value, roots=roots)\n'''
          new_mount = '''        try:\n            configured_root = Path(get_config().paths.data_dir)\n        except Exception:  # noqa: BLE001 - invalid/unavailable config falls back to the fixed data root.\n            configured_root = None\n        if configured_root is not None:\n            roots.append(configured_root)\n        safe_path = base._safe_absolute_path(value, roots=roots)\n'''
          if text.count(old_mount) != 1:
              raise SystemExit('unexpected mount-option fallback')
          path.write_text(text.replace(old_mount, new_mount, 1), encoding='utf-8')
          PY
      - name: Install backend quality dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify quality and boundary tests
        run: |
          python -m ruff check backend scripts/export_openapi.py scripts/rollback_release.py
          python -m mypy
          python -m bandit -c pyproject.toml -r backend/app
          python -m pytest -q backend/tests/test_privileged_broker_final_boundary.py backend/tests/test_privileged_broker.py
      - name: Commit fix and remove helper workflow
        run: |
          rm .github/workflows/fix-pr112-bandit-once.yml
          git config user.name 'ChatGPT Codex Connector'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(security): make broker config fallbacks explicit'
          git push origin HEAD:security/complete-privileged-broker-migration
