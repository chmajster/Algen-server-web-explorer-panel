name: Fix PR 121 Bandit

on:
  push:
    branches:
      - feature/firewall-security-network-tools

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/firewall-security-network-tools
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Fix rollback error handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/app/modules/firewall_manager/service.py")
          text = path.read_text(encoding="utf-8")
          old = '''        except Exception:
            for item in current:
                if backend == FirewallBackend.nftables and not item.editable:
                    continue
                try:
                    self.add_rule(self._input_from_rule(item))
                except Exception:
                    pass
            raise
'''
          new = '''        except Exception as error:
            rollback_failed = False
            for item in current:
                if backend == FirewallBackend.nftables and not item.editable:
                    continue
                try:
                    self.add_rule(self._input_from_rule(item))
                except Exception:
                    rollback_failed = True
            if rollback_failed:
                raise FirewallError("firewall backup restore failed and rollback could not be completed") from error
            raise
'''
          if old not in text:
              raise SystemExit("rollback anchor missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate
        run: |
          python -m ruff check backend/app/modules/firewall_manager/service.py
          python -m mypy
          python -m bandit -c pyproject.toml -r backend/app
          python -m pytest -q backend/tests/test_firewall_manager.py backend/tests/test_privileged_broker_final_boundary.py
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-pr121-bandit.yml
          git add -A
          git commit -m "fix: surface firewall rollback failures"
          git push origin HEAD:feature/firewall-security-network-tools
