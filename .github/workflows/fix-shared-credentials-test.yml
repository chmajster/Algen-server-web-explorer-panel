name: Fix credential migration test

on:
  push:
    branches:
      - feature/shared-credentials

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-credentials
          fetch-depth: 0
      - name: Align migration test with credential ACL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/tests/test_hosts_manager.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert target.verified_credential(credential["id"], module_id="test", purpose="migration")["secret"] == "secret"\n'
          new = '    migrated_credential = next(item for item in target.credentials() if item["id"] == credential["id"])\n    assert migrated_credential["shared_with"] == ["hosts-manager", "ansible-controller"]\n    assert target.verified_credential(credential["id"], module_id="ansible-controller", purpose="migration")["secret"] == "secret"\n'
          if text.count(old) != 1:
              raise SystemExit('expected migration assertion not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-shared-credentials-test.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: align credential migration with sharing ACL'
          git push origin HEAD:feature/shared-credentials
