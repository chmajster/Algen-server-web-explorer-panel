name: Fix shared credentials follow-up

on:
  push:
    branches:
      - feature/shared-credentials

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-credentials
          fetch-depth: 0
      - name: Apply follow-up
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/modules/proxmox_manager/service.py')
          text = path.read_text(encoding='utf-8')
          old = 'if "proxmox-manager" not in set(credential.get("shared_with") or ["proxmox-manager"] if credential.get("type") == "proxmox_api" else []):'
          new = 'if "proxmox-manager" not in set(credential.get("shared_with") or (["proxmox-manager"] if credential.get("type") == "proxmox_api" else [])):'
          if text.count(old) != 1:
              raise SystemExit('expected Proxmox share check not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-shared-credentials.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: enforce Proxmox credential sharing correctly'
          git push origin HEAD:feature/shared-credentials
