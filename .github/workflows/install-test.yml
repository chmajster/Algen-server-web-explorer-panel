name: Installation smoke test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-installer-relocation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Apply final relocation fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('.')
          old_url = 'https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install.sh'
          new_url = 'https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install/install.sh'

          # All public/self-update references must follow the relocated launcher.
          for path in repo.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(old_url, new_url)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Launcher and menu download their sibling installers from install/.
          for relative in ('install/install.sh', 'install/install-standard-menu.sh'):
              path = repo / relative
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  'RAW_BASE_URL="https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main"',
                  'RAW_BASE_URL="https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install"',
                  1,
              )
              path.write_text(text, encoding='utf-8')

          # Standard installer: when executed from install/, the repository root is its parent.
          path = repo / 'install/install-standard.sh'
          text = path.read_text(encoding='utf-8')
          old = '''  local script_dir=""
          local resolved_script_dir=""
          local resolved_install_dir=""
          script_dir="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" 2>/dev/null && pwd || true)"
          resolved_script_dir="$(readlink -f "$script_dir" 2>/dev/null || printf '%s' "$script_dir")"
          resolved_install_dir="$(readlink -f "$INSTALL_DIR" 2>/dev/null || printf '%s' "$INSTALL_DIR")"
          if [[ -n "$script_dir" && -f "${script_dir}/backend/app/main.py" && -f "${script_dir}/frontend/package.json" ]]; then
            if [[ "$resolved_script_dir" == "$resolved_install_dir" && "$ACTION" != "install" ]]; then
              warn "Installer is running from the current application directory; downloading a fresh source archive before ${ACTION}"
            else
              SOURCE_DIR="$script_dir"
          '''
          new = '''  local script_dir=""
          local source_root=""
          local resolved_script_dir=""
          local resolved_install_dir=""
          script_dir="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" 2>/dev/null && pwd || true)"
          source_root="$script_dir"
          if [[ -n "$script_dir" && -f "${script_dir}/../backend/app/main.py" && -f "${script_dir}/../frontend/package.json" ]]; then
            source_root="$(cd "${script_dir}/.." 2>/dev/null && pwd || true)"
          fi
          resolved_script_dir="$(readlink -f "$source_root" 2>/dev/null || printf '%s' "$source_root")"
          resolved_install_dir="$(readlink -f "$INSTALL_DIR" 2>/dev/null || printf '%s' "$INSTALL_DIR")"
          if [[ -n "$source_root" && -f "${source_root}/backend/app/main.py" && -f "${source_root}/frontend/package.json" ]]; then
            if [[ "$resolved_script_dir" == "$resolved_install_dir" && "$ACTION" != "install" ]]; then
              warn "Installer is running from the current application directory; downloading a fresh source archive before ${ACTION}"
            else
              SOURCE_DIR="$source_root"
          '''
          if old not in text and 'local source_root=""' not in text:
              raise SystemExit('prepare_source block not found in install/install-standard.sh')
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Portable installer also moved under install/ and must copy the repository parent.
          path = repo / 'install/install-portable.sh'
          text = path.read_text(encoding='utf-8')
          marker = 'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" 2>/dev/null && pwd || true)"\n'
          if 'SOURCE_ROOT="$SCRIPT_DIR"' not in text:
              if marker not in text:
                  raise SystemExit('SCRIPT_DIR marker not found in install/install-portable.sh')
              text = text.replace(
                  marker,
                  marker
                  + 'SOURCE_ROOT="$SCRIPT_DIR"\n'
                  + 'if [[ -n "$SCRIPT_DIR" && -f "${SCRIPT_DIR}/../backend/app/main.py" && -f "${SCRIPT_DIR}/../frontend/package.json" ]]; then\n'
                  + '  SOURCE_ROOT="$(cd "${SCRIPT_DIR}/.." 2>/dev/null && pwd || true)"\n'
                  + 'fi\n',
                  1,
              )
          text = text.replace('tar -C "$SCRIPT_DIR" \\\n', 'tar -C "$SOURCE_ROOT" \\\n', 1)
          text = text.replace(
              'if [[ -n "$SCRIPT_DIR" && -f "${SCRIPT_DIR}/backend/app/main.py" && -f "${SCRIPT_DIR}/frontend/package.json" ]]; then',
              'if [[ -n "$SOURCE_ROOT" && -f "${SOURCE_ROOT}/backend/app/main.py" && -f "${SOURCE_ROOT}/frontend/package.json" ]]; then',
              1,
          )
          path.write_text(text, encoding='utf-8')

          # Keep tests aligned with the relocated files.
          replacements = {
              'backend/tests/test_install_launcher.py': {
                  'LAUNCHER = REPOSITORY / "install.sh"': 'LAUNCHER = REPOSITORY / "install" / "install.sh"',
              },
              'backend/tests/test_installer.py': {
                  'INSTALLER = REPOSITORY / "install-standard.sh"': 'INSTALLER = REPOSITORY / "install" / "install-standard.sh"',
              },
          }
          for relative, mapping in replacements.items():
              path = repo / relative
              text = path.read_text(encoding='utf-8')
              for before, after in mapping.items():
                  text = text.replace(before, after)
              path.write_text(text, encoding='utf-8')
          PY

          # Remove migration-only scaffolding and restore this smoke workflow itself.
          rm -f .github/workflows/path-migration-patch.yml .github/path-migration-trigger.txt
          git show HEAD^:.github/workflows/install-test.yml > .github/workflows/install-test.yml

          bash -n install/install.sh install/install-standard.sh install/install-standard-menu.sh install/install-portable.sh
          python3 -m py_compile backend/app/settings.py backend/app/privileged_broker/extended_policy.py \
            backend/tests/test_install_launcher.py backend/tests/test_installer.py \
            backend/tests/test_installer_authentication_bootstrap.py backend/tests/test_file_listing.py
          python3 -m pytest -q backend/tests/test_install_launcher.py backend/tests/test_installer.py \
            -k 'launcher or installer_has_valid_bash_syntax or source_archive or installation_summary or wsl or interactive_configuration'
          git diff --check

          test -f install/install.sh
          test -f install/install-standard.sh
          test -f install/install-standard-menu.sh
          test -f install/install-portable.sh
          test ! -e install.sh
          test ! -e install-standard.sh
          test ! -e install-standard-menu.sh
          test ! -e install-portable.sh
          ! git grep -n 'https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install.sh'
          ! grep -Fq 'RAW_BASE_URL="https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main"' install/install.sh install/install-standard-menu.sh
          grep -Fq 'SOURCE_DIR="$source_root"' install/install-standard.sh
          grep -Fq 'SOURCE_ROOT="$SCRIPT_DIR"' install/install-portable.sh

      - name: Commit final relocation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: complete installer relocation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
