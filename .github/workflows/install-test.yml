name: Installation smoke test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-installer-relocation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply final relocation fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('.')
          old_url = 'https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install.sh'
          new_url = 'https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install/install.sh'

          # Update every textual self-update/download reference to the relocated launcher.
          for path in repo.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(old_url, new_url)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Launcher and menu download sibling installers from install/.
          for relative in ('install/install.sh', 'install/install-standard-menu.sh'):
              path = repo / relative
              text = path.read_text(encoding='utf-8')
              before = 'RAW_BASE_URL="https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main"'
              after = 'RAW_BASE_URL="https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install"'
              text = text.replace(before, after, 1)
              path.write_text(text, encoding='utf-8')

          # Standard installer: resolve the repository root as the parent of install/.
          path = repo / 'install/install-standard.sh'
          text = path.read_text(encoding='utf-8')
          prefix, marker, tail = text.partition('prepare_source() {')
          if not marker:
              raise SystemExit('prepare_source() not found in install/install-standard.sh')
          body, end_marker, suffix = tail.partition('\n}\n\nprompt_install_dir()')
          if not end_marker:
              raise SystemExit('prepare_source() end not found in install/install-standard.sh')

          if 'local source_root=""' not in body:
              body = body.replace(
                  '  local script_dir=""\n  local resolved_script_dir=""',
                  '  local script_dir=""\n  local source_root=""\n  local resolved_script_dir=""',
                  1,
              )
              script_line = '  script_dir="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" 2>/dev/null && pwd || true)"\n'
              if script_line not in body:
                  raise SystemExit('script_dir assignment not found in prepare_source()')
              body = body.replace(
                  script_line,
                  script_line
                  + '  source_root="$script_dir"\n'
                  + '  if [[ -n "$script_dir" && -f "${script_dir}/../backend/app/main.py" && -f "${script_dir}/../frontend/package.json" ]]; then\n'
                  + '    source_root="$(cd "${script_dir}/.." 2>/dev/null && pwd || true)"\n'
                  + '  fi\n',
                  1,
              )

          body = body.replace(
              'resolved_script_dir="$(readlink -f "$script_dir" 2>/dev/null || printf \'%s\' "$script_dir")"',
              'resolved_script_dir="$(readlink -f "$source_root" 2>/dev/null || printf \'%s\' "$source_root")"',
              1,
          )
          body = body.replace(
              'if [[ -n "$script_dir" && -f "${script_dir}/backend/app/main.py" && -f "${script_dir}/frontend/package.json" ]]; then',
              'if [[ -n "$source_root" && -f "${source_root}/backend/app/main.py" && -f "${source_root}/frontend/package.json" ]]; then',
              1,
          )
          body = body.replace('SOURCE_DIR="$script_dir"', 'SOURCE_DIR="$source_root"', 1)
          text = prefix + marker + body + end_marker + suffix
          if 'SOURCE_DIR="$source_root"' not in body:
              raise SystemExit('source_root migration failed in install/install-standard.sh')
          path.write_text(text, encoding='utf-8')

          # Portable installer: copy from the repository root, not install/.
          path = repo / 'install/install-portable.sh'
          text = path.read_text(encoding='utf-8')
          script_line = 'SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" 2>/dev/null && pwd || true)"\n'
          if 'SOURCE_ROOT="$SCRIPT_DIR"' not in text:
              if script_line not in text:
                  raise SystemExit('SCRIPT_DIR assignment not found in install/install-portable.sh')
              text = text.replace(
                  script_line,
                  script_line
                  + 'SOURCE_ROOT="$SCRIPT_DIR"\n'
                  + 'if [[ -n "$SCRIPT_DIR" && -f "${SCRIPT_DIR}/../backend/app/main.py" && -f "${SCRIPT_DIR}/../frontend/package.json" ]]; then\n'
                  + '  SOURCE_ROOT="$(cd "${SCRIPT_DIR}/.." 2>/dev/null && pwd || true)"\n'
                  + 'fi\n',
                  1,
              )
          text = text.replace('tar -C "$SCRIPT_DIR" \\', 'tar -C "$SOURCE_ROOT" \\', 1)
          text = text.replace(
              'if [[ -n "$SCRIPT_DIR" && -f "${SCRIPT_DIR}/backend/app/main.py" && -f "${SCRIPT_DIR}/frontend/package.json" ]]; then',
              'if [[ -n "$SOURCE_ROOT" && -f "${SOURCE_ROOT}/backend/app/main.py" && -f "${SOURCE_ROOT}/frontend/package.json" ]]; then',
              1,
          )
          if 'tar -C "$SOURCE_ROOT" \\' not in text or 'SOURCE_ROOT="$SCRIPT_DIR"' not in text:
              raise SystemExit('source-root migration failed in install/install-portable.sh')
          path.write_text(text, encoding='utf-8')

          # Keep tests aligned with the relocated files.
          replacements = {
              'backend/tests/test_install_launcher.py': (
                  'LAUNCHER = REPOSITORY / "install.sh"',
                  'LAUNCHER = REPOSITORY / "install" / "install.sh"',
              ),
              'backend/tests/test_installer.py': (
                  'INSTALLER = REPOSITORY / "install-standard.sh"',
                  'INSTALLER = REPOSITORY / "install" / "install-standard.sh"',
              ),
          }
          for relative, (before, after) in replacements.items():
              path = repo / relative
              text = path.read_text(encoding='utf-8').replace(before, after)
              path.write_text(text, encoding='utf-8')
          PY

          # Remove migration-only scaffolding and restore the real smoke-test workflow.
          rm -f .github/workflows/path-migration-patch.yml .github/path-migration-trigger.txt
          git show d88352f617bf4e6871342eef9d574ef007f3dd54:.github/workflows/install-test.yml > .github/workflows/install-test.yml

          bash -n install/install.sh install/install-standard.sh install/install-standard-menu.sh install/install-portable.sh
          python3 -m py_compile backend/app/settings.py backend/app/privileged_broker/extended_policy.py \
            backend/tests/test_install_launcher.py backend/tests/test_installer.py \
            backend/tests/test_installer_authentication_bootstrap.py backend/tests/test_file_listing.py
          python3 -m pytest -q backend/tests/test_install_launcher.py backend/tests/test_installer.py \
            -k 'launcher or installer_has_valid_bash_syntax or source_archive or installation_summary or wsl or interactive_configuration'
          git diff --check

          test -f install/install.sh
          test -f install/install-standard.sh
          test -f install/install-standard-menu.sh
          test -f install/install-portable.sh
          test ! -e install.sh
          test ! -e install-standard.sh
          test ! -e install-standard-menu.sh
          test ! -e install-portable.sh
          ! git grep -n 'https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install.sh'
          ! grep -Fq 'RAW_BASE_URL="https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main"' install/install.sh install/install-standard-menu.sh
          grep -Fq 'SOURCE_DIR="$source_root"' install/install-standard.sh
          grep -Fq 'SOURCE_ROOT="$SCRIPT_DIR"' install/install-portable.sh
          grep -Fq 'LAUNCHER = REPOSITORY / "install" / "install.sh"' backend/tests/test_install_launcher.py
          grep -Fq 'INSTALLER = REPOSITORY / "install" / "install-standard.sh"' backend/tests/test_installer.py

      - name: Commit final relocation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: complete installer relocation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
