name: Installation smoke test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install and upgrade WebNAS on clean Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WEBNAS_TEST_PORT: "5099"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v sudo
          command -v systemctl
          sudo systemctl is-system-running >/dev/null 2>&1 || true

      - name: Run full installer
        shell: bash
        run: |
          set -euo pipefail
          sudo ./install.sh \
            --yes \
            --port "${WEBNAS_TEST_PORT}"

      - name: Verify installed files, PAM and release provenance
        shell: bash
        run: |
          set -euo pipefail
          require_check() {
            local description="$1"
            shift
            if "$@"; then
              echo "[OK] ${description}"
            else
              echo "[FAIL] ${description}" >&2
              return 1
            fi
          }

          require_check "current release symlink exists" test -L /opt/webnas/current
          require_check "backend virtualenv Python is executable" test -x /opt/webnas/current/backend/.venv/bin/python
          require_check "frontend index exists" test -f /opt/webnas/current/frontend/dist/index.html
          require_check "configuration exists" test -f /etc/webnas/config.yaml
          require_check "dedicated PAM service exists" test -f /etc/pam.d/webnas
          if grep -Eq '^[[:space:]]*(@include[[:space:]]+common-auth|auth[[:space:]]+include[[:space:]]+(common-auth|system-auth))[[:space:]]*$' /etc/pam.d/webnas; then
            echo "[OK] PAM service includes the distribution authentication policy"
          else
            echo "[FAIL] PAM service does not include the expected distribution authentication policy" >&2
            sudo cat /etc/pam.d/webnas >&2 || true
            exit 1
          fi
          if grep -Eq '^[[:space:]]*auth[[:space:]].*(login)' /etc/pam.d/webnas; then
            echo "[FAIL] PAM service falls back to login" >&2
            sudo cat /etc/pam.d/webnas >&2 || true
            exit 1
          fi
          echo "[OK] PAM service has no login fallback"
          require_check "deployment state exists" test -f /var/lib/webnas/settings/deployment.json
          require_check "installed source revision exists" test -f /opt/webnas/current/.webnas-revision

          installed_sha="$(sudo cat /opt/webnas/current/.webnas-revision)"
          expected_sha="$(git rev-parse HEAD)"
          if [[ "${installed_sha}" != "${expected_sha}" ]]; then
            echo "[FAIL] Installed source revision ${installed_sha} does not match checked-out revision ${expected_sha}" >&2
            exit 1
          fi
          echo "[OK] Installed source revision matches checked-out revision ${expected_sha}"

      - name: Verify services and HTTP health
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl is-active --quiet nginx
          active_backends="$(sudo systemctl is-active webnas-backend-blue.service webnas-backend-green.service 2>/dev/null | grep -c '^active$' || true)"
          test "${active_backends}" -eq 1

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            "http://127.0.0.1:${WEBNAS_TEST_PORT}/api/health"

          auth_config="$(curl --fail --silent --show-error "http://127.0.0.1:${WEBNAS_TEST_PORT}/api/auth/config")"
          python3 - "${auth_config}" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          assert payload.get("mode") in {"local", "system"}, payload
          PY

      - name: Seed legacy LDAP authentication database
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop webnas.service webnas-backend-blue.service webnas-backend-green.service 2>/dev/null || true
          sudo rm -f /var/lib/webnas/ldap-auth.sqlite3
          sudo python3 - <<'PY'
          import sqlite3
          path = "/var/lib/webnas/ldap-auth.sqlite3"
          db = sqlite3.connect(path)
          db.executescript("""
          CREATE TABLE ldap_settings(
              id INTEGER PRIMARY KEY, enabled INTEGER, server TEXT, port INTEGER,
              security_mode TEXT, verify_tls INTEGER, connect_timeout REAL,
              operation_timeout REAL, base_dn TEXT, user_search_base TEXT,
              user_search_filter TEXT, username_attribute TEXT, bind_dn TEXT,
              bind_secret_id TEXT, display_name_attribute TEXT, email_attribute TEXT
          );
          INSERT INTO ldap_settings VALUES(
              1,0,'ldap-upgrade.example.test',389,'starttls',1,5,10,
              'dc=example,dc=test','ou=People,dc=example,dc=test','(uid={username})',
              'uid','cn=webnas-auth,dc=example,dc=test','','cn','mail'
          );
          """)
          db.commit()
          db.close()
          PY
          sudo chown webnas:webnas /var/lib/webnas/ldap-auth.sqlite3

      - name: Run update over installed release
        shell: bash
        run: |
          set -euo pipefail
          sudo ./install.sh --yes --existing-action update --port "${WEBNAS_TEST_PORT}"

      - name: Verify upgrade migration and health
        shell: bash
        run: |
          set -euo pipefail
          test -f /etc/pam.d/webnas
          sudo /opt/webnas/current/backend/.venv/bin/python - <<'PY'
          import sqlite3
          db = sqlite3.connect('/var/lib/webnas/ldap-auth.sqlite3')
          db.row_factory = sqlite3.Row
          settings = db.execute('SELECT * FROM ldap_auth_settings_v2 WHERE id=1').fetchone()
          server = db.execute('SELECT host,port FROM ldap_auth_servers ORDER BY position LIMIT 1').fetchone()
          assert settings is not None
          assert settings['base_dn'] == 'dc=example,dc=test'
          assert server is not None
          assert server['host'] == 'ldap-upgrade.example.test'
          assert not db.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='ldap_manager_connections'").fetchone()
          db.close()
          PY
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused \
            "http://127.0.0.1:${WEBNAS_TEST_PORT}/api/health"

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "=== WebNAS filesystem ==="
          sudo find /opt/webnas -maxdepth 3 \( -type f -o -type l \) 2>/dev/null | sort | head -n 300
          echo "=== systemd status ==="
          sudo systemctl status nginx webnas webnas-backend-blue webnas-backend-green --no-pager -l
          echo "=== WebNAS journals ==="
          sudo journalctl -u nginx -u webnas -u webnas-backend-blue -u webnas-backend-green -n 250 --no-pager
          echo "=== Listening sockets ==="
          sudo ss -ltnp
          echo "=== Installer configuration ==="
          sudo cat /etc/webnas/config.yaml 2>/dev/null || true
          echo "=== Deployment state ==="
          sudo cat /var/lib/webnas/settings/deployment.json 2>/dev/null || true

      - name: Uninstall test installation
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -x /opt/webnas/uninstall.sh ]]; then
            printf 'REMOVE WEBNAS\n' | sudo /opt/webnas/uninstall.sh --yes --remove-data
          else
            sudo systemctl disable --now webnas.service webnas-backend-blue.service webnas-backend-green.service 2>/dev/null || true
            sudo rm -f /etc/systemd/system/webnas.service \
              /etc/systemd/system/webnas-backend-blue.service \
              /etc/systemd/system/webnas-backend-green.service \
              /etc/nginx/conf.d/webnas.conf
            sudo systemctl daemon-reload || true
            sudo systemctl reload nginx 2>/dev/null || true
            sudo rm -rf /opt/webnas /etc/webnas /var/lib/webnas /var/log/webnas
          fi
