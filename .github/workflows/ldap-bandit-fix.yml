name: LDAP Bandit fixer

on:
  push:
    branches: [feat/ldap-auth-manager-separation]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ldap-auth-manager-separation
      - name: Replace silent LDAP exception handling with diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/app/modules/ldap_manager/connection.py')
          text = p.read_text(encoding='utf-8')
          if 'import logging\n' not in text:
              text = text.replace('import socket\n', 'import logging\nimport socket\n', 1)
          marker = 'from .security import assert_safe_target, normalize_host\n\n\n'
          if 'logger = logging.getLogger(__name__)' not in text:
              if marker not in text:
                  raise SystemExit('connection logger marker not found')
              text = text.replace(marker, 'from .security import assert_safe_target, normalize_host\n\n\nlogger = logging.getLogger(__name__)\n\n\n', 1)
          old = '''    try:\n        bound.connection.unbind()\n    except Exception:\n        pass\n'''
          new = '''    try:\n        bound.connection.unbind()\n    except Exception as error:\n        logger.debug("ldap_manager_unbind_failed error=%s", type(error).__name__)\n'''
          if old not in text:
              raise SystemExit('connection silent exception block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('backend/app/modules/ldap_manager/service.py')
          text = p.read_text(encoding='utf-8')
          if 'import logging\n' not in text:
              text = text.replace('import io\n', 'import io\nimport logging\n', 1)
          marker = 'from .security import validate_dn\n\n\n'
          if 'logger = logging.getLogger(__name__)' not in text:
              if marker not in text:
                  raise SystemExit('service logger marker not found')
              text = text.replace(marker, 'from .security import validate_dn\n\n\nlogger = logging.getLogger(__name__)\n\n\n', 1)
          old = '''        except Exception:\n            # Dashboard counts are advisory. An unsupported subtree or ACL must\n            # not turn a healthy connection into an application error.\n            pass\n        return result\n'''
          new = '''        except Exception as error:\n            # Dashboard counts are advisory. An unsupported subtree or ACL must\n            # not turn a healthy connection into an application error.\n            logger.debug("ldap_manager_dashboard_counts_unavailable error=%s", type(error).__name__)\n        return result\n'''
          if old not in text:
              raise SystemExit('service silent exception block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/ldap-bandit-fix.yml
          git add backend/app/modules/ldap_manager/connection.py backend/app/modules/ldap_manager/service.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: log LDAP Manager cleanup diagnostics'
          git push origin HEAD:feat/ldap-auth-manager-separation
