name: LDAP final code fixer

on:
  push:
    branches: [feat/ldap-auth-manager-separation]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ldap-auth-manager-separation
      - name: Fix LDAP attribute normalization and mypy narrowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/app/modules/ldap_manager/service.py')
          text = p.read_text(encoding='utf-8')
          old = '''    def _object_classes(entry: dict[str, Any]) -> set[str]:\n        attributes = entry.get("attributes") if isinstance(entry.get("attributes"), dict) else {}\n        raw = next((value for name, value in attributes.items() if str(name).casefold() == "objectclass"), [])\n'''
          new = '''    def _object_classes(entry: dict[str, Any]) -> set[str]:\n        raw_attributes = entry.get("attributes")\n        attributes: dict[str, Any] = raw_attributes if isinstance(raw_attributes, dict) else {}\n        raw: Any = next((value for name, value in attributes.items() if str(name).casefold() == "objectclass"), [])\n'''
          if old not in text:
              raise SystemExit('LDAP Manager object-class block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('backend/app/ldap_authentication/service.py')
          text = p.read_text(encoding='utf-8')
          old = '''def _attribute(entry: dict[str, Any], name: str) -> Any:\n    if not name:\n        return ""\n    attributes = entry.get("attributes")\n    if not isinstance(attributes, dict):\n        return ""\n    value = attributes.get(name)\n    if isinstance(value, list) and len(value) == 1:\n        return value[0]\n    return value\n\n\ndef _text_attribute(entry: dict[str, Any], name: str) -> str:\n    value = _attribute(entry, name)\n    if isinstance(value, list):\n        value = value[0] if value else ""\n    if isinstance(value, bytes):\n        try:\n            return value.decode("utf-8")\n        except UnicodeDecodeError:\n            return value.hex()\n    return str(value or "")\n'''
          new = '''def _attribute(entry: dict[str, Any], name: str) -> Any:\n    if not name:\n        return ""\n    attributes = entry.get("attributes")\n    value: Any = None\n    if isinstance(attributes, dict):\n        value = attributes.get(name)\n        if value is None:\n            folded = name.casefold()\n            value = next((candidate for key, candidate in attributes.items() if str(key).casefold() == folded), None)\n    if value is None:\n        raw_attributes = entry.get("raw_attributes")\n        if isinstance(raw_attributes, dict):\n            value = raw_attributes.get(name)\n            if value is None:\n                folded = name.casefold()\n                value = next((candidate for key, candidate in raw_attributes.items() if str(key).casefold() == folded), None)\n    if isinstance(value, (list, tuple, set)) and len(value) == 1:\n        return next(iter(value))\n    return value\n\n\ndef _text_attribute(entry: dict[str, Any], name: str) -> str:\n    value = _attribute(entry, name)\n    if isinstance(value, (list, tuple, set)):\n        value = next(iter(value), "")\n    if isinstance(value, bytes):\n        try:\n            return value.decode("utf-8").strip()\n        except UnicodeDecodeError:\n            return value.hex()\n    return str(value or "").strip()\n'''
          if old not in text:
              raise SystemExit('LDAP attribute helper block not found')
          text = text.replace(old, new, 1)

          old = '''    returned = _text_attribute(entry, str(settings.get("username_attribute") or "uid"))\n    if not returned or returned.casefold() != username.casefold():\n        raise LdapInvalidCredentials("LDAP identity does not match requested username")\n'''
          new = '''    username_attribute = str(settings.get("username_attribute") or "uid")\n    returned = _text_attribute(entry, username_attribute)\n    if returned:\n        if returned.casefold() != username.casefold():\n            raise LdapInvalidCredentials("LDAP identity does not match requested username")\n    else:\n        template = str(settings.get("user_search_filter") or "(uid={username})").strip()\n        exact_filter = f"({username_attribute}={{username}})"\n        if template.casefold() != exact_filter.casefold():\n            raise LdapInvalidCredentials("LDAP identity does not match requested username")\n'''
          if old not in text:
              raise SystemExit('LDAP username verification block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git add backend/app/modules/ldap_manager/service.py backend/app/ldap_authentication/service.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: normalize LDAP attributes safely'
          git push origin HEAD:feat/ldap-auth-manager-separation
