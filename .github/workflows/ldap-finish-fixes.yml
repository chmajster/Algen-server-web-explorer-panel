name: LDAP completion fixer

on:
  push:
    branches: [feat/ldap-auth-manager-separation]

permissions:
  contents: write

concurrency:
  group: ldap-completion-fixer
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ldap-auth-manager-separation
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Apply runtime and architecture fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path: str, old: str, new: str, count: int = -1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          # Public Secrets Manager contract for cross-module consumers.
          edit(
              'backend/app/modules/secrets_manager/__init__.py',
              'from .service import SecretsManagerService, service\n\n__all__ = ["SecretsManagerService", "service"]',
              'from .models import SecretInput\nfrom .service import SecretsManagerService, service\n\n__all__ = ["SecretInput", "SecretsManagerService", "service"]',
          )
          edit(
              'backend/app/modules/ldap_manager/repository.py',
              'from ...modules.secrets_manager.models import SecretInput\nfrom ...modules.secrets_manager.service import service as secrets_service',
              'from ..secrets_manager import SecretInput, service as secrets_service',
          )
          edit(
              'backend/app/modules/ldap_manager/connection.py',
              'from ...modules.secrets_manager.service import service as secrets_service',
              'from ..secrets_manager import service as secrets_service',
          )
          edit(
              'backend/app/ldap_authentication/repository.py',
              'from ..modules.secrets_manager.models import SecretInput\nfrom ..modules.secrets_manager.service import service as secrets_service',
              'from ..modules.secrets_manager import SecretInput, service as secrets_service',
          )
          edit(
              'backend/app/ldap_authentication/service.py',
              'from ..modules.secrets_manager.service import service as secrets_service',
              'from ..modules.secrets_manager import service as secrets_service',
          )

          # Existing session DBs did not have identity_id when their indexes were first created.
          edit(
              'backend/app/security.py',
              '                CREATE INDEX IF NOT EXISTS idx_auth_sessions_identity ON auth_sessions(auth_provider,identity_id);\n',
              '',
              1,
          )

          # Every authentication-mode transition invalidates the previous security context.
          edit(
              'backend/app/auth_settings.py',
              '    changed = mode != previous\n    reauthentication_required = changed and mode == "local"',
              '    changed = mode != previous\n    reauthentication_required = changed',
          )
          edit(
              'backend/app/auth_settings.py',
              '        if reauthentication_required:\n            invalidate_all_sessions()',
              '        invalidate_all_sessions()',
          )

          # Migrate LDAP Authentication state during application startup even in Local mode.
          edit(
              'backend/app/bootstrap.py',
              'from .jobs.service import service as job_service\n',
              'from .jobs.service import service as job_service\nfrom .ldap_authentication import repository as ldap_auth_repository\n',
          )
          edit(
              'backend/app/bootstrap.py',
              '    app.state.ready = False\n    global_jobs = job_service()',
              '    app.state.ready = False\n    ldap_auth_repository().settings()\n    global_jobs = job_service()',
          )

          # ldap3 2.9.x requires integral socket timeout values on current Python runners.
          for path in ('backend/app/ldap_authentication/connection.py', 'backend/app/modules/ldap_manager/connection.py'):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = text.replace('connect_timeout=float(settings.get("connect_timeout") or 5.0)', 'connect_timeout=max(1, int(float(settings.get("connect_timeout") or 5.0)))')
              text = text.replace('receive_timeout=float(settings.get("operation_timeout") or 10.0)', 'receive_timeout=max(1, int(float(settings.get("operation_timeout") or 10.0)))')
              text = text.replace('connect_timeout=float(config.get("connect_timeout") or 5.0)', 'connect_timeout=max(1, int(float(config.get("connect_timeout") or 5.0)))')
              text = text.replace('receive_timeout=float(config.get("operation_timeout") or 15.0)', 'receive_timeout=max(1, int(float(config.get("operation_timeout") or 15.0)))')
              p.write_text(text, encoding='utf-8')

          # mypy narrowing for ldap3 response dictionaries.
          edit(
              'backend/app/modules/ldap_manager/providers/base.py',
              'def _entry(item: dict[str, Any]) -> dict[str, Any]:\n    attributes = item.get("attributes") if isinstance(item.get("attributes"), dict) else {}',
              'def _entry(item: dict[str, Any]) -> dict[str, Any]:\n    raw_attributes = item.get("attributes")\n    attributes: dict[str, Any] = raw_attributes if isinstance(raw_attributes, dict) else {}',
          )

          # Keep portable documentation contract and dedicated PAM service explicit.
          edit(
              'install-portable.sh',
              'Authentication in portable mode uses System/PAM.',
              'Authentication in portable mode uses System/PAM; portable mode does not provision Local POSIX companions.',
          )

          # Debian PAM policy is generated with @include; RPM families use auth include/system-auth.
          edit(
              '.github/workflows/install-test.yml',
              "          grep -Eq '^[[:space:]]*auth[[:space:]]+include[[:space:]]+(common-auth|system-auth)' /etc/pam.d/webnas",
              "          grep -Eq '^([[:space:]]*@include[[:space:]]+common-auth|[[:space:]]*auth[[:space:]]+include[[:space:]]+system-auth)' /etc/pam.d/webnas",
          )
          PY

          git add backend/app/modules/secrets_manager/__init__.py \
            backend/app/modules/ldap_manager/repository.py \
            backend/app/modules/ldap_manager/connection.py \
            backend/app/ldap_authentication/repository.py \
            backend/app/ldap_authentication/service.py \
            backend/app/ldap_authentication/connection.py \
            backend/app/security.py backend/app/auth_settings.py backend/app/bootstrap.py \
            backend/app/modules/ldap_manager/providers/base.py install-portable.sh .github/workflows/install-test.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: harden LDAP auth upgrade and PAM runtime'

      - name: Enforce LDAP Manager object scopes and complete exports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/app/modules/ldap_manager/service.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from typing import Any\n', 'from typing import Any, Callable\n')
          marker = '_SENSITIVE_EXPORT_ATTRIBUTES = {"userpassword", "unicodepwd", "authpassword", "krbprincipalkey", "sambantpassword", "sambalmpassword"}\n'
          addition = marker + '''\n_ENTRY_KIND_CLASSES = {\n    "user": {"person", "organizationalperson", "inetorgperson", "user", "posixaccount"},\n    "group": {"group", "groupofnames", "groupofuniquenames", "posixgroup"},\n    "ou": {"organizationalunit", "container"},\n}\n'''
          if marker not in text:
              raise SystemExit('service marker missing')
          text = text.replace(marker, addition, 1)

          old = '''    def _provider(self, connection_id: str):\n        return provider_for(self._config(connection_id))\n'''
          new = old + '''\n    @staticmethod\n    def _object_classes(entry: dict[str, Any]) -> set[str]:\n        attributes = entry.get("attributes") if isinstance(entry.get("attributes"), dict) else {}\n        raw = next((value for name, value in attributes.items() if str(name).casefold() == "objectclass"), [])\n        values = raw if isinstance(raw, list) else [raw]\n        return {str(value).casefold() for value in values if str(value).strip()}\n\n    @classmethod\n    def _assert_entry_kind(cls, provider: Any, dn: str, kind: str) -> None:\n        expected = _ENTRY_KIND_CLASSES[kind]\n        if not (cls._object_classes(provider.entry(dn)) & expected):\n            raise ValueError(f"LDAP entry is not a {kind} object")\n\n    @staticmethod\n    def _assert_payload_kind(payload: DirectoryCreateRequest, kind: str) -> None:\n        classes = {str(value).casefold() for value in payload.object_classes}\n        if not (classes & _ENTRY_KIND_CLASSES[kind]):\n            raise ValueError(f"LDAP objectClass set is not valid for {kind} creation")\n\n    @staticmethod\n    def _collect_pages(fetch_page: Callable[[str], dict[str, Any]], *, initial_cookie: str = "") -> list[dict[str, Any]]:\n        items: list[dict[str, Any]] = []\n        cookie = initial_cookie\n        seen = {cookie} if cookie else set()\n        while True:\n            page = fetch_page(cookie)\n            page_items = page.get("items")\n            if not isinstance(page_items, list):\n                raise ProviderOperationError("LDAP_PAGING_FAILED", "LDAP provider returned an invalid page")\n            items.extend(item for item in page_items if isinstance(item, dict))\n            if len(items) > 100_000:\n                raise ValueError("LDAP export is limited to 100000 entries")\n            next_cookie = str(page.get("cookie") or "")\n            if not next_cookie:\n                return items\n            if next_cookie in seen:\n                raise ProviderOperationError("LDAP_PAGING_FAILED", "LDAP provider repeated a paging cookie")\n            seen.add(next_cookie)\n            cookie = next_cookie\n'''
          if old not in text:
              raise SystemExit('provider method marker missing')
          text = text.replace(old, new, 1)

          old_block = '''    def create_entry(self, connection_id: str, payload: DirectoryCreateRequest) -> dict[str, Any]:\n        return self._provider(connection_id).create(payload.dn, payload.object_classes, payload.attributes)\n\n    def update_entry(self, connection_id: str, dn: str, payload: DirectoryUpdateRequest) -> dict[str, Any]:\n        return self._provider(connection_id).update(dn, payload.attributes, payload.delete_attributes)\n\n    def delete_entry(self, connection_id: str, dn: str) -> None:\n        self._provider(connection_id).delete(dn)\n\n    def move_entry(self, connection_id: str, dn: str, payload: DirectoryMoveRequest) -> str:\n        return self._provider(connection_id).move(dn, payload.new_rdn, payload.new_superior)\n\n    def reset_password(self, connection_id: str, dn: str, password: str, force_change: bool) -> None:\n        self._provider(connection_id).reset_password(dn, password, force_change)\n\n    def set_enabled(self, connection_id: str, dn: str, enabled: bool) -> None:\n        self._provider(connection_id).set_enabled(dn, enabled)\n\n    def unlock(self, connection_id: str, dn: str) -> None:\n        self._provider(connection_id).unlock(dn)\n\n    def add_member(self, connection_id: str, group_dn: str, member_dn: str) -> None:\n        self._provider(connection_id).add_member(group_dn, member_dn)\n\n    def remove_member(self, connection_id: str, group_dn: str, member_dn: str) -> None:\n        self._provider(connection_id).remove_member(group_dn, member_dn)\n'''
          new_block = '''    def create_entry(self, connection_id: str, payload: DirectoryCreateRequest, *, kind: str) -> dict[str, Any]:\n        self._assert_payload_kind(payload, kind)\n        return self._provider(connection_id).create(payload.dn, payload.object_classes, payload.attributes)\n\n    def update_entry(self, connection_id: str, dn: str, payload: DirectoryUpdateRequest, *, kind: str) -> dict[str, Any]:\n        provider = self._provider(connection_id)\n        self._assert_entry_kind(provider, dn, kind)\n        return provider.update(dn, payload.attributes, payload.delete_attributes)\n\n    def delete_entry(self, connection_id: str, dn: str, *, kind: str) -> None:\n        provider = self._provider(connection_id)\n        self._assert_entry_kind(provider, dn, kind)\n        provider.delete(dn)\n\n    def move_entry(self, connection_id: str, dn: str, payload: DirectoryMoveRequest, *, kind: str) -> str:\n        provider = self._provider(connection_id)\n        self._assert_entry_kind(provider, dn, kind)\n        return provider.move(dn, payload.new_rdn, payload.new_superior)\n\n    def reset_password(self, connection_id: str, dn: str, password: str, force_change: bool) -> None:\n        provider = self._provider(connection_id)\n        self._assert_entry_kind(provider, dn, "user")\n        provider.reset_password(dn, password, force_change)\n\n    def set_enabled(self, connection_id: str, dn: str, enabled: bool) -> None:\n        provider = self._provider(connection_id)\n        self._assert_entry_kind(provider, dn, "user")\n        provider.set_enabled(dn, enabled)\n\n    def unlock(self, connection_id: str, dn: str) -> None:\n        provider = self._provider(connection_id)\n        self._assert_entry_kind(provider, dn, "user")\n        provider.unlock(dn)\n\n    def add_member(self, connection_id: str, group_dn: str, member_dn: str) -> None:\n        provider = self._provider(connection_id)\n        self._assert_entry_kind(provider, group_dn, "group")\n        provider.add_member(group_dn, member_dn)\n\n    def remove_member(self, connection_id: str, group_dn: str, member_dn: str) -> None:\n        provider = self._provider(connection_id)\n        self._assert_entry_kind(provider, group_dn, "group")\n        provider.remove_member(group_dn, member_dn)\n'''
          if old_block not in text:
              raise SystemExit('typed CRUD block missing')
          text = text.replace(old_block, new_block, 1)

          old_csv = '''    def export_csv(self, connection_id: str, kind: str) -> str:\n        provider = self._provider(connection_id)\n        result = provider.users(page_size=1000) if kind == "users" else provider.groups(page_size=1000)\n        items = result["items"]\n'''
          new_csv = '''    def export_csv(self, connection_id: str, kind: str) -> str:\n        provider = self._provider(connection_id)\n        fetch_page = (\n            (lambda cookie: provider.users(page_size=1000, cookie=cookie))\n            if kind == "users"\n            else (lambda cookie: provider.groups(page_size=1000, cookie=cookie))\n        )\n        items = self._collect_pages(fetch_page)\n'''
          if old_csv not in text:
              raise SystemExit('csv export block missing')
          text = text.replace(old_csv, new_csv, 1)

          old_ldif = '''    def export_ldif(self, connection_id: str, payload: SearchRequest) -> str:\n        items = self.search(connection_id, payload)["items"]\n'''
          new_ldif = '''    def export_ldif(self, connection_id: str, payload: SearchRequest) -> str:\n        provider = self._provider(connection_id)\n        items = self._collect_pages(\n            lambda cookie: provider.search(\n                base_dn=payload.base_dn,\n                scope=payload.scope,\n                ldap_filter=payload.ldap_filter,\n                attributes=payload.attributes,\n                page_size=payload.page_size,\n                cookie=cookie,\n            ),\n            initial_cookie=payload.cookie,\n        )\n'''
          if old_ldif not in text:
              raise SystemExit('ldif export block missing')
          text = text.replace(old_ldif, new_ldif, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('backend/app/modules/ldap_manager/router.py')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'service().create_entry(connection_id, payload))': 'service().create_entry(connection_id, payload, kind="user"))',
              'service().update_entry(connection_id, dn, payload))': 'service().update_entry(connection_id, dn, payload, kind="user"))',
              'service().delete_entry(connection_id, dn))': 'service().delete_entry(connection_id, dn, kind="user"))',
              'service().move_entry(connection_id, dn, payload))': 'service().move_entry(connection_id, dn, payload, kind="user"))',
          }
          # Replace occurrences by route order: users first, then groups, then OUs.
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'router user target missing: {old}')
              text = text.replace(old, new, 1)
          group_replacements = {
              'service().create_entry(connection_id, payload))': 'service().create_entry(connection_id, payload, kind="group"))',
              'service().update_entry(connection_id, dn, payload))': 'service().update_entry(connection_id, dn, payload, kind="group"))',
              'service().delete_entry(connection_id, dn))': 'service().delete_entry(connection_id, dn, kind="group"))',
          }
          for old, new in group_replacements.items():
              if old not in text:
                  raise SystemExit(f'router group target missing: {old}')
              text = text.replace(old, new, 1)
          ou_replacements = {
              'service().create_entry(connection_id, payload))': 'service().create_entry(connection_id, payload, kind="ou"))',
              'service().update_entry(connection_id, dn, payload))': 'service().update_entry(connection_id, dn, payload, kind="ou"))',
              'service().move_entry(connection_id, dn, payload))': 'service().move_entry(connection_id, dn, payload, kind="ou"))',
              'service().delete_entry(connection_id, dn))': 'service().delete_entry(connection_id, dn, kind="ou"))',
          }
          for old, new in ou_replacements.items():
              if old not in text:
                  raise SystemExit(f'router OU target missing: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

          git add backend/app/modules/ldap_manager/service.py backend/app/modules/ldap_manager/router.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: enforce LDAP Manager object RBAC boundaries'

      - name: Add regression coverage and fix test contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('backend/tests/test_ldap_auth.py')
          text = p.read_text(encoding='utf-8')
          if 'from importlib import import_module\n' not in text:
              text = text.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nfrom importlib import import_module\n')
          if 'ldap_auth_repository_module = import_module(' not in text:
              text = text.replace('from app.security import SessionStore\n', 'from app.security import SessionStore\n\n\nldap_auth_repository_module = import_module("app.ldap_authentication.repository")\n')
          text = text.replace('monkeypatch.setattr("app.ldap_authentication.repository.secrets_service", lambda: fake)', 'monkeypatch.setattr(ldap_auth_repository_module, "secrets_service", lambda: fake)')
          text = text.replace('monkeypatch.setattr("app.ldap_authentication.repository.identity_repository", lambda: fake_identity_repo)', 'monkeypatch.setattr(ldap_auth_repository_module, "identity_repository", lambda: fake_identity_repo)')
          p.write_text(text, encoding='utf-8')

          p = Path('backend/tests/integration/test_ldap_openldap.py')
          text = p.read_text(encoding='utf-8')
          old = 'pytestmark = pytest.mark.skipif(not HOST, reason="real OpenLDAP integration environment is not configured")'
          new = '''pytestmark = [\n    pytest.mark.integration,\n    pytest.mark.system,\n    pytest.mark.skipif(not HOST, reason="real OpenLDAP integration environment is not configured"),\n]'''
          if old not in text:
              raise SystemExit('integration pytestmark missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('backend/tests/test_security_session.py')
          text = p.read_text(encoding='utf-8')
          test = '''\n\ndef test_session_store_migrates_pre_identity_schema(tmp_path):\n    path = tmp_path / "legacy-sessions.sqlite3"\n    with sqlite3.connect(path) as connection:\n        connection.executescript(\n            """\n            CREATE TABLE auth_sessions (\n                token_hash TEXT PRIMARY KEY,\n                username TEXT NOT NULL,\n                csrf_token TEXT NOT NULL,\n                persistent INTEGER NOT NULL DEFAULT 0,\n                created_at REAL NOT NULL,\n                expires_at REAL NOT NULL\n            );\n            CREATE INDEX idx_auth_sessions_expiry ON auth_sessions(expires_at);\n            CREATE INDEX idx_auth_sessions_user ON auth_sessions(username);\n            """\n        )\n    store = security.SessionStore(path, "pepper", cache_ttl_seconds=0)\n    with store._connect() as connection:\n        columns = {row["name"] for row in connection.execute("PRAGMA table_info(auth_sessions)").fetchall()}\n        indexes = {row["name"] for row in connection.execute("PRAGMA index_list(auth_sessions)").fetchall()}\n    assert {"auth_provider", "identity_id"} <= columns\n    assert "idx_auth_sessions_identity" in indexes\n'''
          if 'test_session_store_migrates_pre_identity_schema' not in text:
              text += test
          p.write_text(text, encoding='utf-8')

          p = Path('backend/tests/test_ldap_manager.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('from app.modules.ldap_manager.models import ConnectionInput\n', 'from app.modules.ldap_manager.models import ConnectionInput, DirectoryUpdateRequest\n')
          if 'from app.modules.ldap_manager.service import LdapManagerService\n' not in text:
              text = text.replace('from app.modules.ldap_manager.repository import LdapManagerRepository\n', 'from app.modules.ldap_manager.repository import LdapManagerRepository\nfrom app.modules.ldap_manager.service import LdapManagerService\n')
          tests = '''\n\nclass FakeTypedProvider:\n    def __init__(self, classes: list[str]) -> None:\n        self.classes = classes\n        self.updated = False\n\n    def entry(self, dn: str):\n        return {"dn": dn, "attributes": {"objectClass": self.classes}}\n\n    def update(self, dn: str, attributes, delete_attributes):\n        self.updated = True\n        return self.entry(dn)\n\n\ndef test_ou_scope_rejects_user_entry(monkeypatch):\n    manager = LdapManagerService(object())  # type: ignore[arg-type]\n    provider = FakeTypedProvider(["top", "person", "inetOrgPerson"])\n    monkeypatch.setattr(manager, "_provider", lambda connection_id: provider)\n    with pytest.raises(ValueError, match="not a ou object"):\n        manager.update_entry(\n            "connection",\n            "uid=alice,ou=People,dc=example,dc=test",\n            DirectoryUpdateRequest(attributes={"description": "x"}),\n            kind="ou",\n        )\n    assert provider.updated is False\n\n\ndef test_export_csv_follows_all_paging_cookies(monkeypatch):\n    manager = LdapManagerService(object())  # type: ignore[arg-type]\n\n    class PagedProvider:\n        def users(self, *, page_size=100, cookie="", search=""):\n            if not cookie:\n                return {"items": [{"dn": "uid=a", "attributes": {"uid": "a"}}], "cookie": "next"}\n            return {"items": [{"dn": "uid=b", "attributes": {"uid": "b"}}], "cookie": ""}\n\n    monkeypatch.setattr(manager, "_provider", lambda connection_id: PagedProvider())\n    exported = manager.export_csv("connection", "users")\n    assert "uid=a" in exported\n    assert "uid=b" in exported\n'''
          if 'test_ou_scope_rejects_user_entry' not in text:
              text += tests
          p.write_text(text, encoding='utf-8')
          PY

          git add backend/tests/test_ldap_auth.py backend/tests/integration/test_ldap_openldap.py \
            backend/tests/test_security_session.py backend/tests/test_ldap_manager.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: cover LDAP upgrade RBAC and paging regressions'

      - name: Update release metadata and documentation
        shell: bash
        run: |
          if [ "$(cat VERSION)" = "0.1.30" ]; then
            python scripts/sync-version.py --bump patch
          else
            python scripts/sync-version.py --check
          fi
          python - <<'PY'
          from pathlib import Path

          p = Path('CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          marker = '## Unreleased\n'
          entry = '''## Unreleased\n\n## v0.1.31 — 2026-08-30\n\n- Separated LDAP Authentication in Settings from the independently installable LDAP Manager, including independent configuration databases and Secrets Manager credentials.\n- Added multi-server LDAP authentication failover, immutable directory identities, LDAP group-to-WebNAS RBAC mapping, access policies, diagnostics, session policy refresh, and explicit Local/PAM/LDAP provider selection without cross-provider password fallback.\n- Added LDAP Manager support for multiple LDAP/Active Directory/FreeIPA connections, directory browsing, users, groups, OUs, schema, paged search/export, bulk operations, provider-aware password controls, granular RBAC, audit logging, and injection/TLS/SSRF protections.\n- Hardened PAM to use only `/etc/pam.d/webnas`, added installer/upgrade migration validation and real OpenLDAP CI coverage, and fixed legacy session migration, object-scope authorization, paging, and TLS compatibility regressions found during review.\n'''
          if '## v0.1.31' not in text:
              if marker not in text:
                  raise SystemExit('changelog marker missing')
              text = text.replace(marker, entry, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '| **Authentication** | Default WebNAS local-user database, or mutually exclusive system mode with PAM and optional LDAP/StartTLS/LDAPS |',
              '| **Authentication** | Default WebNAS local-user database, or system mode with explicit PAM or LDAP login; LDAP Authentication is configured in Settings and remains independent from LDAP Manager |',
          )
          if '- LDAP Manager' not in text:
              text = text.replace('- Secrets Manager\n', '- Secrets Manager\n- LDAP Manager (remote OpenLDAP / Active Directory / FreeIPA administration)\n', 1)
          docs_marker = '## Installation\n'
