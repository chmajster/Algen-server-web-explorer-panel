name: Repair PR 121

on:
  push:
    branches:
      - feature/firewall-security-network-tools

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/firewall-security-network-tools
          fetch-depth: 0
      - name: Repair branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge -X theirs origin/main -m "merge: synchronize PR 121 with main"; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              git checkout --theirs -- "$path" 2>/dev/null || git rm -f --ignore-unmatch -- "$path"
            done < <(git diff --name-only --diff-filter=U)
            git add -A
            git commit --no-edit
          fi
          python .github/scripts/repair_pr121.py
          rm -f .github/workflows/module-hardening-fixes.yml .github/scripts/repair_pr121.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: synchronize and repair PR 121"
          fi
          git push origin HEAD:feature/firewall-security-network-tools
