name: NTP OpenAPI contract generator

on:
  push:
    branches:
      - feat/ntp-manager
    paths:
      - .github/workflows/ntp-generate-contract.yml
      - backend/app/modules/ntp_manager/**
      - backend/app/modules/infrastructure_permissions.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Normalize NTP source identity
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("frontend/src/modules/ntp-manager/NtpManagerApp.tsx")
          text = path.read_text(encoding="utf-8")
          old = '  return `${source.kind || "server"}:${source.server}`;'
          new = '  return source.server;'
          if old not in text and new not in text:
              raise SystemExit("NTP source identity function not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate OpenAPI TypeScript contract
        working-directory: frontend
        run: npm run api:generate
      - name: Commit generated contract and normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/generated/api-types.ts frontend/src/modules/ntp-manager/NtpManagerApp.tsx
          if git diff --cached --quiet; then
            echo "NTP sources and OpenAPI contract already current"
            exit 0
          fi
          git commit -m "fix(ntp): normalize managed source identity"
          git push origin HEAD:feat/ntp-manager
