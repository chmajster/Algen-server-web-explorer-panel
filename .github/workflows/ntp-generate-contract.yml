name: NTP OpenAPI contract generator

on:
  push:
    branches:
      - feat/ntp-manager
    paths:
      - .github/workflows/ntp-generate-contract.yml
      - backend/app/modules/ntp_manager/**
      - backend/app/modules/infrastructure_permissions.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate OpenAPI TypeScript contract
        working-directory: frontend
        run: npm run api:generate
      - name: Commit generated contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/generated/api-types.ts
          if git diff --cached --quiet; then
            echo "OpenAPI contract already current"
            exit 0
          fi
          git commit -m "chore(api): regenerate OpenAPI contract"
          git push origin HEAD:feat/ntp-manager
