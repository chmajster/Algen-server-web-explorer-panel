name: NTP OpenAPI contract generator

on:
  push:
    branches:
      - feat/ntp-manager
    paths:
      - .github/workflows/ntp-generate-contract.yml
      - backend/app/modules/ntp_manager/**
      - backend/app/modules/infrastructure_permissions.py
      - frontend/src/generated/api-types.ts

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate OpenAPI TypeScript contract
        working-directory: frontend
        run: npm run api:generate
      - uses: actions/upload-artifact@v7
        with:
          name: ntp-api-types
          path: frontend/src/generated/api-types.ts
          retention-days: 1
