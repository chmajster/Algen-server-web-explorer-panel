name: One-off test alignment patch

on:
  push:
    branches:
      - feature/proxmox-manager-shared-host-registry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/proxmox-manager-shared-host-registry

      - name: Align tests and manifest with installer split
        shell: python
        run: |
          from pathlib import Path

          patches = {
              "backend/tests/test_installer.py": [
                  ('INSTALLER = REPOSITORY / "install.sh"', 'INSTALLER = REPOSITORY / "install-standard.sh"'),
              ],
              "backend/tests/test_file_listing.py": [
                  ('installer = (repository / "install.sh").read_text(encoding="utf-8")', 'installer = (repository / "install-standard.sh").read_text(encoding="utf-8")'),
              ],
              "backend/app/modules/proxmox-manager/manifest.yaml": [
                  ('  primary_file: ""', '  primary_file: null'),
              ],
              "backend/tests/test_proxmox_manager.py": [
                  ('from typing import Any\n\nimport app.modules.proxmox_manager.service as proxmox_module', 'import importlib\nfrom typing import Any\n\nproxmox_module = importlib.import_module("app.modules.proxmox_manager.service")'),
              ],
          }

          for filename, changes in patches.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in changes:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected exactly one occurrence, found {count}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_installer.py backend/tests/test_file_listing.py backend/app/modules/proxmox-manager/manifest.yaml backend/tests/test_proxmox_manager.py
          git commit -m "fix: align tests with split installer and Proxmox manifest"
          git push origin HEAD:feature/proxmox-manager-shared-host-registry
