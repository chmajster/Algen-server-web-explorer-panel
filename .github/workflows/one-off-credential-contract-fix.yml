name: One-off credential contract fix

on:
  push:
    branches:
      - feature/proxmox-manager-shared-host-registry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/proxmox-manager-shared-host-registry

      - name: Fix Hosts Manager credential type extension
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/src/core/api/contracts.ts")
          text = path.read_text(encoding="utf-8")
          old = 'export type HostsManagerCredential = AnsibleCredential & {'
          new = 'export type HostsManagerCredential = Omit<AnsibleCredential, "type"> & {'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one HostsManagerCredential declaration, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/core/api/contracts.ts
          git commit -m "fix: preserve extended Hosts Manager credential types"
          git push origin HEAD:feature/proxmox-manager-shared-host-registry
