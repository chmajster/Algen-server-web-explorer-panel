name: One-off DHCP finalization

on:
  push:
    branches:
      - feature/dhcp-manager

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/dhcp-manager
      - name: Generate final DHCP tests, docs and release metadata
        run: python .tmp_finalize_dhcp.py
      - name: Commit finalization
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .tmp_finalize_dhcp.py .github/workflows/one-off-dhcp-finalize.yml
          git add DHCP_MANAGER.md README.md MODULES.md INFRASTRUCTURE_MODULES.md PACKAGE_CENTER.md CHANGELOG.md \
            frontend/src/features/modules/dhcp/DhcpManagerApp.test.tsx \
            pyproject.toml backend/app/__init__.py backend/app/bootstrap.py backend/tests/test_host_info.py \
            frontend/package.json frontend/package-lock.json frontend/src/features/settings/SettingsApp.tsx frontend/src/features/settings/SettingsApp.test.tsx
          git commit -m "test: finalize DHCP Manager documentation and UI coverage"
          git push origin HEAD:feature/dhcp-manager
