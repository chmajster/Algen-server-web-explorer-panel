name: One-off DHCP lease filter fix

on:
  push:
    branches:
      - feature/dhcp-manager

permissions:
  contents: write

jobs:
  fix:
    if: "github.event.head_commit.message == 'ci: run DHCP lease filter fix'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Fix stale lease filter state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/features/modules/dhcp/DhcpManagerApp.tsx')
          text = path.read_text()

          old_loader = '''  async function loadLeases() { try { setLeases((await api.dhcpLeases({ search: leaseSearch, subnet_id: leaseSubnet, state: leaseState })).items); } catch (reason) { setError(reason instanceof Error ? reason.message : t("error.generic")); } }'''
          new_loader = '''  async function loadLeases(filters: Partial<{ search: string; subnet_id: string; state: string }> = {}) { try { setLeases((await api.dhcpLeases({ search: filters.search ?? leaseSearch, subnet_id: filters.subnet_id ?? leaseSubnet, state: filters.state ?? leaseState })).items); } catch (reason) { setError(reason instanceof Error ? reason.message : t("error.generic")); } }'''
          old_subnet = '''onChange={(event) => { setLeaseSubnet(event.target.value); window.setTimeout(() => void loadLeases(), 0); }}'''
          new_subnet = '''onChange={(event) => { const nextSubnet = event.target.value; setLeaseSubnet(nextSubnet); void loadLeases({ subnet_id: nextSubnet }); }}'''
          old_state = '''onChange={(event) => { setLeaseState(event.target.value); window.setTimeout(() => void loadLeases(), 0); }}'''
          new_state = '''onChange={(event) => { const nextState = event.target.value; setLeaseState(nextState); void loadLeases({ state: nextState }); }}'''

          for old, new in ((old_loader, new_loader), (old_subnet, new_subnet), (old_state, new_state)):
              if old not in text:
                  raise SystemExit(f'expected source fragment not found: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate DHCP frontend fix
        working-directory: frontend
        run: |
          npx vitest run src/features/modules/dhcp/DhcpManagerApp.test.tsx --reporter=verbose
          npm run lint
          npm run typecheck
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/modules/dhcp/DhcpManagerApp.tsx
          git commit -m "fix: apply DHCP lease filters immediately"
          git push origin HEAD:feature/dhcp-manager
