name: One-off DHCP mypy fix

on:
  push:
    branches:
      - feature/dhcp-manager

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/dhcp-manager
      - name: Normalize DHCP typing
        shell: python
        run: |
          from pathlib import Path

          system = Path("backend/app/modules/dhcp/system.py")
          text = system.read_text(encoding="utf-8")
          text = text.replace("from typing import Any\n", "from typing import Any, Literal\n", 1)
          text = text.replace('        root = payload.get("Dhcp4", {}) if isinstance(payload, dict) else {}\n', '        raw_root = payload.get("Dhcp4") if isinstance(payload, dict) else None\n        root: dict[str, Any] = raw_root if isinstance(raw_root, dict) else {}\n', 1)
          text = text.replace('            context = row.get("user-context") if isinstance(row.get("user-context"), dict) else {}\n', '            raw_context = row.get("user-context")\n            context: dict[str, Any] = raw_context if isinstance(raw_context, dict) else {}\n', 1)
          text = text.replace('        interfaces = root.get("interfaces-config", {}).get("interfaces", []) if isinstance(root.get("interfaces-config"), dict) else []\n', '        raw_interfaces = root.get("interfaces-config")\n        interfaces_config: dict[str, Any] = raw_interfaces if isinstance(raw_interfaces, dict) else {}\n        interfaces = interfaces_config.get("interfaces") or []\n', 1)
          text = text.replace('            state = "active" if expire > now and state_raw in {"0", "default", "active"} else "declined" if state_raw in {"1", "declined"} else "expired"\n', '            state: Literal["active", "expired", "declined", "released", "unknown"] = "active" if expire > now and state_raw in {"0", "default", "active"} else "declined" if state_raw in {"1", "declined"} else "expired"\n', 1)
          text = text.replace('            state = "active" if raw_state == "active" and (end_ts is None or end_ts > now) else "expired" if raw_state in {"free", "expired", "backup"} or (end_ts and end_ts <= now) else "released" if raw_state == "released" else "unknown"\n', '            state: Literal["active", "expired", "declined", "released", "unknown"] = "active" if raw_state == "active" and (end_ts is None or end_ts > now) else "expired" if raw_state in {"free", "expired", "backup"} or (end_ts is not None and end_ts <= now) else "released" if raw_state == "released" else "unknown"\n', 1)
          system.write_text(text, encoding="utf-8")

          service = Path("backend/app/modules/dhcp/service.py")
          text = service.read_text(encoding="utf-8")
          text = text.replace("from typing import Any\n", "from typing import Any, Literal, cast\n", 1)
          text = text.replace('            subnet = subnet_by_native.get(lease.subnet_id)\n            if subnet is None:\n', '            matched_subnet = subnet_by_native.get(lease.subnet_id)\n            if matched_subnet is None:\n', 1)
          text = text.replace('                    subnet = next((item for item in config.subnets if address in ipaddress.ip_network(item.cidr)), None)\n', '                    matched_subnet = next((item for item in config.subnets if address in ipaddress.IPv4Network(item.cidr, strict=True)), None)\n', 1)
          text = text.replace('                    subnet = None\n            values.append(lease.model_copy(update={\n                "subnet_id": subnet.id if subnet else lease.subnet_id,\n                "subnet": subnet.cidr if subnet else "",\n', '                    matched_subnet = None\n            values.append(lease.model_copy(update={\n                "subnet_id": matched_subnet.id if matched_subnet else lease.subnet_id,\n                "subnet": matched_subnet.cidr if matched_subnet else "",\n', 1)
          text = text.replace('            network = ipaddress.ip_network(subnet.cidr)\n', '            network = ipaddress.IPv4Network(subnet.cidr, strict=True)\n', 1)
          text = text.replace('            subnet = subnet_map.get(reservation.subnet_id)\n            if not subnet:\n', '            reservation_subnet = subnet_map.get(reservation.subnet_id)\n            if not reservation_subnet:\n', 1)
          text = text.replace('            network = ipaddress.ip_network(subnet.cidr)\n', '            network = ipaddress.IPv4Network(reservation_subnet.cidr, strict=True)\n', 1)
          text = text.replace('                issues.append(DhcpValidationIssue(level="error", code="RESERVATION_OUTSIDE_SUBNET", message=f"Reservation {reservation.ipv4_address} is outside {subnet.cidr}", object_id=reservation.id))\n            start, end = self._pool_bounds(subnet)\n', '                issues.append(DhcpValidationIssue(level="error", code="RESERVATION_OUTSIDE_SUBNET", message=f"Reservation {reservation.ipv4_address} is outside {reservation_subnet.cidr}", object_id=reservation.id))\n            start, end = self._pool_bounds(reservation_subnet)\n', 1)
          text = text.replace('            level = "emergency" if usage > thresholds.emergency else "critical" if usage > thresholds.critical else "warning" if usage > thresholds.warning else "normal"\n', '            level: Literal["normal", "warning", "critical", "emergency"] = "emergency" if usage >= thresholds.emergency else "critical" if usage >= thresholds.critical else "warning" if usage >= thresholds.warning else "normal"\n', 1)
          text = text.replace('        health = "not_installed" if not installed or backend == DhcpBackend.none else "failed" if state == "failed" else "healthy" if state == "active" and validation and validation.ok else "degraded" if state in {"active", "inactive", "failed"} else "unknown"\n', '        health: Literal["healthy", "degraded", "failed", "unknown", "not_installed"] = "not_installed" if not installed or backend == DhcpBackend.none else "failed" if state == "failed" else "healthy" if state == "active" and validation and validation.ok else "degraded" if state in {"active", "inactive", "failed"} else "unknown"\n', 1)
          text = text.replace('        state_data = self._read_state()\n        return DhcpStatus(\n', '        state_data = self._read_state()\n        updated_at = state_data.get("updated_at")\n        last_config_change = float(updated_at) if isinstance(updated_at, (int, float)) else None\n        return DhcpStatus(\n', 1)
          text = text.replace('            last_config_change=float(state_data.get("updated_at")) if state_data.get("updated_at") else None,\n', '            last_config_change=last_config_change,\n', 1)
          text = text.replace('            subnet = next((item for item in config.subnets if item.id == object_id), None)\n            if not subnet:\n                raise DhcpNotFoundError("subnet not found")\n            subnet.enabled = operation == "subnet_enable"\n', '            target_subnet = next((item for item in config.subnets if item.id == object_id), None)\n            if not target_subnet:\n                raise DhcpNotFoundError("subnet not found")\n            target_subnet.enabled = operation == "subnet_enable"\n', 1)
          text = text.replace('            reservation = next((item for item in config.reservations if item.id == object_id), None)\n            if not reservation:\n                raise DhcpNotFoundError("reservation not found")\n            reservation.enabled = operation == "reservation_enable"\n', '            target_reservation = next((item for item in config.reservations if item.id == object_id), None)\n            if not target_reservation:\n                raise DhcpNotFoundError("reservation not found")\n            target_reservation.enabled = operation == "reservation_enable"\n', 1)
          text = text.replace('        reservation = DhcpReservation(\n            id=uuid4().hex, hostname=hostname, mac_address=lease.mac_address, ipv4_address=lease.ipv4_address,\n', '        dns_provider_raw = str(values.get("dns_provider") or "auto")\n        dns_provider = cast(Literal["auto", "pihole", "adguard-home"], dns_provider_raw if dns_provider_raw in {"auto", "pihole", "adguard-home"} else "auto")\n        reservation = DhcpReservation(\n            id=uuid4().hex, hostname=hostname, mac_address=lease.mac_address, ipv4_address=lease.ipv4_address,\n', 1)
          text = text.replace('            dns_provider=str(values.get("dns_provider") or "auto"),\n', '            dns_provider=dns_provider,\n', 1)
          text = text.replace('        reservation = DhcpReservation(\n            id=uuid4().hex, hostname=hostname or str(host.get("hostname") or host.get("name") or "host"), mac_address=mac_address,\n', '        dns_provider_value = cast(Literal["auto", "pihole", "adguard-home"], dns_provider if dns_provider in {"auto", "pihole", "adguard-home"} else "auto")\n        reservation = DhcpReservation(\n            id=uuid4().hex, hostname=hostname or str(host.get("hostname") or host.get("name") or "host"), mac_address=mac_address,\n', 1)
          text = text.replace('            create_dns_record=create_dns_record, dns_provider=dns_provider,\n', '            create_dns_record=create_dns_record, dns_provider=dns_provider_value,\n', 1)
          service.write_text(text, encoding="utf-8")
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/dhcp/system.py backend/app/modules/dhcp/service.py
          git commit -m "fix: tighten DHCP backend typing"
          git push origin HEAD:feature/dhcp-manager
