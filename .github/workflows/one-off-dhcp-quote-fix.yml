name: One-off DHCP quote fix

on:
  push:
    branches:
      - feature/dhcp-manager

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/dhcp-manager
      - name: Add URL quoting import
        run: |
          python -c 'from pathlib import Path; p=Path("backend/app/modules/providers/dns.py"); s=p.read_text(); needle="from typing import Any\n"; assert needle in s; s=s if "from urllib.parse import quote\n" in s else s.replace(needle, needle+"from urllib.parse import quote\n", 1); p.write_text(s)'
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/providers/dns.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: add URL quoting for Pi-hole DNS records"
          git push origin HEAD:feature/dhcp-manager
