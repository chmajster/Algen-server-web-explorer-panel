name: One-off DHCP quote fix

on:
  push:
    branches:
      - feature/dhcp-manager

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/dhcp-manager
      - name: Finalize DNS import and remove stale helpers
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/app/modules/providers/dns.py")
          text = path.read_text(encoding="utf-8")
          marker = "from typing import Any\n"
          top_level = "from typing import Any\nfrom urllib.parse import quote\n"
          if top_level not in text:
              if marker not in text:
                  raise SystemExit("typing import marker missing")
              text = text.replace(marker, top_level, 1)
              path.write_text(text, encoding="utf-8")
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/one-off-dhcp-quote-fix.yml \
            .github/workflows/one-off-dhcp-ui-integration.yml \
            .github/workflows/one-off-dhcp-ui-patch-v2.yml
          git add backend/app/modules/providers/dns.py
          git commit -m "fix: finalize DHCP DNS integration"
          git push origin HEAD:feature/dhcp-manager
