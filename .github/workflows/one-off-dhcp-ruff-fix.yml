name: One-off DHCP Ruff fix

on:
  push:
    branches:
      - feature/dhcp-manager

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/dhcp-manager
      - name: Apply Ruff fixes
        shell: python
        run: |
          from pathlib import Path

          router = Path("backend/app/modules/dhcp/router.py")
          text = router.read_text(encoding="utf-8")
          text = text.replace("    DhcpRestoreRequest,\n", "")
          router.write_text(text, encoding="utf-8")

          system = Path("backend/app/modules/dhcp/system.py")
          text = system.read_text(encoding="utf-8")
          text = text.replace("import os\n", "", 1)
          text = text.replace('                if clean[end] == "{": depth += 1\n                elif clean[end] == "}": depth -= 1\n', '                if clean[end] == "{":\n                    depth += 1\n                elif clean[end] == "}":\n                    depth -= 1\n')
          system.write_text(text, encoding="utf-8")
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/dhcp/router.py backend/app/modules/dhcp/system.py
          git commit -m "fix: satisfy DHCP backend lint checks"
          git push origin HEAD:feature/dhcp-manager
