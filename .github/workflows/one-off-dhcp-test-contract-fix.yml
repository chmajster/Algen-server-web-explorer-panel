name: One-off DHCP test contract fix

on:
  push:
    branches:
      - feature/dhcp-manager

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/dhcp-manager
      - name: Fix DHCP regression tests
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/tests/test_dhcp_manager.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'subnet(pool_start="10.0.11.10")': 'subnet(pool_start="10.0.11.10", pool_end="10.0.11.20")',
              'ok, _ = system.validate_candidate(DhcpBackend.kea, candidate)': 'ok, _ = DhcpSystem.validate_candidate(system, DhcpBackend.kea, candidate)',
              'system.service_action(DhcpBackend.kea, "restart")\n    assert calls ==': 'DhcpSystem.service_action(system, DhcpBackend.kea, "restart")\n    assert calls ==',
              'system.service_action(DhcpBackend.kea, "restart;rm -rf /")': 'DhcpSystem.service_action(system, DhcpBackend.kea, "restart;rm -rf /")',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing expected test fragment: {old}")
              text = text.replace(old, new, 1)

          old_csrf = '''def test_mutating_routes_use_central_csrf_dependency():
              dhcp_router = importlib.import_module("app.modules.dhcp.router")
              mutation_methods = {"POST", "PUT", "DELETE", "PATCH"}
              mutating = [route for route in dhcp_router.router.routes if getattr(route, "methods", set()) & mutation_methods]
              assert mutating
              for route in mutating:
                  dependencies = {dependency.call for dependency in route.dependant.dependencies}
                  assert dhcp_router.mutating_user in dependencies'''
          new_csrf = '''def test_mutating_routes_use_central_csrf_dependency():
              dhcp_router = importlib.import_module("app.modules.dhcp.router")
              mutation_methods = {"POST", "PUT", "DELETE", "PATCH"}
              read_only_posts = {
                  "/api/modules/dhcp/config/validate",
                  "/api/modules/dhcp/config/plan",
                  "/api/modules/dhcp/diagnostics",
              }
              mutating = []
              read_only = []
              for route in dhcp_router.router.routes:
                  methods = getattr(route, "methods", set())
                  if not methods & mutation_methods:
                      continue
                  if methods == {"POST"} and getattr(route, "path", "") in read_only_posts:
                      read_only.append(route)
                  else:
                      mutating.append(route)
              assert mutating
              assert {route.path for route in read_only} == read_only_posts
              for route in mutating:
                  dependencies = {dependency.call for dependency in route.dependant.dependencies}
                  assert dhcp_router.mutating_user in dependencies
              for route in read_only:
                  dependencies = {dependency.call for dependency in route.dependant.dependencies}
                  assert dhcp_router.current_user in dependencies
                  assert dhcp_router.mutating_user not in dependencies'''
          old_csrf = old_csrf.replace("              ", "    ")
          new_csrf = new_csrf.replace("              ", "    ")
          if old_csrf not in text:
              raise SystemExit("missing CSRF test block")
          path.write_text(text.replace(old_csrf, new_csrf, 1), encoding="utf-8")
      - name: Commit test fixes and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/one-off-dhcp-test-contract-fix.yml
          git add backend/tests/test_dhcp_manager.py
          git commit -m "test: correct DHCP security regression contracts"
          git push origin HEAD:feature/dhcp-manager
