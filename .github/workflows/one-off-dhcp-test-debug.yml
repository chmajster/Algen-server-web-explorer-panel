name: One-off DHCP test debug

on:
  push:
    branches:
      - feature/dhcp-manager

permissions:
  contents: read

jobs:
  debug-vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run DHCP Vitest with captured output
        id: vitest
        continue-on-error: true
        working-directory: frontend
        run: npx vitest run src/features/modules/dhcp/DhcpManagerApp.test.tsx --reporter=verbose > vitest-dhcp.log 2>&1
      - name: Upload DHCP Vitest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhcp-vitest-log
          path: frontend/vitest-dhcp.log
          if-no-files-found: error
      - name: Propagate Vitest failure
        if: steps.vitest.outcome == 'failure'
        run: exit 1
