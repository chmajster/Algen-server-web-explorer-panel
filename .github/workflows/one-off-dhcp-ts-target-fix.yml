name: One-off DHCP TypeScript target fix

on:
  push:
    branches:
      - feature/dhcp-manager

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/dhcp-manager
      - name: Make DHCP ID generation compatible with project target
        shell: python
        run: |
          from pathlib import Path
          path = Path("frontend/src/features/modules/dhcp/DhcpManagerApp.tsx")
          text = path.read_text(encoding="utf-8")
          old = 'globalThis.crypto?.randomUUID?.().replaceAll("-", "")'
          new = 'globalThis.crypto?.randomUUID?.().replace(/-/g, "")'
          if old not in text:
              raise SystemExit("expected replaceAll fragment not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit source fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/modules/dhcp/DhcpManagerApp.tsx
          git commit -m "fix: support project TypeScript target in DHCP UI"
          git push origin HEAD:feature/dhcp-manager
