name: One-off DHCP UI patch v2
on:
  push:
    branches: [feature/dhcp-manager]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/dhcp-manager
      - run: python .github/scripts/patch_dhcp_ui.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/providers/dns.py frontend/src/features/modules/hosts/HostsManagerApp.tsx
          git commit -m "feat: integrate DHCP reservations with Hosts Manager UI"
          git push origin HEAD:feature/dhcp-manager
