name: One-off Docker type fix

on:
  push:
    branches:
      - feature/proxmox-manager-shared-host-registry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/proxmox-manager-shared-host-registry

      - name: Normalize narrowed Docker values
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/app/modules/providers/docker.py")
          text = path.read_text(encoding="utf-8")
          changes = [
              (
                  '        security_options: list[Any] = info.get("SecurityOptions") if isinstance(info.get("SecurityOptions"), list) else []',
                  '        raw_security_options = info.get("SecurityOptions")\n        security_options: list[Any] = list(raw_security_options) if isinstance(raw_security_options, list) else []',
              ),
              (
                  '        supported: dict[str, Any] = capabilities.get("capabilities") if isinstance(capabilities.get("capabilities"), dict) else {}',
                  '        raw_supported = capabilities.get("capabilities")\n        supported: dict[str, Any] = dict(raw_supported) if isinstance(raw_supported, dict) else {}',
              ),
          ]
          for old, new in changes:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence, found {count}: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/providers/docker.py
          git commit -m "fix: normalize Docker capability types"
          git push origin HEAD:feature/proxmox-manager-shared-host-registry
