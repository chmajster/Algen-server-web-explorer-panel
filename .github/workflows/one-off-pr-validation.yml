name: One-off PR validation

on:
  push:
    branches:
      - feature/proxmox-manager-shared-host-registry

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rsync

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Backend quality
        run: |
          python -m ruff check backend
          python -m mypy
          python -m bandit -c pyproject.toml -r backend/app
          python -m pytest -q backend/tests/test_module_registry.py backend/tests/test_architecture_boundaries.py
          python -m build

      - name: Backend tests
        run: python -m pytest -ra

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint and typecheck
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --reporter=default

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Verify deployed frontend contract
        run: python scripts/verify_frontend_build.py frontend/dist

      - name: Validate Bash scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking ${script}"
            bash -n "${script}"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
