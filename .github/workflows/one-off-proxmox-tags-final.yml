name: One-off Proxmox VM tag sync final

on:
  push:
    branches:
      - feature/proxmox-vm-tags

permissions:
  contents: write

jobs:
  validate:
    if: "github.event.head_commit.message == 'ci: finalize Proxmox VM tag sync'"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply validated feature patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/one-off-proxmox-tags.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = dedent(workflow[start:end])
          Path('/tmp/apply_proxmox_tags.py').write_text(script)
          PY
          python /tmp/apply_proxmox_tags.py
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/features/modules/proxmox/ProxmoxManagerApp.tsx')
          text = path.read_text()
          old = 'result.tag_errors.length ? "warning" : "ok"'
          if old not in text:
              raise SystemExit('expected toast level fragment not found')
          path.write_text(text.replace(old, 'result.tag_errors.length ? "error" : "ok"', 1))
          PY
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rsync
      - name: Backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Backend quality
        run: |
          python -m ruff check backend
          python -m mypy
          python -m bandit -c pyproject.toml -r backend/app
          python -m pytest -q backend/tests/test_module_registry.py backend/tests/test_architecture_boundaries.py
          python -m build
      - name: Backend tests
        run: python -m pytest -ra
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend lint and typecheck
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --reporter=default
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Verify deployed frontend contract
        run: python scripts/verify_frontend_build.py frontend/dist
      - name: Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
      - name: Commit validated feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend PROXMOX_MANAGER.md CHANGELOG.md pyproject.toml
          git commit -m "feat: sync VM metadata tags to Proxmox"
          git push origin HEAD:feature/proxmox-vm-tags
