name: One-off Ruff test import fix

on:
  push:
    branches:
      - feature/proxmox-manager-shared-host-registry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/proxmox-manager-shared-host-registry

      - name: Fix import ordering
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/tests/test_proxmox_manager.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          assignment = 'proxmox_module = importlib.import_module("app.modules.proxmox_manager.service")'
          service_import = "from app.modules.proxmox_manager.service import ProxmoxManagerService"
          if lines.count(assignment) != 1 or lines.count(service_import) != 1:
              raise SystemExit("Expected Proxmox test import block was not found exactly once")
          lines.remove(assignment)
          index = lines.index(service_import)
          lines.insert(index + 1, "")
          lines.insert(index + 2, assignment)
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_proxmox_manager.py
          git commit -m "fix: order Proxmox test imports"
          git push origin HEAD:feature/proxmox-manager-shared-host-registry
