name: One-shot PR242 stale test repair

on:
  push:
    branches: [fix/runtime-audit-followup]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-audit-followup
          fetch-depth: 0
      - name: Update stale expectations
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("frontend/src/api.test.ts"); t=p.read_text(); pairs=[("it(\"uses the public no-cache health check and treats only server errors as unavailable\", async () => {","it(\"uses the public no-cache health check and rejects every non-2xx response\", async () => {"),(".mockResolvedValueOnce({ ok: false, status: 401, statusText: \"Unauthorized\" })",".mockResolvedValueOnce({ ok: false, status: 401, statusText: \"Unauthorized\", text: async () => \"Unauthorized\" })"),(".mockResolvedValueOnce({ ok: false, status: 503, statusText: \"Service Unavailable\" });",".mockResolvedValueOnce({ ok: false, status: 503, statusText: \"Service Unavailable\", text: async () => \"Service Unavailable\" });"),("await expect(api.health(controller.signal)).resolves.toEqual({ status: \"ok\", service: \"webnas\" });","await expect(api.health(controller.signal)).rejects.toMatchObject({ status: 401 });")]; assert all(a in t for a,b in pairs); [None for a,b in pairs if not (t:=t.replace(a,b,1))]; p.write_text(t)'
          python -c 'from pathlib import Path; p=Path("frontend/src/features/settings/NetworkManagementPanels.test.tsx"); t=p.read_text(); a="    expect(screen.getByRole(\"button\", { name: /Create/ })).toBeInTheDocument();\n    expect(screen.getByText(\"Selected interface details\")).toBeInTheDocument();"; b="    expect(screen.getByRole(\"button\", { name: /Create/ })).toBeInTheDocument();\n    fireEvent.click(screen.getByText(\"eth0\"));\n    expect(screen.getByText(\"Selected interface details\")).toBeInTheDocument();"; assert a in t; p.write_text(t.replace(a,b,1))'
          git diff --check
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/api.test.ts frontend/src/features/settings/NetworkManagementPanels.test.tsx
          git commit -m "test: align runtime regression expectations"
          git push origin HEAD:fix/runtime-audit-followup
