name: One-shot PR242 stale test repair

on:
  push:
    branches:
      - fix/runtime-audit-followup

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-audit-followup
          fetch-depth: 0
      - name: Align regression tests with corrected runtime behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          api_test = Path("frontend/src/api.test.ts")
          text = api_test.read_text(encoding="utf-8")
          replacements = {
              'it("uses the public no-cache health check and treats only server errors as unavailable", async () => {': 'it("uses the public no-cache health check and rejects every non-2xx response", async () => {',
              '.mockResolvedValueOnce({ ok: false, status: 401, statusText: "Unauthorized" })': '.mockResolvedValueOnce({ ok: false, status: 401, statusText: "Unauthorized", text: async () => "Unauthorized" })',
              '.mockResolvedValueOnce({ ok: false, status: 503, statusText: "Service Unavailable" });': '.mockResolvedValueOnce({ ok: false, status: 503, statusText: "Service Unavailable", text: async () => "Service Unavailable" });',
              'await expect(api.health(controller.signal)).resolves.toEqual({ status: "ok", service: "webnas" });': 'await expect(api.health(controller.signal)).rejects.toMatchObject({ status: 401 });',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"api test fragment not found: {old}")
              text = text.replace(old, new, 1)
          api_test.write_text(text, encoding="utf-8")

          network_test = Path("frontend/src/features/settings/NetworkManagementPanels.test.tsx")
          text = network_test.read_text(encoding="utf-8")
          anchor = '    expect(screen.getByRole("button", { name: /Create/ })).toBeInTheDocument();\n    expect(screen.getByText("Selected interface details")).toBeInTheDocument();'
          replacement = '    expect(screen.getByRole("button", { name: /Create/ })).toBeInTheDocument();\n    fireEvent.click(screen.getByText("eth0"));\n    expect(screen.getByText("Selected interface details")).toBeInTheDocument();'
          if anchor not in text:
              raise SystemExit("network localization test fragment not found")
          network_test.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY
          git diff --check
      - name: Commit test corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/api.test.ts frontend/src/features/settings/NetworkManagementPanels.test.tsx
          git commit -m "test: align runtime regression expectations"
          git push origin HEAD:fix/runtime-audit-followup
