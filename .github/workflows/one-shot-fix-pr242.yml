name: One-shot PR242 schema repair

on:
  push:
    branches:
      - fix/runtime-audit-followup

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-audit-followup
          fetch-depth: 0
      - name: Preserve stable OpenAPI schema for extensible app IDs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/settings.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from pydantic import AfterValidator, BaseModel, Field, ValidationError, field_validator"
          new_import = "from pydantic import AfterValidator, BaseModel, Field, ValidationError, WithJsonSchema, field_validator"
          if old_import not in text and new_import not in text:
              raise SystemExit("expected Pydantic import not found")
          text = text.replace(old_import, new_import, 1)

          old_type = "PinnedAppId = Annotated[str, AfterValidator(_validate_pinned_app_id)]"
          new_type = '''CORE_PINNED_APP_IDS = (\n    "files",\n    "transfers",\n    "activity",\n    "identity",\n    "users",\n    "groups",\n    "mounts",\n    "samba",\n    "services",\n    "store",\n    "logs",\n    "settings",\n    "monitor",\n    "modules",\n    "access",\n    "containers",\n    "ansible",\n    "module",\n)\nPinnedAppId = Annotated[\n    str,\n    AfterValidator(_validate_pinned_app_id),\n    WithJsonSchema({"type": "string", "enum": list(CORE_PINNED_APP_IDS)}),\n]'''
          if old_type in text:
              text = text.replace(old_type, new_type, 1)
          elif "CORE_PINNED_APP_IDS = (" not in text:
              raise SystemExit("expected PinnedAppId declaration not found")

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
      - name: Commit schema repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/settings.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(settings): keep extensible app IDs contract-stable"
          git push origin HEAD:fix/runtime-audit-followup
