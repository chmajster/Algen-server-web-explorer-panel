name: One-shot plugin JSON typing

on:
  push:
    branches: [fix/persisted-json-resilience-2]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/persisted-json-resilience-2
          fetch-depth: 0
      - name: Patch typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/app/plugins/repository.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace("from pathlib import Path\n", "from pathlib import Path\nfrom typing import Any\n", 1)
          text = text.replace("def _json_list(value: object) -> list:\n", "def _json_list(value: object) -> list[Any]:\n", 1)
          p.write_text(text, encoding="utf-8")
          Path(".github/workflows/one-shot-plugin-json-typing.yml").unlink()
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: type plugin JSON fallback helper"
          git push origin HEAD:fix/persisted-json-resilience-2
