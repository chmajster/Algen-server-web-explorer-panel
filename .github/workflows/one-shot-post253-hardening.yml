name: One-shot post-253 hardening
on:
  push:
    branches:
      - fix/post-253-runtime-hardening
    paths:
      - .github/workflows/one-shot-post253-hardening.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/post-253-runtime-hardening
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply fixes and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"replacement marker missing: {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "backend/app/settings.py",
              '''class AdminRateLimiter:\n    def __init__(self) -> None:\n        self._attempts: dict[str, deque[float]] = defaultdict(deque)\n\n    def check(self, key: str) -> None:\n        cfg = get_config()\n        now = time.time()\n        window = self._attempts[key]\n        while window and window[0] < now - 60:\n            window.popleft()\n        if len(window) >= cfg.security.rate_limit_admin_per_minute:\n            raise HTTPException(429, "Too many administrative operations")\n        window.append(now)\n''',
              '''class AdminRateLimiter:\n    def __init__(self) -> None:\n        self._attempts: dict[str, deque[float]] = defaultdict(deque)\n        self._lock = threading.Lock()\n\n    def check(self, key: str) -> None:\n        cfg = get_config()\n        now = time.time()\n        with self._lock:\n            window = self._attempts[key]\n            while window and window[0] < now - 60:\n                window.popleft()\n            if len(window) >= cfg.security.rate_limit_admin_per_minute:\n                raise HTTPException(429, "Too many administrative operations")\n            window.append(now)\n''',
          )
          replace(
              "backend/app/settings.py",
              '''    if result.returncode != 0:\n        raise HTTPException(400, result.stderr.strip() or "System command failed")\n    return result\n''',
              '''    if result.returncode != 0:\n        command = Path(args[0]).name if args else "unknown"\n        logger.warning("settings_admin_command_failed command=%s returncode=%s", command, result.returncode)\n        raise HTTPException(400, "System command failed")\n    return result\n''',
          )
          replace(
              "backend/app/settings.py",
              '''        except Exception as exc:\n            detail = exc.detail if isinstance(exc, HTTPException) else str(exc)\n            with _shutdown_lock:\n                if generation == _shutdown_generation:\n                    _shutdown_state.update(state="failed", error=str(detail), blocker_count=0)\n            return\n''',
              '''        except Exception:\n            logger.exception("shutdown_system_failed generation=%s", generation)\n            with _shutdown_lock:\n                if generation == _shutdown_generation:\n                    _shutdown_state.update(state="failed", error="System shutdown failed", blocker_count=0)\n            return\n''',
          )
          replace(
              "backend/app/modules/hosts_manager/service.py",
              '''    def _settings_locked(self, connection: sqlite3.Connection) -> dict[str, Any]:\n        rows = connection.execute("SELECT key,value_json,updated_at,updated_by FROM hosts_manager_settings").fetchall()\n        values = {str(row["key"]): json.loads(row["value_json"]) for row in rows}\n        defaults = HostsManagerSettingsUpdate().model_dump(mode="json")\n        updated = max(rows, key=lambda row: float(row["updated_at"])) if rows else None\n''',
              '''    def _settings_locked(self, connection: sqlite3.Connection) -> dict[str, Any]:\n        rows = connection.execute("SELECT key,value_json,updated_at,updated_by FROM hosts_manager_settings").fetchall()\n        values: dict[str, Any] = {}\n        for row in rows:\n            try:\n                values[str(row["key"])] = json.loads(row["value_json"])\n            except (TypeError, ValueError, json.JSONDecodeError):\n                continue\n        defaults = HostsManagerSettingsUpdate().model_dump(mode="json")\n        updated = max(rows, key=lambda row: float(row["updated_at"])) if rows else None\n''',
          )
          replace(
              "backend/app/modules/dhcp/service.py",
              '''        path = self.inputs_root / f"{reference}.json"\n        payload = json.loads(path.read_text(encoding="utf-8"))\n        if not isinstance(payload, dict):\n            raise ValueError("invalid staged DHCP payload")\n        return payload\n''',
              '''        path = self.inputs_root / f"{reference}.json"\n        try:\n            payload = json.loads(path.read_text(encoding="utf-8"))\n        except (OSError, TypeError, ValueError, json.JSONDecodeError) as error:\n            raise ValueError("invalid staged DHCP payload") from error\n        if not isinstance(payload, dict):\n            raise ValueError("invalid staged DHCP payload")\n        return payload\n''',
          )
          replace(
              "backend/app/modules/providers/dhcp.py",
              '''        reference = str(payload.get("input_ref") or "")\n        staged: dict[str, Any] = {}\n        if reference:\n            staged = service().read_input(reference)\n        object_id = str(payload.get("object_id") or "")\n        try:\n            if cancelled():\n''',
              '''        reference = str(payload.get("input_ref") or "")\n        staged: dict[str, Any] = {}\n        object_id = str(payload.get("object_id") or "")\n        try:\n            if reference:\n                staged = service().read_input(reference)\n            if cancelled():\n''',
          )
          PY
          cat > backend/tests/test_post253_runtime_hardening.py <<'PY'
          from __future__ import annotations

          import subprocess
          import threading
          import time
          from collections import deque
          from types import SimpleNamespace

          import pytest
          from fastapi import HTTPException

          from app import settings
          from app.modules.dhcp.service import DhcpService
          from app.modules.hosts_manager.service import HostRegistryService
          from app.modules.providers import dhcp as dhcp_provider_module


          def test_admin_rate_limiter_serializes_window_mutation(monkeypatch):
              cfg = SimpleNamespace(security=SimpleNamespace(rate_limit_admin_per_minute=100))
              monkeypatch.setattr(settings, "get_config", lambda: cfg)
              limiter = settings.AdminRateLimiter()

              class ObservedDeque(deque):
                  guard = threading.Lock()
                  active = 0
                  maximum = 0

                  def __len__(self):
                      with type(self).guard:
                          type(self).active += 1
                          type(self).maximum = max(type(self).maximum, type(self).active)
                      try:
                          time.sleep(0.005)
                          return super().__len__()
                      finally:
                          with type(self).guard:
                              type(self).active -= 1

              limiter._attempts["admin"] = ObservedDeque()
              gate = threading.Barrier(8)
              failures: list[BaseException] = []

              def worker() -> None:
                  try:
                      gate.wait(timeout=2)
                      limiter.check("admin")
                  except BaseException as error:  # pragma: no cover - asserted below
                      failures.append(error)

              threads = [threading.Thread(target=worker) for _ in range(8)]
              for thread in threads:
                  thread.start()
              for thread in threads:
                  thread.join(timeout=3)
              assert not failures
              assert all(not thread.is_alive() for thread in threads)
              assert ObservedDeque.maximum == 1
              assert len(limiter._attempts["admin"]) == 8


          def test_settings_run_does_not_expose_command_stderr(monkeypatch):
              monkeypatch.setattr(settings, "broker_required", lambda: False)
              monkeypatch.setattr(
                  settings.subprocess,
                  "run",
                  lambda *args, **kwargs: subprocess.CompletedProcess(args[0], 1, "", "SECRET /etc/shadow token=abc"),
              )
              with pytest.raises(HTTPException) as caught:
                  settings._run(["/usr/sbin/usermod", "demo"])
              assert caught.value.status_code == 400
              assert caught.value.detail == "System command failed"
              assert "SECRET" not in str(caught.value.detail)


          def test_shutdown_failure_state_does_not_expose_exception(monkeypatch):
              monkeypatch.setattr(settings, "_shutdown_generation", 77)
              monkeypatch.setattr(
                  settings,
                  "_shutdown_state",
                  {"state": "scheduled", "deadline": time.time() - 1, "blocker_count": 0, "requested_by": "admin", "error": ""},
              )
              monkeypatch.setattr(settings, "_shutdown_blockers", lambda: [])

              def fail_tool(name: str) -> str:
                  raise RuntimeError("SECRET /root/private")

              monkeypatch.setattr(settings, "_tool", fail_tool)
              settings._shutdown_worker(77)
              payload = settings._shutdown_payload()
              assert payload["state"] == "failed"
              assert payload["error"] == "System shutdown failed"
              assert "SECRET" not in str(payload["error"])


          def test_hosts_settings_corrupt_json_falls_back_to_default(tmp_path):
              repository = HostRegistryService(
                  tmp_path / "hosts" / "hosts.sqlite3",
                  tmp_path / "secrets" / "hosts.key",
                  tmp_path / "missing-controller.sqlite3",
              )
              with repository.connect() as connection:
                  connection.execute(
                      "INSERT OR REPLACE INTO hosts_manager_settings(key,value_json,updated_at,updated_by) VALUES('heartbeat_interval_seconds','{',1,'admin')"
                  )
              payload = repository.settings()
              assert payload["heartbeat_interval_seconds"] == 30


          def test_dhcp_read_input_normalizes_missing_or_corrupt_payload(tmp_path):
              service = DhcpService(tmp_path / "dhcp")
              reference = service.stage_input({"configuration": {}})
              staged = service.inputs_root / f"{reference}.json"
              staged.write_text("{", encoding="utf-8")
              with pytest.raises(ValueError, match="invalid staged DHCP payload"):
                  service.read_input(reference)
              staged.unlink()
              with pytest.raises(ValueError, match="invalid staged DHCP payload"):
                  service.read_input(reference)


          def test_dhcp_provider_discards_bad_staged_input(monkeypatch):
              discarded: list[str] = []

              class FakeService:
                  def read_input(self, reference: str):
                      raise ValueError("invalid staged DHCP payload")

                  def discard_input(self, reference: str) -> None:
                      discarded.append(reference)

              fake = FakeService()
              monkeypatch.setattr(dhcp_provider_module, "service", lambda: fake)
              provider = dhcp_provider_module.DhcpProvider()
              reference = "a" * 32
              with pytest.raises(ValueError, match="invalid staged DHCP payload"):
                  provider.manage(
                      "config_apply",
                      {"input_ref": reference},
                      "admin",
                      lambda *_: None,
                      lambda *_: None,
                      lambda: False,
                  )
              assert discarded == [reference]
          PY
      - name: Install backend test dependencies
        shell: bash
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/app
          python -m ruff check backend/app/settings.py backend/app/modules/hosts_manager/service.py backend/app/modules/dhcp/service.py backend/app/modules/providers/dhcp.py backend/tests/test_post253_runtime_hardening.py
          python -m mypy backend/app
          cd backend
          pytest -q tests/test_post253_runtime_hardening.py tests/test_persisted_json_resilience.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/settings.py backend/app/modules/hosts_manager/service.py backend/app/modules/dhcp/service.py backend/app/modules/providers/dhcp.py backend/tests/test_post253_runtime_hardening.py
          git commit -m "fix: harden admin and staged runtime boundaries"
          git push origin HEAD:fix/post-253-runtime-hardening
