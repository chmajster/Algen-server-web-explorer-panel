name: One-shot post-254 persistence hardening retry
on:
  push:
    branches:
      - fix/post-254-persistence-hardening
    paths:
      - .github/workflows/one-shot-post254-retry.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/post-254-persistence-hardening
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply original patch payload
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet PyYAML
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/one-shot-post254-hardening.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['patch']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Apply fixes and regression tests')
          subprocess.run(['bash', '-c', script], check=True)
          path = Path('backend/tests/test_post254_persistence_hardening.py')
          text = path.read_text(encoding='utf-8').replace('job-1', '00000000-0000-4000-8000-000000000001')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-dev.txt
          npm --prefix frontend ci
      - name: Verify fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/app
          python -m ruff check backend/app/settings.py backend/app/app_store/samba.py backend/app/identity/repository.py backend/app/modules/cron/repository.py backend/app/modules/secrets_manager/service.py backend/app/modules/providers/docker.py backend/tests/test_post254_persistence_hardening.py
          python -m mypy
          python -m pytest -q backend/tests/test_post254_persistence_hardening.py
          npm --prefix frontend run typecheck
          npm --prefix frontend test -- --run src/features/settings/NetworkManagementPanels.persistence.test.ts
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/settings.py backend/app/app_store/samba.py backend/app/identity/repository.py backend/app/modules/cron/repository.py backend/app/modules/secrets_manager/service.py backend/app/modules/providers/docker.py backend/tests/test_post254_persistence_hardening.py frontend/src/features/settings/NetworkManagementPanels.tsx frontend/src/features/settings/NetworkManagementPanels.persistence.test.ts
          git commit -m "fix: harden persisted state and runtime errors"
          git push origin HEAD:fix/post-254-persistence-hardening
