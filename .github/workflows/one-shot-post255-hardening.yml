name: One-shot post-255 runtime hardening
on:
  push:
    branches:
      - fix/post-255-runtime-hardening
    paths:
      - .github/workflows/one-shot-post255-hardening.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/post-255-runtime-hardening
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply fixes and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"replacement marker missing: {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "backend/app/app_store/state.py",
              '''import json\nfrom pathlib import Path\n''',
              '''import json\nimport re\nfrom pathlib import Path\n''',
          )
          replace(
              "backend/app/app_store/state.py",
              '''APP_STATE_DIR = Path(get_config().paths.data_dir) / "apps"\n\n\ndef app_state_path(app_id: str) -> Path:\n    APP_STATE_DIR.mkdir(parents=True, exist_ok=True)\n    return APP_STATE_DIR / f"{app_id}.json"\n''',
              '''APP_STATE_DIR = Path(get_config().paths.data_dir) / "apps"\nAPP_ID_RE = re.compile(r"^[a-z0-9][a-z0-9_-]{0,63}$", re.IGNORECASE)\n\n\ndef app_state_path(app_id: str) -> Path:\n    if not APP_ID_RE.fullmatch(app_id):\n        raise ValueError("invalid app id")\n    APP_STATE_DIR.mkdir(parents=True, exist_ok=True)\n    path = (APP_STATE_DIR / f"{app_id}.json").resolve(strict=False)\n    root = APP_STATE_DIR.resolve(strict=False)\n    if path.parent != root:\n        raise ValueError("invalid app id")\n    return path\n''',
          )

          replace(
              "backend/app/app_store/api.py",
              '''@router.get("/{app_id}/config")\ndef get_config_app(app_id: str, user: SessionUser = Depends(_current_user)):\n    authorize(user, Permission.MODULES_VIEW)\n    if app_id != "samba":\n        return read_state(app_id).get("config") or {}\n    return read_samba_config().model_dump()\n''',
              '''@router.get("/{app_id}/config")\ndef get_config_app(app_id: str, user: SessionUser = Depends(_current_user)):\n    authorize(user, Permission.MODULES_VIEW)\n    if app_id != "samba":\n        raise HTTPException(404, "Unsupported app module")\n    return read_samba_config().model_dump()\n''',
          )

          replace(
              "backend/app/modules/providers/home_assistant.py",
              '''        try:\n            payload = json.loads(result.stdout)\n            return payload[0] if isinstance(payload, list) and payload else None\n        except (json.JSONDecodeError, IndexError):\n            return None\n''',
              '''        try:\n            payload = json.loads(result.stdout)\n            return payload[0] if isinstance(payload, list) and payload and isinstance(payload[0], dict) else None\n        except (json.JSONDecodeError, IndexError):\n            return None\n''',
          )

          replace(
              "backend/app/ldap_authentication/repository.py",
              '''    @staticmethod\n    def _json(value: Any, fallback: Any) -> Any:\n        if not value:\n            return fallback\n        try:\n            parsed = json.loads(str(value))\n        except (TypeError, ValueError):\n            return fallback\n        return parsed\n''',
              '''    @staticmethod\n    def _json(value: Any, fallback: Any) -> Any:\n        if not value:\n            return fallback\n        try:\n            parsed = json.loads(str(value))\n        except (TypeError, ValueError, json.JSONDecodeError):\n            return fallback\n        if isinstance(fallback, list) and not isinstance(parsed, list):\n            return fallback\n        if isinstance(fallback, dict) and not isinstance(parsed, dict):\n            return fallback\n        return parsed\n''',
          )

          replace(
              "backend/app/modules/webhook_manager/service.py",
              '''    @staticmethod\n    def _decode_json(value: Any, fallback: Any) -> Any:\n        try:\n            return json.loads(str(value or ""))\n        except (TypeError, ValueError, json.JSONDecodeError):\n            return fallback\n''',
              '''    @staticmethod\n    def _decode_json(value: Any, fallback: Any) -> Any:\n        try:\n            parsed = json.loads(str(value or ""))\n        except (TypeError, ValueError, json.JSONDecodeError):\n            return fallback\n        if isinstance(fallback, list) and not isinstance(parsed, list):\n            return fallback\n        if isinstance(fallback, dict) and not isinstance(parsed, dict):\n            return fallback\n        return parsed\n''',
          )
          PY

          cat > backend/tests/test_post255_runtime_hardening.py <<'PY'
          from __future__ import annotations

          import subprocess
          from types import SimpleNamespace

          import pytest
          from fastapi import HTTPException

          from app.app_store import api as app_store_api
          from app.app_store import state as app_state
          from app.ldap_authentication.repository import LdapAuthenticationRepository
          from app.modules.providers import home_assistant as home_assistant_module
          from app.modules.providers.home_assistant import HomeAssistantProvider
          from app.modules.webhook_manager.service import WebhookManagerService


          def test_app_state_path_rejects_traversal_and_separators(monkeypatch, tmp_path):
              monkeypatch.setattr(app_state, "APP_STATE_DIR", tmp_path / "apps")
              for app_id in ("../settings/deployment", "../../secret", "nested/app", r"nested\\app", ".hidden", ""):
                  with pytest.raises(ValueError):
                      app_state.app_state_path(app_id)
              assert app_state.app_state_path("samba") == (tmp_path / "apps" / "samba.json").resolve(strict=False)


          def test_generic_app_config_endpoint_rejects_unknown_app_before_state_read(monkeypatch):
              monkeypatch.setattr(app_store_api, "authorize", lambda *args, **kwargs: None)
              monkeypatch.setattr(app_store_api, "read_state", lambda app_id: (_ for _ in ()).throw(AssertionError(app_id)))
              user = SimpleNamespace(username="alice")
              with pytest.raises(HTTPException) as caught:
                  app_store_api.get_config_app("../../settings/deployment", user=user)
              assert caught.value.status_code == 404


          def test_home_assistant_inspect_rejects_non_object_payload(monkeypatch):
              provider = object.__new__(HomeAssistantProvider)
              monkeypatch.setattr(home_assistant_module.shutil, "which", lambda name: "/usr/bin/docker")
              provider._run = lambda *args, **kwargs: subprocess.CompletedProcess(args[0], 0, '["unexpected"]', "")  # type: ignore[method-assign]
              assert provider._inspect() is None


          def test_ldap_json_decoder_preserves_expected_container_shape():
              decode = LdapAuthenticationRepository._json
              assert decode('"admins"', []) == []
              assert decode('{"group":"admins"}', []) == []
              assert decode('["admins"]', []) == ["admins"]
              assert decode('["admins"]', {}) == {}
              assert decode('{"group":"admins"}', {}) == {"group": "admins"}


          def test_webhook_json_decoder_preserves_expected_container_shape():
              decode = WebhookManagerService._decode_json
              assert decode('"event"', []) == []
              assert decode('{"event":"x"}', []) == []
              assert decode('["event"]', []) == ["event"]
              assert decode('["header"]', {}) == {}
              assert decode('{"X-Test":"1"}', {}) == {"X-Test": "1"}
          PY
      - name: Install dependencies
        shell: bash
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/app
          python -m ruff check backend/app/app_store/state.py backend/app/app_store/api.py backend/app/modules/providers/home_assistant.py backend/app/ldap_authentication/repository.py backend/app/modules/webhook_manager/service.py backend/tests/test_post255_runtime_hardening.py
          python -m mypy
          python -m pytest -q backend/tests/test_post255_runtime_hardening.py backend/tests/test_persisted_json_resilience.py backend/tests/test_infrastructure_modules.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/app_store/state.py backend/app/app_store/api.py backend/app/modules/providers/home_assistant.py backend/app/ldap_authentication/repository.py backend/app/modules/webhook_manager/service.py backend/tests/test_post255_runtime_hardening.py
          git commit -m "fix: harden app state and persisted payloads"
          git push origin HEAD:fix/post-255-runtime-hardening
