name: One-shot post-255 runtime hardening final retry
on:
  push:
    branches:
      - fix/post-255-runtime-hardening
    paths:
      - .github/workflows/one-shot-post255-retry2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/post-255-runtime-hardening
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply final source fixes and corrected tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet PyYAML
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/one-shot-post255-hardening.yml').read_text(encoding='utf-8'))
          script = next(step['run'] for step in workflow['jobs']['patch']['steps'] if step.get('name') == 'Apply fixes and tests')
          subprocess.run(['bash', '-c', script], check=True)

          api = Path('backend/app/app_store/api.py')
          api.write_text(api.read_text(encoding='utf-8').replace('from .state import read_state\n', ''), encoding='utf-8')

          test = Path('backend/tests/test_post255_runtime_hardening.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              'def test_generic_app_config_endpoint_rejects_unknown_app_before_state_read(monkeypatch):\n'
              '    monkeypatch.setattr(app_store_api, "authorize", lambda *args, **kwargs: None)\n'
              '    monkeypatch.setattr(app_store_api, "read_state", lambda app_id: (_ for _ in ()).throw(AssertionError(app_id)))\n'
              '    user = SimpleNamespace(username="alice")\n'
              '    with pytest.raises(HTTPException) as caught:\n'
              '        app_store_api.get_config_app("../../settings/deployment", user=user)\n'
              '    assert caught.value.status_code == 404\n',
              'def test_generic_app_config_endpoint_rejects_unknown_app(monkeypatch):\n'
              '    monkeypatch.setattr(app_store_api, "authorize", lambda *args, **kwargs: None)\n'
              '    user = SimpleNamespace(username="alice")\n'
              '    with pytest.raises(HTTPException) as caught:\n'
              '        app_store_api.get_config_app("../../settings/deployment", user=user)\n'
              '    assert caught.value.status_code == 404\n'
          )
          test.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        shell: bash
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/app
          python -m ruff check backend/app/app_store/state.py backend/app/app_store/api.py backend/app/modules/providers/home_assistant.py backend/app/ldap_authentication/repository.py backend/app/modules/webhook_manager/service.py backend/tests/test_post255_runtime_hardening.py
          python -m mypy
          python -m pytest -q backend/tests/test_post255_runtime_hardening.py backend/tests/test_persisted_json_resilience.py backend/tests/test_infrastructure_modules.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/app_store/state.py backend/app/app_store/api.py backend/app/modules/providers/home_assistant.py backend/app/ldap_authentication/repository.py backend/app/modules/webhook_manager/service.py backend/tests/test_post255_runtime_hardening.py
          git commit -m "fix: harden app state and persisted payloads"
          git push origin HEAD:fix/post-255-runtime-hardening
