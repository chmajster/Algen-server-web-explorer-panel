name: One-shot post-256 runtime hardening
on:
  push:
    branches: [fix/post-256-runtime-hardening]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/post-256-runtime-hardening
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Apply fixes and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker missing in {path}: {old[:120]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'backend/app/file_ops.py',
              '''        if result.returncode != 0:\n            raise _worker_http_error(result.stderr)\n        return json.loads(result.stdout or "{}")\n''',
              '''        if result.returncode != 0:\n            raise _worker_http_error(result.stderr)\n        try:\n            return json.loads(result.stdout or "{}")\n        except json.JSONDecodeError as error:\n            raise HTTPException(500, "File worker returned an invalid response") from error\n''',
          )

          replace(
              'backend/app/services/file_task_manager.py',
              '''import json\nimport sqlite3\nimport tempfile\nimport threading\n''',
              '''import json\nimport os\nimport sqlite3\nimport tempfile\nimport threading\n''',
          )
          replace(
              'backend/app/services/file_task_manager.py',
              '''    def _connect(self) -> sqlite3.Connection:\n        try:\n            self._db_path.parent.mkdir(parents=True, exist_ok=True)\n        except OSError:\n            self._db_path = Path(tempfile.gettempdir()) / "webnas" / "transfers.sqlite3"\n            self._db_path.parent.mkdir(parents=True, exist_ok=True)\n        conn = sqlite3.connect(self._db_path, factory=ClosingConnection)\n        conn.row_factory = sqlite3.Row\n        return conn\n''',
              '''    def _connect(self) -> sqlite3.Connection:\n        try:\n            self._db_path.parent.mkdir(parents=True, exist_ok=True)\n        except OSError:\n            uid = os.getuid() if hasattr(os, "getuid") else os.getpid()\n            fallback_root = Path(tempfile.gettempdir()) / f"webnas-{uid}"\n            fallback_root.mkdir(parents=True, exist_ok=True, mode=0o700)\n            try:\n                os.chmod(fallback_root, 0o700)\n            except OSError:\n                pass\n            self._db_path = fallback_root / "transfers.sqlite3"\n        conn = sqlite3.connect(self._db_path, factory=ClosingConnection)\n        try:\n            os.chmod(self._db_path, 0o600)\n        except OSError:\n            pass\n        conn.row_factory = sqlite3.Row\n        return conn\n''',
          )
          replace(
              'backend/app/services/file_task_manager.py',
              '''    def _stored_status(self, task_id: str) -> TaskStatus | None:\n        with self._connect() as conn:\n            row = conn.execute("SELECT status FROM file_tasks WHERE id=?", (task_id,)).fetchone()\n        return TaskStatus(str(row["status"])) if row else None\n''',
              '''    def _stored_status(self, task_id: str) -> TaskStatus | None:\n        with self._connect() as conn:\n            row = conn.execute("SELECT status FROM file_tasks WHERE id=?", (task_id,)).fetchone()\n        if not row:\n            return None\n        try:\n            return TaskStatus(str(row["status"]))\n        except (KeyError, TypeError, ValueError):\n            return None\n''',
          )

          replace(
              'backend/app/services/rsync_tasks.py',
              '''def cleanup_partial_files(username: str, destination: Path, on_error: Callable[[str], None]) -> None:\n    partial_dir = destination / ".webnas-partial" if destination.is_dir() else destination.parent / ".webnas-partial"\n    if not partial_dir.exists():\n        return\n''',
              '''def cleanup_partial_files(username: str, destination: Path, on_error: Callable[[str], None]) -> None:\n    assert_path_allowed(destination, "partial-cleanup", include_parent=True)\n    partial_dir = destination / ".webnas-partial" if destination.is_dir() else destination.parent / ".webnas-partial"\n    assert_path_allowed(partial_dir, "partial-cleanup", include_parent=True)\n    if not partial_dir.exists():\n        return\n''',
          )
          PY

          cat > backend/tests/test_post256_runtime_hardening.py <<'PY'
          from __future__ import annotations

          import os
          import sqlite3
          import stat
          import subprocess
          from pathlib import Path

          import pytest
          from fastapi import HTTPException

          from app import file_ops
          from app.services import file_task_manager as file_task_module
          from app.services import rsync_tasks
          from app.services.file_task_manager import FileTaskManager
          from app.sqlite_utils import ClosingConnection


          def test_local_file_worker_invalid_json_is_normalized(monkeypatch):
              monkeypatch.setattr(file_ops, "current_process_can_impersonate", lambda: True)
              monkeypatch.setattr(
                  file_ops.subprocess,
                  "run",
                  lambda *args, **kwargs: subprocess.CompletedProcess(args[0], 0, "not-json", ""),
              )

              with pytest.raises(HTTPException) as caught:
                  file_ops.run_user_op("alice", "list", {})

              assert caught.value.status_code == 500
              assert caught.value.detail == "File worker returned an invalid response"
              assert "not-json" not in str(caught.value.detail)


          def test_stored_status_ignores_corrupt_database_value(tmp_path):
              database = tmp_path / "transfers.sqlite3"
              with sqlite3.connect(database) as connection:
                  connection.execute("CREATE TABLE file_tasks (id TEXT PRIMARY KEY, status TEXT NOT NULL)")
                  connection.execute("INSERT INTO file_tasks (id, status) VALUES (?, ?)", ("task-1", "definitely-invalid"))

              manager = object.__new__(FileTaskManager)
              manager._connect = lambda: sqlite3.connect(database, factory=ClosingConnection)  # type: ignore[method-assign]

              assert manager._stored_status("task-1") is None


          def test_transfer_database_fallback_is_private(monkeypatch, tmp_path):
              blocker = tmp_path / "blocked"
              blocker.write_text("not a directory", encoding="utf-8")
              fallback_parent = tmp_path / "fallback"
              fallback_parent.mkdir()
              monkeypatch.setattr(file_task_module.tempfile, "gettempdir", lambda: str(fallback_parent))

              manager = object.__new__(FileTaskManager)
              manager._db_path = blocker / "transfers.sqlite3"
              connection = manager._connect()
              database_path = manager._db_path
              connection.close()

              fallback_root = database_path.parent
              assert fallback_root.parent == fallback_parent
              assert stat.S_IMODE(fallback_root.stat().st_mode) == 0o700
              assert stat.S_IMODE(database_path.stat().st_mode) == 0o600
              expected_suffix = str(os.getuid()) if hasattr(os, "getuid") else str(os.getpid())
              assert fallback_root.name == f"webnas-{expected_suffix}"


          def test_partial_cleanup_revalidates_persisted_destination(monkeypatch, tmp_path):
              calls: list[Path] = []

              def reject(path, *args, **kwargs):
                  calls.append(Path(path))
                  raise HTTPException(403, "blocked")

              monkeypatch.setattr(rsync_tasks, "assert_path_allowed", reject)
              monkeypatch.setattr(
                  rsync_tasks.subprocess,
                  "run",
                  lambda *args, **kwargs: (_ for _ in ()).throw(AssertionError("rm must not run")),
              )

              with pytest.raises(HTTPException) as caught:
                  rsync_tasks.cleanup_partial_files("alice", tmp_path / "outside", lambda _line: None)

              assert caught.value.status_code == 403
              assert calls == [tmp_path / "outside"]
          PY

          cat > CHANGELOG.d/post-256-runtime-hardening.md <<'EOF'
          - Harden transfer persistence fallback permissions and tolerate corrupted stored statuses.
          - Revalidate partial-transfer cleanup paths and normalize malformed local file-worker responses.
          EOF
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify fixes
        run: |
          set -euo pipefail
          python -m compileall -q backend/app
          python -m ruff check backend/app/file_ops.py backend/app/services/file_task_manager.py backend/app/services/rsync_tasks.py backend/tests/test_post256_runtime_hardening.py
          python -m mypy
          python -m pytest -q backend/tests/test_post256_runtime_hardening.py backend/tests/test_persisted_json_resilience.py backend/tests/test_file_task_manager.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/file_ops.py backend/app/services/file_task_manager.py backend/app/services/rsync_tasks.py backend/tests/test_post256_runtime_hardening.py CHANGELOG.d/post-256-runtime-hardening.md
          git commit -m 'fix: harden transfer runtime boundaries'
          git push origin HEAD:fix/post-256-runtime-hardening
