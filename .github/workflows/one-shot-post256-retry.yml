name: One-shot post-256 runtime hardening retry
on:
  push:
    branches: [fix/post-256-runtime-hardening]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/post-256-runtime-hardening
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Apply original patch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet PyYAML
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/one-shot-post256-hardening.yml').read_text(encoding='utf-8'))
          script = next(step['run'] for step in workflow['jobs']['patch']['steps'] if step.get('name') == 'Apply fixes and tests')
          subprocess.run(['bash', '-c', script], check=True)
          PY
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify fixes
        run: |
          set -euo pipefail
          python -m compileall -q backend/app
          python -m ruff check backend/app/file_ops.py backend/app/services/file_task_manager.py backend/app/services/rsync_tasks.py backend/tests/test_post256_runtime_hardening.py
          python -m mypy
          python -m pytest -q backend/tests/test_post256_runtime_hardening.py backend/tests/test_persisted_json_resilience.py backend/tests/test_rsync_tasks.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/app/file_ops.py backend/app/services/file_task_manager.py backend/app/services/rsync_tasks.py backend/tests/test_post256_runtime_hardening.py CHANGELOG.d/post-256-runtime-hardening.md
          git commit -m 'fix: harden transfer runtime boundaries'
          git push origin HEAD:fix/post-256-runtime-hardening
