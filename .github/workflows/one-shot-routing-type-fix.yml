name: One-shot routing type fix
on:
  push:
    branches:
      - fix/exhaustive-runtime-audit-3
    paths:
      - .github/workflows/one-shot-routing-type-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/exhaustive-runtime-audit-3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/modules/routing_manager/service.py')
          text = path.read_text(encoding='utf-8')
          old = '''        try:\n            float(transaction.get("expires_at"))\n        except (TypeError, ValueError) as error:\n            raise LookupError("routing transaction state is invalid") from error\n        return transaction\n'''
          new = '''        expires_at = transaction.get("expires_at")\n        if not isinstance(expires_at, (int, float, str)):\n            raise LookupError("routing transaction state is invalid")\n        try:\n            float(expires_at)\n        except ValueError as error:\n            raise LookupError("routing transaction state is invalid") from error\n        return transaction\n'''
          if old not in text:
              raise SystemExit('routing type-validation marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q backend/app
          python -m pip install -r backend/requirements-dev.txt
          python -m ruff check backend/app/modules/routing_manager/service.py backend/tests/test_infrastructure_managers.py backend/tests/test_backend_source_syntax.py
          python -m mypy
          python -m pytest -q backend/tests/test_infrastructure_managers.py backend/tests/test_backend_source_syntax.py
      - name: Commit code change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/routing_manager/service.py
          git commit -m "fix: type-check routing transaction expiry"
          git push origin HEAD:fix/exhaustive-runtime-audit-3
