name: One-shot runtime audit 4

on:
  push:
    branches: [fix/exhaustive-runtime-audit-4]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/exhaustive-runtime-audit-4
      - name: Patch confirmed runtime regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing expected fragment in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          repository = "backend/app/jobs/repository.py"
          replace(
              repository,
              '''def _json_object(value: Any) -> dict[str, Any]:\n    try:\n        decoded = json.loads(value or "{}")\n    except (TypeError, ValueError, json.JSONDecodeError):\n        return {}\n    return decoded if isinstance(decoded, dict) else {}\n\n\nclass JobRepository:''',
              '''def _json_object(value: Any) -> dict[str, Any]:\n    try:\n        decoded = json.loads(value or "{}")\n    except (TypeError, ValueError, json.JSONDecodeError):\n        return {}\n    return decoded if isinstance(decoded, dict) else {}\n\n\ndef _job_status(value: Any) -> JobStatus:\n    try:\n        return JobStatus(str(value))\n    except (TypeError, ValueError):\n        return JobStatus.failed\n\n\ndef _job_priority(value: Any) -> JobPriority:\n    try:\n        return JobPriority(str(value))\n    except (TypeError, ValueError):\n        return JobPriority.normal\n\n\nclass JobRepository:''',
          )
          replace(repository, '            status=JobStatus(str(row["status"])),', '            status=_job_status(row["status"]),')
          replace(repository, '            priority=JobPriority(str(value("priority", "normal"))),', '            priority=_job_priority(value("priority", "normal")),')
          replace(repository, '        return [JobStatus(str(row["status"])) for row in rows]', '        return [_job_status(row["status"]) for row in rows]')

          tests = Path("backend/tests/test_jobs.py")
          text = tests.read_text(encoding="utf-8")
          marker = "def test_corrupt_persisted_job_enums_degrade_safely"
          if marker not in text:
              text += '''\n\ndef test_corrupt_persisted_job_enums_degrade_safely(tmp_path):\n    repository = JobRepository(tmp_path / "jobs.sqlite3")\n    dependency = repository.create(job_type="dependency", module="tests", created_by="alice")\n    child = repository.create(job_type="child", module="tests", created_by="alice", status=JobStatus.waiting)\n    repository.add_dependencies(child.id, [dependency.id])\n    with sqlite3.connect(repository.path) as connection:\n        connection.execute("UPDATE jobs SET status=?, priority=? WHERE id=?", ("future-status", "impossible", dependency.id))\n\n    restored = repository.get(dependency.id)\n    assert restored is not None\n    assert restored.status == JobStatus.failed\n    assert restored.priority.value == "normal"\n    assert repository.dependency_states(child.id) == [JobStatus.failed]\n'''
              tests.write_text(text, encoding="utf-8")

          app = "frontend/src/app/App.tsx"
          replace(
              app,
              'import { detectLanguage, loadLanguageWithFallback, type Language, translate } from "../i18n";',
              'import { readStoredEnum, readStorageValue, writeStorageValue } from "../core/persistence";\nimport { detectLanguage, loadLanguageWithFallback, type Language, translate } from "../i18n";',
          )
          replace(app, '  const [language, setLanguage] = useState<Language>(() => detectLanguage(localStorage.getItem("webnas_language")));', '  const [language, setLanguage] = useState<Language>(() => detectLanguage(readStorageValue("webnas_language")));')
          replace(app, '  const [theme, setTheme] = useState<Theme>(() => (localStorage.getItem("webnas_theme") as Theme) || "system");', '  const [theme, setTheme] = useState<Theme>(() => readStoredEnum(readStorageValue("webnas_theme"), ["light", "dark", "system"] as const, "system"));')
          replace(app, '      if (persist) localStorage.setItem("webnas_language", loaded);', '      if (persist) writeStorageValue("webnas_language", loaded);')
          replace(app, '    if (sessionStorage.getItem(COMPLETED_UPDATE_RELOAD_KEY) === updateId) return;\n    sessionStorage.setItem(COMPLETED_UPDATE_RELOAD_KEY, updateId);', '    if (readStorageValue(COMPLETED_UPDATE_RELOAD_KEY, "session") === updateId) return;\n    writeStorageValue(COMPLETED_UPDATE_RELOAD_KEY, updateId, "session");')
          replace(app, '      if (patch.theme && settingRevisions.current.theme === revision) { setTheme(saved.theme); localStorage.setItem("webnas_theme", saved.theme); }', '      if (patch.theme && settingRevisions.current.theme === revision) { setTheme(saved.theme); writeStorageValue("webnas_theme", saved.theme); }')
          PY
      - name: Validate patched Python sources
        run: python -m compileall -q backend/app backend/tests
      - name: Commit patched sources
        run: |
          git config user.name "webnas-ci"
          git config user.email "webnas-ci@users.noreply.github.com"
          git add backend frontend
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden persisted runtime state"
          git push origin HEAD:fix/exhaustive-runtime-audit-4
