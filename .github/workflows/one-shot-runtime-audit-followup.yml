name: One-shot runtime audit follow-up
on:
  push:
    branches: [fix/exhaustive-runtime-audit-3]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/exhaustive-runtime-audit-3
          fetch-depth: 0
      - name: Apply follow-up fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Fix TypeScript narrowing found by CI.
          replace_once(
              'frontend/src/features/docker/CreateContainerWizard.tsx',
              '''        const item = entry as Record<string, unknown>;\n        if (item.name !== "nofile" && item.name !== "nproc") return [];\n        if (typeof item.soft !== "string" || typeof item.hard !== "string") return [];\n        return [{ id: Number.isFinite(Number(item.id)) ? Number(item.id) : index + 1, name: item.name, soft: item.soft, hard: item.hard }];\n''',
              '''        const item = entry as Record<string, unknown>;\n        const name = item.name === "nofile" ? "nofile" : item.name === "nproc" ? "nproc" : null;\n        if (!name || typeof item.soft !== "string" || typeof item.hard !== "string") return [];\n        return [{ id: Number.isFinite(Number(item.id)) ? Number(item.id) : index + 1, name, soft: item.soft, hard: item.hard }];\n''',
          )

          # Network mounts: one corrupt persisted JSON field must not take down mount listing.
          marker = '''def row_to_mount(row: sqlite3.Row, *, reconcile: bool = True) -> dict:\n'''
          helpers = '''def _persisted_json_object(value: object) -> dict:\n    try:\n        parsed = json.loads(str(value or "{}"))\n    except (TypeError, ValueError, json.JSONDecodeError):\n        return {}\n    return parsed if isinstance(parsed, dict) else {}\n\n\ndef _persisted_string_list(value: object) -> list[str]:\n    try:\n        parsed = json.loads(str(value or "[]"))\n    except (TypeError, ValueError, json.JSONDecodeError):\n        return []\n    return [item for item in parsed if isinstance(item, str)] if isinstance(parsed, list) else []\n\n\n'''
          replace_once('backend/app/network_mounts.py', marker, helpers + marker)
          replace_once(
              'backend/app/network_mounts.py',
              '''    data["config"] = json.loads(data.pop("config_json") or "{}")\n    data["config"]["has_secret"] = credentials_path(data["id"]).exists()\n    data["allowed_users"] = json.loads(data.pop("allowed_users_json") or "[]")\n    data["allowed_groups"] = json.loads(data.pop("allowed_groups_json") or "[]")\n''',
              '''    data["config"] = _persisted_json_object(data.pop("config_json", "{}"))\n    data["config"]["has_secret"] = credentials_path(data["id"]).exists()\n    data["allowed_users"] = _persisted_string_list(data.pop("allowed_users_json", "[]"))\n    data["allowed_groups"] = _persisted_string_list(data.pop("allowed_groups_json", "[]"))\n''',
          )

          # Do not expose root broker/systemd diagnostics from mount-unit operations.
          replace_once(
              'backend/app/network_mounts.py',
              '''        if result.returncode != 0:\n            raise HTTPException(400, result.stderr.strip() or "Could not install persistent mount unit")\n''',
              '''        if result.returncode != 0:\n            logger.warning("network_mount_unit_apply_failed mount=%s returncode=%s", mount["id"], result.returncode)\n            raise HTTPException(400, "Could not install persistent mount unit")\n''',
          )
          replace_once(
              'backend/app/network_mounts.py',
              '''        if result.returncode != 0:\n            raise HTTPException(400, result.stderr.strip() or "Could not remove persistent mount unit")\n''',
              '''        if result.returncode != 0:\n            logger.warning("network_mount_unit_remove_failed mount=%s returncode=%s", mount["id"], result.returncode)\n            raise HTTPException(400, "Could not remove persistent mount unit")\n''',
          )

          # Power control: retain diagnostics in server logs, keep HTTP details generic.
          replace_once(
              'backend/app/power_control.py',
              '''    except (OSError, subprocess.TimeoutExpired) as error:\n        logger.exception("power_action_schedule_failed action=%s", action)\n        raise HTTPException(500, f"Could not schedule {action}: {error}") from error\n\n    if result.returncode != 0:\n        message = _command_error(result)\n        logger.error(\n            "power_action_schedule_failed action=%s returncode=%s error=%s",\n            action,\n            result.returncode,\n            message,\n        )\n        raise HTTPException(500, message)\n''',
              '''    except (OSError, subprocess.TimeoutExpired) as error:\n        logger.exception("power_action_schedule_failed action=%s", action)\n        raise HTTPException(500, f"Could not schedule {action}") from error\n\n    if result.returncode != 0:\n        message = _command_error(result)\n        logger.error(\n            "power_action_schedule_failed action=%s returncode=%s error=%s",\n            action,\n            result.returncode,\n            message,\n        )\n        raise HTTPException(500, f"Could not schedule {action}")\n''',
          )

          # HTTPS transport settings: rollback remains intact, but never reflect nginx/path errors to HTTP clients.
          replace_once(
              'backend/app/transport_settings.py',
              '''    except Exception as error:\n        if previous_state is None:\n''',
              '''    except Exception as error:\n        logger.warning("transport_settings_apply_failed actor=%s error=%s", user.username, type(error).__name__)\n        if previous_state is None:\n''',
          )
          replace_once(
              'backend/app/transport_settings.py',
              '''        raise HTTPException(400, f"Could not apply transport settings: {error}") from error\n''',
              '''        raise HTTPException(400, "Could not apply transport settings") from error\n''',
          )

          # App Store service controls: systemctl/broker stderr stays server-side.
          replace_once(
              'backend/app/app_store/service.py',
              '''from fastapi import HTTPException\n\nfrom ..privileged_broker.runtime import broker_required, systemd_action\n''',
              '''from fastapi import HTTPException\n\nfrom ..audit import logger\nfrom ..privileged_broker.runtime import broker_required, systemd_action\n''',
          )
          replace_once(
              'backend/app/app_store/service.py',
              '''        if result.returncode != 0:\n            raise HTTPException(400, result.stderr.strip() or result.stdout.strip() or f"systemctl {action} failed")\n''',
              '''        if result.returncode != 0:\n            logger.warning("app_service_action_failed app=%s action=%s service=%s returncode=%s", app_id, action, service, result.returncode)\n            raise HTTPException(400, f"systemctl {action} failed")\n''',
          )

          # Regression tests for durable mount state and power detail disclosure.
          p = Path('backend/tests/test_network_mounts.py')
          text = p.read_text()
          addition = '''\n\ndef test_corrupt_persisted_mount_json_degrades_to_safe_defaults(tmp_path, monkeypatch):\n    monkeypatch.setattr(network_mounts, "credentials_path", lambda mount_id: tmp_path / f"{mount_id}.cred")\n    monkeypatch.setattr(network_mounts, "missing_packages", lambda mount_type: [])\n    monkeypatch.setattr(network_mounts, "recent_jobs", lambda mount_id: [])\n    monkeypatch.setattr(network_mounts, "actual_mount", lambda path: None)\n    row = {\n        "id": "bad-json", "name": "bad", "type": "smb", "remote": "//nas/share",\n        "mount_point": "/mnt/webnas/mnt/bad", "owner": "alice", "read_only": 1, "persistent": 0,\n        "manual_intervention": 0, "config_json": "[]", "allowed_users_json": '{"bad":true}',\n        "allowed_groups_json": "{", "missing_packages_json": "[]", "migration_status": "ready",\n        "status": "unmounted", "last_error": "",\n    }\n    value = network_mounts.row_to_mount(row)\n    assert value["config"] == {"has_secret": False}\n    assert value["allowed_users"] == []\n    assert value["allowed_groups"] == []\n'''
          if 'test_corrupt_persisted_mount_json_degrades_to_safe_defaults' not in text:
              p.write_text(text + addition)

          p = Path('backend/tests/test_runtime_boundary_resilience.py')
          text = p.read_text()
          if 'from app import power_control' not in text:
              text = text.replace('from app.log_system import api as logs_api\n', 'from app import power_control\nfrom app.log_system import api as logs_api\n')
          addition = '''\n\ndef test_power_schedule_failure_does_not_expose_system_stderr(monkeypatch):\n    monkeypatch.setattr(power_control, "broker_required", lambda: False)\n    monkeypatch.setattr(power_control.shutil, "which", lambda name: f"/usr/bin/{name}")\n    monkeypatch.setattr(\n        power_control.subprocess,\n        "run",\n        lambda *args, **kwargs: power_control.subprocess.CompletedProcess(args[0], 1, "", "token=abc path=/srv/private"),\n    )\n    with pytest.raises(HTTPException) as error:\n        power_control._schedule_systemctl("host-restart", "reboot")\n    assert error.value.status_code == 500\n    assert error.value.detail == "Could not schedule host-restart"\n    assert "token=abc" not in str(error.value.detail)\n'''
          if 'test_power_schedule_failure_does_not_expose_system_stderr' not in text:
              p.write_text(text + addition)
          PY
      - name: Verify patch markers
        run: |
          grep -F 'const name = item.name === "nofile"' frontend/src/features/docker/CreateContainerWizard.tsx
          grep -F 'def _persisted_json_object' backend/app/network_mounts.py
          ! grep -F 'Could not schedule {action}: {error}' backend/app/power_control.py
          ! grep -F 'Could not apply transport settings: {error}' backend/app/transport_settings.py
      - name: Remove helper and commit
        run: |
          rm .github/workflows/one-shot-runtime-audit-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: close remaining runtime audit gaps'
          git push origin HEAD:fix/exhaustive-runtime-audit-3
