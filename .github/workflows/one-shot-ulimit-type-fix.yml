name: One-shot ulimit type fix
on:
  push:
    branches:
      - fix/exhaustive-runtime-audit-3
    paths:
      - .github/workflows/one-shot-ulimit-type-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/exhaustive-runtime-audit-3
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch and verify frontend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/features/docker/CreateContainerWizard.tsx')
          text = path.read_text(encoding='utf-8')
          old_import = '''  type ResourceLimitsDraft,\n  type ResourceProfile,\n'''
          new_import = '''  type ResourceLimitsDraft,\n  type ResourceProfile,\n  type UlimitDraft,\n'''
          if old_import not in text:
              raise SystemExit('UlimitDraft import marker missing')
          text = text.replace(old_import, new_import, 1)
          old = '''      if (Array.isArray(raw.ulimits)) safe.ulimits = raw.ulimits.flatMap((entry, index) => {\n        if (!entry || Array.isArray(entry) || typeof entry !== "object") return [];\n        const item = entry as Record<string, unknown>;\n        const name = item.name === "nofile" ? "nofile" : item.name === "nproc" ? "nproc" : null;\n        if (!name || typeof item.soft !== "string" || typeof item.hard !== "string") return [];\n        return [{ id: Number.isFinite(Number(item.id)) ? Number(item.id) : index + 1, name, soft: item.soft, hard: item.hard }];\n      }).slice(0, 2);\n'''
          new = '''      if (Array.isArray(raw.ulimits)) safe.ulimits = raw.ulimits.flatMap<UlimitDraft>((entry, index) => {\n        if (!entry || Array.isArray(entry) || typeof entry !== "object") return [];\n        const item = entry as Record<string, unknown>;\n        const name: UlimitDraft["name"] | null = item.name === "nofile" ? "nofile" : item.name === "nproc" ? "nproc" : null;\n        if (!name || typeof item.soft !== "string" || typeof item.hard !== "string") return [];\n        return [{ id: Number.isFinite(Number(item.id)) ? Number(item.id) : index + 1, name, soft: item.soft, hard: item.hard }];\n      }).slice(0, 2);\n'''
          if old not in text:
              raise SystemExit('ulimit typing marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cd frontend
          npm ci
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit code change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/docker/CreateContainerWizard.tsx
          git commit -m "fix: preserve Docker ulimit draft literal types"
          git push origin HEAD:fix/exhaustive-runtime-audit-3
