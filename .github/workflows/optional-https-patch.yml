name: Apply optional HTTPS patch

on:
  push:
    branches:
      - feat/optional-https-settings
    paths:
      - scripts/apply_optional_https_patch.py
      - .github/workflows/optional-https-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/optional-https-settings
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/apply_optional_https_patch.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make HTTPS optional and configurable"
          git push origin HEAD:feat/optional-https-settings
