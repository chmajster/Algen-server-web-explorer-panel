name: Patch PR35 React purity

on:
  push:
    branches:
      - feat/dcst-enterprise-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/dcst-enterprise-ui
          fetch-depth: 0

      - name: Apply React-pure log clock handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/features/dcst/DcstApp.tsx")
          text = path.read_text(encoding="utf-8")

          state_anchor = '  const [logRange, setLogRange] = useState("");\n'
          if state_anchor not in text:
              raise SystemExit("log range state anchor not found")
          text = text.replace(state_anchor, state_anchor + '  const [logSnapshotTime, setLogSnapshotTime] = useState(0);\n', 1)

          logs_anchor = '      setLogs(nextLogs);\n      setDiagnostics(nextDiagnostics);'
          if logs_anchor not in text:
              raise SystemExit("log load anchor not found")
          text = text.replace(logs_anchor, '      setLogs(nextLogs);\n      setLogSnapshotTime(Date.now());\n      setDiagnostics(nextDiagnostics);', 1)

          if '    const now = Date.now();' not in text:
              raise SystemExit("render-time Date.now anchor not found")
          text = text.replace('    const now = Date.now();', '    const now = logSnapshotTime;', 1)

          old_deps = '  }, [normalizedLogs, logSearch, logNode, logDirection, logAction, logSource, logDestination, logRange]);'
          new_deps = '  }, [normalizedLogs, logSearch, logNode, logDirection, logAction, logSource, logDestination, logRange, logSnapshotTime]);'
          if old_deps not in text:
              raise SystemExit("filter dependency anchor not found")
          text = text.replace(old_deps, new_deps, 1)

          old_select = '<select value={logRange} onChange={(event) => setLogRange(event.target.value)}>'
          new_select = '<select value={logRange} onChange={(event) => { setLogRange(event.target.value); setLogSnapshotTime(Date.now()); }}>'
          if old_select not in text:
              raise SystemExit("time range select anchor not found")
          text = text.replace(old_select, new_select, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/patch-pr35-purity.yml

      - name: Commit purity fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/dcst/DcstApp.tsx .github/workflows/patch-pr35-purity.yml
          git commit -m "Fix DCST log filter React purity"
          git push origin HEAD:feat/dcst-enterprise-ui
