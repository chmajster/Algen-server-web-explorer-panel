name: Patch PR35 review findings

on:
  push:
    branches:
      - feat/dcst-enterprise-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/dcst-enterprise-ui
          fetch-depth: 0

      - name: Apply targeted review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/features/dcst/DcstApp.tsx")
          text = path.read_text(encoding="utf-8")

          old_now = '    const now = normalizedLogs.reduce((latest, row) => Math.max(latest, syncTimestamp({ time: row.dcst_time }) ?? 0), 0);'
          new_now = '    const now = Date.now();'
          if old_now not in text:
              raise SystemExit("log range anchor not found")
          text = text.replace(old_now, new_now, 1)

          anchor = '  const normalizedLogs = useMemo(() => logs.map(normalizeFirewallLog), [logs]);\n'
          usage = '''  const portUsage = useMemo(() => {\n    const counts = new Map<string, number>();\n    services.forEach((service) => service.port_ids.forEach((portId) => counts.set(portId, (counts.get(portId) || 0) + 1)));\n    return counts;\n  }, [services]);\n\n'''
          if anchor not in text:
              raise SystemExit("port usage insertion anchor not found")
          text = text.replace(anchor, usage + anchor, 1)

          old_list = '<td>{port.dependencies?.length || 0} policies</td><td>{port.description || "—"}</td>'
          new_list = '<td>{portUsage.get(port.id) || 0} policies</td><td>{port.description || "—"}</td>'
          if old_list not in text:
              raise SystemExit("port list dependency count not found")
          text = text.replace(old_list, new_list, 1)

          old_detail = '<div><span>Used by</span><strong>{portDetails.dependencies?.length || 0} policies</strong></div>'
          new_detail = '<div><span>Used by</span><strong>{portUsage.get(portDetails.id) || 0} policies</strong></div>'
          if old_detail not in text:
              raise SystemExit("port detail dependency count not found")
          text = text.replace(old_detail, new_detail, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary patch workflow
        run: rm .github/workflows/patch-pr35-review.yml

      - name: Commit targeted fixes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/dcst/DcstApp.tsx .github/workflows/patch-pr35-review.yml
          git commit -m "Fix DCST log ranges and port usage counts"
          git push origin HEAD:feat/dcst-enterprise-ui
