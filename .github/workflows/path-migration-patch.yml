name: Path migration patch

on:
  push:
    branches:
      - chore/organize-doc-install-files

permissions:
  contents: write

jobs:
  patch-paths:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Finalize moved installer references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('.')
          old_url = 'https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install.sh'
          new_url = 'https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install/install.sh'

          # Public download references must follow the relocated launcher.
          for path in repo.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(old_url, new_url)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Launcher/menu download sibling installer scripts from install/.
          for relative in ('install/install.sh', 'install/install-standard-menu.sh'):
              path = repo / relative
              text = path.read_text(encoding='utf-8')
              old = 'RAW_BASE_URL="https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main"'
              new = 'RAW_BASE_URL="https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install"'
              if old in text:
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          # The standard installer now lives one directory below the repository root.
          path = repo / 'install/install-standard.sh'
          text = path.read_text(encoding='utf-8')
          old = '''  local script_dir=""
  local resolved_script_dir=""
  local resolved_install_dir=""
  script_dir="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" 2>/dev/null && pwd || true)"
  resolved_script_dir="$(readlink -f "$script_dir" 2>/dev/null || printf '%s' "$script_dir")"
  resolved_install_dir="$(readlink -f "$INSTALL_DIR" 2>/dev/null || printf '%s' "$INSTALL_DIR")"
  if [[ -n "$script_dir" && -f "${script_dir}/backend/app/main.py" && -f "${script_dir}/frontend/package.json" ]]; then
    if [[ "$resolved_script_dir" == "$resolved_install_dir" && "$ACTION" != "install" ]]; then
      warn "Installer is running from the current application directory; downloading a fresh source archive before ${ACTION}"
    else
      SOURCE_DIR="$script_dir"
'''
          new = '''  local script_dir=""
  local source_root=""
  local resolved_script_dir=""
  local resolved_install_dir=""
  script_dir="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" 2>/dev/null && pwd || true)"
  source_root="$script_dir"
  if [[ -n "$script_dir" && -f "${script_dir}/../backend/app/main.py" && -f "${script_dir}/../frontend/package.json" ]]; then
    source_root="$(cd "${script_dir}/.." 2>/dev/null && pwd || true)"
  fi
  resolved_script_dir="$(readlink -f "$source_root" 2>/dev/null || printf '%s' "$source_root")"
  resolved_install_dir="$(readlink -f "$INSTALL_DIR" 2>/dev/null || printf '%s' "$INSTALL_DIR")"
  if [[ -n "$source_root" && -f "${source_root}/backend/app/main.py" && -f "${source_root}/frontend/package.json" ]]; then
    if [[ "$resolved_script_dir" == "$resolved_install_dir" && "$ACTION" != "install" ]]; then
      warn "Installer is running from the current application directory; downloading a fresh source archive before ${ACTION}"
    else
      SOURCE_DIR="$source_root"
'''
          if old not in text and 'local source_root=""' not in text:
              raise SystemExit('Expected prepare_source block not found in install/install-standard.sh')
          if old in text:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Remaining tests must read installers from install/.
          replacements = {
              'backend/tests/test_install_launcher.py': {
                  'LAUNCHER = REPOSITORY / "install.sh"': 'LAUNCHER = REPOSITORY / "install" / "install.sh"',
              },
              'backend/tests/test_installer.py': {
                  'INSTALLER = REPOSITORY / "install-standard.sh"': 'INSTALLER = REPOSITORY / "install" / "install-standard.sh"',
              },
          }
          for relative, mapping in replacements.items():
              path = repo / relative
              text = path.read_text(encoding='utf-8')
              for old_value, new_value in mapping.items():
                  text = text.replace(old_value, new_value)
              path.write_text(text, encoding='utf-8')
          PY

          bash -n install/install.sh install/install-standard.sh install/install-standard-menu.sh install/install-portable.sh
          python3 -m py_compile backend/app/settings.py backend/app/privileged_broker/extended_policy.py \
            backend/tests/test_install_launcher.py backend/tests/test_installer.py \
            backend/tests/test_installer_authentication_bootstrap.py backend/tests/test_file_listing.py
          python3 -m pytest -q backend/tests/test_install_launcher.py \
            backend/tests/test_installer.py -k 'installer_has_valid_bash_syntax or source_archive or installation_summary or wsl or interactive_configuration'
          git diff --check

          test -f install/install.sh
          test -f install/install-standard.sh
          test -f install/install-standard-menu.sh
          test -f install/install-portable.sh
          test ! -e install.sh
          test ! -e install-standard.sh
          test ! -e install-standard-menu.sh
          test ! -e install-portable.sh

      - name: Commit finalized migration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: complete installer path migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
