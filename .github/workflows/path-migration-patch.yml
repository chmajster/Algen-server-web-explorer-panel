name: Path migration patch

on:
  push:
    branches:
      - chore/organize-doc-install-files

permissions:
  contents: write

jobs:
  patch-paths:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch moved installer references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('.')
          old_url = 'https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install.sh'
          new_url = 'https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install/install.sh'

          # Any caller downloading the public launcher must follow its new path.
          for path in repo.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(old_url, new_url)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Launcher and menu download sibling installer scripts from install/.
          for relative in ('install/install.sh', 'install/install-standard-menu.sh'):
              path = repo / relative
              text = path.read_text(encoding='utf-8')
              old = 'RAW_BASE_URL="https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main"'
              new = 'RAW_BASE_URL="https://raw.githubusercontent.com/chmajster/Algen-server-web-explorer-panel/main/install"'
              if old not in text:
                  raise SystemExit(f'Expected RAW_BASE_URL not found in {relative}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          bash -n install/install.sh install/install-standard.sh install/install-standard-menu.sh install/install-portable.sh
          python3 -m py_compile backend/app/settings.py backend/app/privileged_broker/extended_policy.py \
            backend/tests/test_installer_authentication_bootstrap.py backend/tests/test_file_listing.py
          git diff --check

      - name: Commit patched references
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: update references for moved installers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
