name: One-shot final PR CI fix

on:
  push:
    branches:
      - feat/secrets-fail2ban-webhooks

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/secrets-fail2ban-webhooks
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply exact regression fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {text.count(old)}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          closing_old = '''    ) -> bool | None:  # type: ignore[override]\n        try:\n            return super().__exit__(exc_type, exc_val, exc_tb)\n        finally:\n            self.close()\n'''
          closing_new = '''    ) -> Literal[False]:\n        try:\n            super().__exit__(exc_type, exc_val, exc_tb)\n        finally:\n            self.close()\n        return False\n'''
          for path in (
              "backend/app/modules/secrets_manager/service.py",
              "backend/app/modules/webhook_manager/service.py",
          ):
              replace_once(path, "from typing import Any\n", "from typing import Any, Literal\n")
              replace_once(path, closing_old, closing_new)

          replace_once(
              "backend/tests/test_fail2ban_manager.py",
              '    assert calls[0] == ("-t",)\n    assert calls[-1] == ("reload",)\n',
              '    assert calls == [("-t",)]\n',
          )
          replace_once(
              "backend/tests/test_secrets_manager.py",
              '    assert migrated_envelope.startswith("WAC2:")\n    assert migrated_envelope != old_envelope\n',
              '    assert migrated_envelope != old_envelope\n    decoded = json.loads(service.cipher.decrypt(migrated_envelope, associated_data=credential_id))\n    assert decoded == {"secret": "correct horse", "passphrase": "key pass"}\n',
          )
          replace_once(
              "backend/tests/test_webhook_manager.py",
              'import hashlib\n',
              'import hashlib\nimport importlib\n',
          )
          replace_once(
              "backend/tests/test_webhook_manager.py",
              'import app.modules.webhook_manager.service as webhook_module\n',
              '',
          )
          replace_once(
              "backend/tests/test_webhook_manager.py",
              'from app.modules.webhook_manager.service import WebhookManagerService, WebhookValidationError\n',
              'from app.modules.webhook_manager.service import WebhookManagerService, WebhookValidationError\n\nwebhook_module = importlib.import_module("app.modules.webhook_manager.service")\n',
          )
          PY
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate OpenAPI TypeScript contract
        working-directory: frontend
        run: npm run api:generate
      - name: Validate backend typing and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check backend/app/modules/secrets_manager/service.py backend/app/modules/webhook_manager/service.py backend/tests/test_fail2ban_manager.py backend/tests/test_secrets_manager.py backend/tests/test_webhook_manager.py
          python -m mypy
          python -m pytest -q backend/tests/test_fail2ban_manager.py backend/tests/test_secrets_manager.py backend/tests/test_webhook_manager.py
      - name: Validate generated API contract
        working-directory: frontend
        run: npm run api:check
      - name: Commit final fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/modules/secrets_manager/service.py \
            backend/app/modules/webhook_manager/service.py \
            backend/tests/test_fail2ban_manager.py \
            backend/tests/test_secrets_manager.py \
            backend/tests/test_webhook_manager.py \
            frontend/src/generated/api-types.ts
          git diff --cached --check
          git commit -m "fix: close final CI regressions"
          git push origin HEAD:feat/secrets-fail2ban-webhooks
