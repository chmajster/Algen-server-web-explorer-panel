name: One-shot final review fix

on:
  push:
    branches:
      - feat/secrets-fail2ban-webhooks

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/secrets-fail2ban-webhooks
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one match in {path}, found {text.count(old)}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # New secrets must start with no consumer access.
          replace_once(
              "frontend/src/modules/secrets-manager/SecretsManagerApp.tsx",
              ': { ...emptyInput(), shared_with: targets.map((target) => target.id) });',
              ': emptyInput());',
          )

          # Make legacy FK shadow creation explicit and collision-safe without mutating migrated rollback rows.
          service_path = Path("backend/app/modules/secrets_manager/service.py")
          text = service_path.read_text(encoding="utf-8")
          start = text.index("    def _sync_reference_shadow")
          end = text.index("    def save(", start)
          replacement = '''    def _sync_reference_shadow(self, metadata: dict[str, Any], *, actor: str) -> None:\n        \"\"\"Maintain an empty legacy row solely for existing Hosts Manager FKs.\n\n        Existing migrated rows are never overwritten, preserving the rollback\n        artifact byte-for-byte. New rows contain no encrypted secret material.\n        If a preserved legacy row owns the same display name, the FK shadow uses\n        an internal collision-safe name because the public metadata comes from\n        Secrets Manager.\n        \"\"\"\n        if not self.hosts_path.exists():\n            return\n        connection = sqlite3.connect(self.hosts_path, timeout=10)\n        connection.row_factory = sqlite3.Row\n        try:\n            exists = connection.execute(\n                \"SELECT 1 FROM sqlite_master WHERE type='table' AND name='credentials'\"\n            ).fetchone()\n            if not exists:\n                return\n            item_id = str(metadata[\"id\"])\n            existing = connection.execute(\n                \"SELECT id,encrypted_secret FROM credentials WHERE id=?\",\n                (item_id,),\n            ).fetchone()\n            if existing and str(existing[\"encrypted_secret\"] or \"\"):\n                return\n\n            preferred_name = str(metadata[\"name\"])\n            collision = connection.execute(\n                \"SELECT id FROM credentials WHERE name=? AND id<>?\",\n                (preferred_name, item_id),\n            ).fetchone()\n            shadow_name = preferred_name\n            if collision:\n                shadow_name = f\"{preferred_name}#shadow-{item_id}\"\n                second_collision = connection.execute(\n                    \"SELECT id FROM credentials WHERE name=? AND id<>?\",\n                    (shadow_name, item_id),\n                ).fetchone()\n                if second_collision:\n                    shadow_name = f\"shadow-{item_id}\"\n\n            now = time.time()\n            if existing:\n                connection.execute(\n                    \"\"\"\n                    UPDATE credentials SET name=?,type=?,username=?,description=?,environment_id=?,shared_with_json=?,\n                        active=1,updated_at=?,updated_by=?\n                    WHERE id=? AND encrypted_secret=''\n                    \"\"\",\n                    (\n                        shadow_name,\n                        metadata[\"type\"],\n                        metadata.get(\"username\", \"\"),\n                        metadata.get(\"description\", \"\"),\n                        metadata.get(\"environment_id\"),\n                        _json(metadata.get(\"shared_with\", [])),\n                        now,\n                        actor,\n                        item_id,\n                    ),\n                )\n            else:\n                connection.execute(\n                    \"\"\"\n                    INSERT INTO credentials(\n                        id,name,type,username,description,encrypted_secret,active,environment_id,\n                        shared_with_json,created_at,updated_at,created_by,updated_by\n                    ) VALUES(?,?,?,?,?,'',1,?,?,?,?,?,?)\n                    \"\"\",\n                    (\n                        item_id,\n                        shadow_name,\n                        metadata[\"type\"],\n                        metadata.get(\"username\", \"\"),\n                        metadata.get(\"description\", \"\"),\n                        metadata.get(\"environment_id\"),\n                        _json(metadata.get(\"shared_with\", [])),\n                        now,\n                        now,\n                        actor,\n                        actor,\n                    ),\n                )\n            connection.commit()\n            if not connection.execute(\n                \"SELECT 1 FROM credentials WHERE id=?\", (item_id,)\n            ).fetchone():\n                raise RuntimeError(\"legacy credential reference shadow was not created\")\n        finally:\n            connection.close()\n\n'''
          service_path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          # Fail2Ban filters must match complete jail/action/address tokens.
          replace_once(
              "backend/app/modules/fail2ban_manager/service.py",
              '''            if jail_lower and jail_lower not in lower:\n                continue\n            if ip_value and ip_value not in line:\n                continue\n            if action_lower and action_lower not in lower:\n                continue\n''',
              '''            if jail_lower and f"[{jail_lower}]" not in lower:\n                continue\n            if ip_value and not re.search(\n                rf"(?<![0-9A-Fa-f:.]){re.escape(ip_value)}(?![0-9A-Fa-f:.])", line\n            ):\n                continue\n            if action_lower and not re.search(rf"\\b{re.escape(action_lower)}\\b", lower):\n                continue\n''',
          )

          # Strengthen Fail2Ban regression fixture so substring matching fails the test.
          replace_once(
              "backend/tests/test_fail2ban_manager.py",
              '''            "2026-08-29T10:00:00+00:00 fail2ban.actions [sshd] Ban 192.0.2.10\\n"\n            "2026-08-29T10:01:00+00:00 fail2ban.actions [nginx] Unban 198.51.100.20\\n"\n''',
              '''            "2026-08-29T10:00:00+00:00 fail2ban.actions [sshd] Ban 192.0.2.10\\n"\n            "2026-08-29T10:01:00+00:00 fail2ban.actions [sshd] Unban 192.0.2.10\\n"\n            "2026-08-29T10:02:00+00:00 fail2ban.actions [sshd] Ban 192.0.2.100\\n"\n            "2026-08-29T10:03:00+00:00 fail2ban.actions [sshd-extra] Ban 192.0.2.10\\n"\n''',
          )

          # Add regression for legacy name collision after delete/recreate.
          tests_path = Path("backend/tests/test_secrets_manager.py")
          tests = tests_path.read_text(encoding="utf-8")
          marker = "\ndef test_delete_erases_envelope_and_releases_name"
          insert_at = tests.index(marker)
          regression = '''\n\ndef test_reused_name_creates_new_legacy_fk_shadow_when_old_shadow_keeps_name(\n    monkeypatch: pytest.MonkeyPatch, tmp_path: Path\n):\n    _patch_config(monkeypatch, tmp_path)\n    new_db, new_key, hosts_db, hosts_key = _service_paths(tmp_path)\n    old_cipher = CredentialCipher(hosts_key)\n    old_envelope = old_cipher.encrypt(\n        json.dumps({\"secret\": \"legacy-value\", \"passphrase\": \"\"}),\n        associated_data=\"legacy-id\",\n    )\n    _legacy_database(hosts_db, credential_id=\"legacy-id\", envelope=old_envelope)\n    webhooks_db = tmp_path / \"data\" / \"webhook-manager\" / \"webhooks.sqlite3\"\n    _webhook_database(webhooks_db)\n    service = SecretsManagerService(\n        path=new_db,\n        key_path=new_key,\n        hosts_path=hosts_db,\n        hosts_key_path=hosts_key,\n        webhooks_path=webhooks_db,\n    )\n\n    first = service.save(\n        SecretInput(\n            name=\"reused-name\",\n            type=\"generic_secret\",\n            secret=\"first\",\n            shared_with=[],\n            confirm=True,\n        ),\n        \"admin\",\n    )\n    assert service.delete(first[\"id\"], \"admin\") is True\n    replacement = service.save(\n        SecretInput(\n            name=\"reused-name\",\n            type=\"generic_secret\",\n            secret=\"second\",\n            shared_with=[],\n            confirm=True,\n        ),\n        \"admin\",\n    )\n\n    legacy = sqlite3.connect(hosts_db)\n    try:\n        row = legacy.execute(\n            \"SELECT name,encrypted_secret FROM credentials WHERE id=?\",\n            (replacement[\"id\"],),\n        ).fetchone()\n    finally:\n        legacy.close()\n    assert row is not None\n    assert row[0].startswith(\"reused-name#shadow-\")\n    assert row[1] == \"\"\n\n'''
          tests_path.write_text(tests[:insert_at] + regression + tests[insert_at:], encoding="utf-8")
          PY
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate review fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check backend/app/modules/secrets_manager/service.py backend/app/modules/fail2ban_manager/service.py backend/tests/test_secrets_manager.py backend/tests/test_fail2ban_manager.py
          python -m mypy
          python -m pytest -q backend/tests/test_secrets_manager.py backend/tests/test_fail2ban_manager.py backend/tests/test_webhook_manager.py
          cd frontend
          npm run lint
          npm run typecheck
          npm run api:check
      - name: Commit review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/modules/secrets-manager/SecretsManagerApp.tsx \
            backend/app/modules/secrets_manager/service.py \
            backend/app/modules/fail2ban_manager/service.py \
            backend/tests/test_secrets_manager.py \
            backend/tests/test_fail2ban_manager.py
          git diff --cached --check
          git commit -m "fix: address final security review findings"
          git push origin HEAD:feat/secrets-fail2ban-webhooks
