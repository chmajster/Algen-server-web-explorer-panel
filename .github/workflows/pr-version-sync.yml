name: One-shot PR version sync

on:
  push:
    branches:
      - feat/secrets-fail2ban-webhooks

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/secrets-fail2ban-webhooks
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Bump and synchronize release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(cat VERSION)" != "0.1.26" ]]; then
            echo "VERSION already synchronized; nothing to do."
            exit 0
          fi
          python scripts/sync-version.py --bump patch
          python scripts/sync-version.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION pyproject.toml backend/app/__init__.py frontend/package.json frontend/package-lock.json
          git commit -m "chore: release v0.1.27"
          git push origin HEAD:feat/secrets-fail2ban-webhooks
