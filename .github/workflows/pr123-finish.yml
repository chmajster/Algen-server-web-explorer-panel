name: Finish PR 123

on:
  push:
    branches:
      - feat/proxmox-manager-operations

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/proxmox-manager-operations
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Merge current main and resolve generated metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            for path in \
              VERSION \
              backend/app/__init__.py \
              frontend/package.json \
              frontend/package-lock.json \
              frontend/src/generated/api-types.ts \
              pyproject.toml
            do
              if git ls-files -u -- "$path" | grep -q .; then
                git checkout --theirs -- "$path"
                git add "$path"
              fi
            done
          fi
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            printf 'Unresolved merge conflicts:\n%s\n' "$unresolved" >&2
            exit 1
          fi
      - name: Bump merged release metadata to 0.1.28
        run: |
          set -euo pipefail
          python scripts/sync-version.py --bump patch
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          old = '## v0.1.27 — 2026-08-29\n\n- Expanded Proxmox Manager'
          new = '## v0.1.28 — 2026-08-30\n\n- Expanded Proxmox Manager'
          if old not in text:
              raise SystemExit('Expected Proxmox 0.1.27 changelog entry not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/sync-version.py --check
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Validate backend before commit
        run: |
          python -m ruff check backend scripts/export_openapi.py scripts/rollback_release.py
          python -m mypy
          python -m pytest -q backend/tests/test_proxmox_manager_operations.py
      - name: Regenerate combined OpenAPI contract
        working-directory: frontend
        run: |
          npm ci
          npm run api:generate
          npm run typecheck
      - name: Commit merged state and remove helper workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/pr123-finish.yml
          git add -A
          git status --short
          git commit -m "merge: integrate main into Proxmox Manager expansion"
          git push origin HEAD:feat/proxmox-manager-operations
