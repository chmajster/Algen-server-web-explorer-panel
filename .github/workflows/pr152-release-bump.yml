name: PR 152 one-shot release bump

on:
  push:
    branches:
      - fix/frontend-build-progress

permissions:
  contents: write

jobs:
  bump:
    if: github.repository == 'chmajster/Algen-server-web-explorer-panel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/frontend-build-progress
          fetch-depth: 0

      - name: Bump synchronized project version
        shell: bash
        run: |
          set -euo pipefail
          current="$(tr -d '\r\n' < VERSION)"
          if [[ "$current" != "0.1.31" ]]; then
            echo "Expected VERSION=0.1.31, got $current" >&2
            exit 1
          fi
          python scripts/sync-version.py --bump patch
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = "## Unreleased\n"
          if marker not in text:
              raise SystemExit("CHANGELOG.md is missing the Unreleased section")
          release = (
              "## v0.1.32 — 2026-08-31\n\n"
              "- Expanded Proxmox Manager with advanced cluster, capacity, placement, storage, backup, replication, HA, migration, network, SDN, cloud-init, policy and orphan-management workflows, plus the matching frontend and operational documentation.\n"
              "- Refined authentication UX with explicit PAM/LDAP provider selection and strengthened LDAP attribute normalization and connection handling.\n"
              "- Hardened installer update/reinstall flows and their CI coverage, including full-reinstall/menu scenarios and correct preservation of installer exit statuses.\n"
              "- Improved frontend build observability with context-neutral build completion output, explicit bundle-validation stages and JavaScript asset progress reporting.\n\n"
          )
          path.write_text(text.replace(marker, marker + "\n" + release, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/pr152-release-bump.yml
          python scripts/sync-version.py --check
          git diff --check

      - name: Commit synchronized release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION pyproject.toml backend/app/__init__.py frontend/package.json frontend/package-lock.json CHANGELOG.md .github/workflows/pr152-release-bump.yml
          git commit -m "release: bump version to 0.1.32"
          git push origin HEAD:fix/frontend-build-progress
