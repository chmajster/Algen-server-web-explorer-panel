name: PR207 lint fix

on:
  push:
    branches: [codex/webnas-rbac-ldap]
    paths: [.github/workflows/pr207-lint-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/webnas-rbac-ldap
      - name: Apply lint-safe frontend fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/features/admin/RbacAccessApp.tsx')
          text = path.read_text()
          replacements = [
              ('import { Check, Copy, Plus, RefreshCw, Search, ShieldCheck, Trash2 } from "lucide-react";', 'import { Check, Copy, Plus, RefreshCw, Search, Trash2 } from "lucide-react";'),
              ('const toggle = (permission: string) => setGrants((current) => { const next = new Set(current); next.has(permission) ? next.delete(permission) : next.add(permission); return next; });', 'const toggle = (permission: string) => setGrants((current) => { const next = new Set(current); if (next.has(permission)) next.delete(permission); else next.add(permission); return next; });'),
              ('const setCategory = (category: string, enabled: boolean) => setGrants((current) => { const next = new Set(current); permissions.filter((p) => p.category === category).forEach((p) => enabled ? next.add(p.canonical) : next.delete(p.canonical)); return next; });', 'const setCategory = (category: string, enabled: boolean) => setGrants((current) => { const next = new Set(current); permissions.filter((p) => p.category === category).forEach((p) => { if (enabled) next.add(p.canonical); else next.delete(p.canonical); }); return next; });'),
              (' const canonical = [...new Set(categoryPermissions.map((p) => p.canonical))]; const all = canonical.every((p) => grants.has(p)); return <fieldset', ' return <fieldset'),
              ('const n = new Set(current); n.has(r.id) ? n.delete(r.id) : n.add(r.id); return n;', 'const n = new Set(current); if (n.has(r.id)) n.delete(r.id); else n.add(r.id); return n;'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'RBAC lint target missing: {old[:60]}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('frontend/src/features/files/TextEditor.tsx')
          text = path.read_text()
          old = '  saveRef.current = () => { void save(); };\n\n  useEffect(() => {'
          new = '  useEffect(() => {\n    saveRef.current = () => { void save(); };\n  }, [save]);\n\n  useEffect(() => {'
          if old not in text:
              raise SystemExit('TextEditor ref patch target missing')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'webnas-ci'
          git config user.email 'webnas-ci@users.noreply.github.com'
          git add frontend/src/features/admin/RbacAccessApp.tsx frontend/src/features/files/TextEditor.tsx
          git commit -m 'fix(frontend): satisfy final lint gates'
          git push origin HEAD:codex/webnas-rbac-ldap
