name: PR207 OpenAPI fix

on:
  push:
    branches: [codex/webnas-rbac-ldap]
    paths: [.github/workflows/pr207-openapi-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/webnas-rbac-ldap
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate OpenAPI TypeScript contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.txt
          cd frontend
          npm ci
          npm run api:generate
          npm run api:check
          cd ..
          git diff --check
          git config user.name 'webnas-ci'
          git config user.email 'webnas-ci@users.noreply.github.com'
          git add frontend/src/generated/api-types.ts
          if git diff --cached --quiet; then
            echo 'No OpenAPI contract changes required.'
            exit 0
          fi
          git commit -m 'chore(api): regenerate OpenAPI TypeScript contract'
          git push origin HEAD:codex/webnas-rbac-ldap
