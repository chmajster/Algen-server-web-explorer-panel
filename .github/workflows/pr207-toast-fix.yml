name: PR207 toast fix

on:
  push:
    branches: [codex/webnas-rbac-ldap]
    paths: [.github/workflows/pr207-toast-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/webnas-rbac-ldap
      - name: Restore central toast contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/features/admin/RbacAccessApp.tsx')
          text = path.read_text()
          found = text.count(', "rbac")')
          if found == 0:
              raise SystemExit('no RBAC toast category calls found')
          path.write_text(text.replace(', "rbac")', ', "admin")'))

          path = Path('frontend/src/app/types.ts')
          text = path.read_text()
          found = text.count(' | "rbac"')
          if found != 2:
              raise SystemExit(f'expected 2 RBAC toast union entries, found {found}')
          path.write_text(text.replace(' | "rbac"', ''))
          PY
          git diff --check
          git config user.name 'webnas-ci'
          git config user.email 'webnas-ci@users.noreply.github.com'
          git add frontend/src/features/admin/RbacAccessApp.tsx frontend/src/app/types.ts
          git commit -m 'fix(frontend): align RBAC toasts with admin channel'
          git push origin HEAD:codex/webnas-rbac-ldap
