name: PR221 maintenance

on:
  push:
    branches:
      - feature/api-contract-test-suite

permissions:
  contents: write

jobs:
  maintenance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/api-contract-test-suite
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Regenerate frontend lock with security override
        working-directory: frontend
        run: |
          npm install --package-lock-only
          npm ci
          npm audit --audit-level=high
      - name: Commit dependency remediation
        run: |
          if ! git diff --quiet -- frontend/package-lock.json; then
            git add frontend/package-lock.json
            git commit -m "chore(deps): remediate js-yaml advisory"
            git push origin HEAD:feature/api-contract-test-suite
          fi
      - name: Bump patch release metadata
        run: |
          python scripts/sync-version.py --bump patch
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          marker = "## Unreleased\n"
          entry = """

          ## v0.1.33 — 2026-09-09

          - Added the WebNAS shell foundation and desktop/runtime architecture.
          - Unified RBAC with LDAP/AD group synchronization, policies and scoped authorization, including compatibility and security hardening.
          - Routed Docker Engine access through the privileged broker and fixed the Settings policy observer freeze.
          - Added API Explorer with typed frontend integration, read-only OpenAPI diagnostics and structural contract tests, including reusable parameter references and network-isolation coverage.
          """
          if "## v0.1.33 — 2026-09-09" not in text:
              text = text.replace(marker, marker + entry, 1)
              path.write_text(text, encoding="utf-8")
          PY
          python scripts/sync-version.py --check
      - name: Commit release metadata
        run: |
          git add VERSION pyproject.toml backend/app/__init__.py frontend/package.json frontend/package-lock.json docs/CHANGELOG.md
          git commit -m "chore(release): bump version to 0.1.33"
          git push origin HEAD:feature/api-contract-test-suite
