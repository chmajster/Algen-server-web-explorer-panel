name: PR4 clean replay

on:
  push:
    branches:
      - fix/pr4-clean-replay

permissions:
  contents: write

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pr4-clean-replay
          fetch-depth: 0

      - name: Replay reviewed PR4 source changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ui/nonblocking-minimizable-dialogs
          git diff 798062c6f4fd3cd71b6d2ba7b0a18fbc0a06e7bf..953424f8ec78fa01f63fef1278f67570e5903132 -- \
            frontend/src/app/App.tsx \
            frontend/src/app/Desktop.test.tsx \
            frontend/src/app/Desktop.tsx \
            frontend/src/components/DialogService.tsx \
            frontend/src/components/Modal.test.tsx \
            frontend/src/components/Modal.tsx \
            frontend/src/features/admin/IdentityApp.tsx \
            frontend/src/features/docker/CreateContainerWizard.tsx \
            frontend/src/features/logs/LogsApp.tsx \
            frontend/src/features/modules/ansible/AnsibleControllerApp.tsx \
            frontend/src/features/modules/apmid/ApmidApp.tsx \
            frontend/src/features/modules/hosts/HostsManagerApp.tsx \
            frontend/src/features/package-center/PackageJobDialog.test.tsx \
            frontend/src/features/settings/NetworkManagementPanels.tsx \
            frontend/src/main.tsx \
            frontend/src/styles/dialog-compat.css \
            > /tmp/pr4.patch
          git apply --3way --index /tmp/pr4.patch

          echo '' | base64 -d > /tmp/version.py
          python3 /tmp/version.py

          git rm .github/workflows/pr4-clean-replay.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finalize non-blocking minimizable dialogs"
          git push origin HEAD:fix/pr4-clean-replay
