name: PR4 edge fixes

on:
  push:
    branches:
      - ui/nonblocking-minimizable-dialogs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ui/nonblocking-minimizable-dialogs
      - name: Apply reviewed edge-case fixes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/edge.py
          python3 /tmp/edge.py
          git rm .github/workflows/pr4-edge-fixes.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: harden minimized dialog edge cases"
          git push origin HEAD:ui/nonblocking-minimizable-dialogs
