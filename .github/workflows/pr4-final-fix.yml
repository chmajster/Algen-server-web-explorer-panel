name: PR4 final dialog fixes

on:
  push:
    branches:
      - ui/nonblocking-minimizable-dialogs

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ui/nonblocking-minimizable-dialogs
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply final review fixes
        run: python .github/pr4_final_fix.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run focused dialog tests
        working-directory: frontend
        run: npm test -- src/components/Modal.test.tsx src/features/modules/apmid/ApmidApp.test.tsx

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run full frontend test suite
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify deployed frontend contract
        run: python scripts/verify_frontend_build.py frontend/dist

      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/components/Modal.tsx \
            frontend/src/components/Modal.test.tsx \
            frontend/src/components/DialogService.tsx \
            frontend/src/features/modules/apmid/ApmidApp.tsx \
            frontend/src/features/modules/apmid/ApmidApp.test.tsx
          git diff --cached --check
          git commit -m "fix: close final dialog review findings"
          git push origin HEAD:ui/nonblocking-minimizable-dialogs
