name: Refresh PR42 API contract

on:
  push:
    branches:
      - integrate/pr42-persistent-systems

permissions:
  contents: write

jobs:
  refresh-api:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integrate/pr42-persistent-systems
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Generate API contract
        working-directory: frontend
        run: npm run api:generate
      - name: Commit generated contract
        run: |
          if git diff --quiet -- frontend/src/generated/api-types.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/generated/api-types.ts
          git commit -m 'chore(api): refresh generated contract for persistent systems'
          git push origin HEAD:integrate/pr42-persistent-systems
