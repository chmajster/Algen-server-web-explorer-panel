name: Prepare 0.1.30 release metadata

on:
  push:
    branches:
      - fix/job-runner-shutdown
    paths:
      - .github/workflows/prepare-0130.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/job-runner-shutdown
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Bump and synchronize project version
        shell: bash
        run: |
          set -euo pipefail
          current="$(tr -d '\r\n' < VERSION)"
          if [ "$current" = "0.1.29" ]; then
            python scripts/sync-version.py --bump patch
          elif [ "$current" = "0.1.30" ]; then
            python scripts/sync-version.py
          else
            echo "Unexpected VERSION: $current" >&2
            exit 1
          fi
          python scripts/sync-version.py --check
          test "$(tr -d '\r\n' < VERSION)" = "0.1.30"
      - name: Commit synchronized release metadata
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/prepare-0130.yml
          git config user.name "webnas-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add VERSION pyproject.toml backend/app/__init__.py frontend/package.json frontend/package-lock.json
          git commit -m "release: bump version to 0.1.30"
          git push origin HEAD:fix/job-runner-shutdown
