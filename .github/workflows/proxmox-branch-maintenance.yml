name: Proxmox branch maintenance

on:
  push:
    branches:
      - feat/proxmox-manager-operations

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/proxmox-manager-operations
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply deterministic maintenance fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path('backend/app/modules/proxmox_manager/router.py')
          text = router.read_text()
          text = text.replace('import time\n', '')
          text = text.replace(
              '    if len(matches) > 1:\n        api_error(409, "PROXMOX_NODE_AMBIGUOUS", "Node name exists in more than one Proxmox connection; provide connection_id")\n',
              '    if len(matches) > 1:\n        raise ValueError("Node name exists in more than one Proxmox connection; provide connection_id")\n',
          )
          text = text.replace(
              '    if not lock.acquire(blocking=False):\n        api_error(409, "PROXMOX_SYNC_IN_PROGRESS", "A synchronization for this Proxmox connection is already running")\n',
              '    if not lock.acquire(blocking=False):\n        raise ValueError("A synchronization for this Proxmox connection is already running")\n',
          )
          router.write_text(text)

          service = Path('backend/app/modules/proxmox_manager/service.py')
          text = service.read_text()
          needle = '    def put(self, path: str, data: dict[str, Any] | None = None) -> Any:\n        return self.request("PUT", path, data)\n'
          replacement = needle + '\n    def delete(self, path: str, data: dict[str, Any] | None = None) -> Any:\n        return self.request("DELETE", path, data)\n'
          if '    def delete(self, path: str, data: dict[str, Any] | None = None) -> Any:' not in text:
              if needle not in text:
                  raise SystemExit('ProxmoxApiClient PUT helper anchor not found')
              text = text.replace(needle, replacement, 1)
          service.write_text(text)

          operations = Path('backend/app/modules/proxmox_manager/operations.py')
          text = operations.read_text().replace(
              'client.request("DELETE", f"{_base(resource)}/snapshot/{snapshot_name}")',
              'client.delete(f"{_base(resource)}/snapshot/{snapshot_name}")',
          )
          operations.write_text(text)

          tasks = Path('frontend/src/features/modules/proxmox/Tasks.tsx')
          text = tasks.read_text()
          old = '''      if (selected) {
                const updated = result.tasks.find((item) => item.connection_id === selected.connection_id && item.upid === selected.upid);
                if (updated) setSelected(updated);
              }
            } catch (error) {
              if (!quiet) toast(error instanceof Error ? error.message : t("error.generic"), "error", "admin", "proxmox-manager");
            } finally {
              if (!quiet) setLoading(false);
            }
          }, [selected, t, toast]);

          useEffect(() => { void refresh(); }, [refreshKey]); // eslint-disable-line react-hooks/exhaustive-deps
          '''
          new = '''      setSelected((current) => {
                if (!current) return current;
                return result.tasks.find((item) => item.connection_id === current.connection_id && item.upid === current.upid) || current;
              });
            } catch (error) {
              if (!quiet) toast(error instanceof Error ? error.message : t("error.generic"), "error", "admin", "proxmox-manager");
            } finally {
              if (!quiet) setLoading(false);
            }
          }, [t, toast]);

          useEffect(() => { void refresh(); }, [refreshKey, refresh]);
          '''
          if old in text:
              text = text.replace(old, new, 1)
          tasks.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          entry = '''## v0.1.27 — 2026-08-29

          - Expanded Proxmox Manager with live node/storage/cluster/VM detail views, central UPID task tracking, snapshots, cloning, migration, hardware and disk growth operations, full locked/backoff inventory auto-sync, a split responsive frontend, create-VM workflow, Host Registry identity preservation, audit integration, tests, and updated documentation without persisting Proxmox secrets or a duplicate VM/LXC inventory.

          '''
          if '## v0.1.27 — 2026-08-29' not in text:
              text = text.replace('## Unreleased\n\n', '## Unreleased\n\n' + entry, 1)
          changelog.write_text(text)
          PY
      - name: Install backend tooling
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install ruff==0.14.10
      - name: Fix lint-safe import cleanup
        run: ruff check --fix backend/app/modules/proxmox_manager/operations.py backend/app/modules/proxmox_manager/router.py backend/tests/test_proxmox_manager_operations.py
      - name: Bump and synchronize patch version
        run: python3 scripts/sync-version.py --bump patch
      - name: Generate OpenAPI TypeScript contract
        working-directory: frontend
        run: |
          npm ci
          npm run api:generate
      - name: Commit generated maintenance changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md VERSION pyproject.toml frontend/package.json frontend/package-lock.json frontend/src/generated/api-types.ts backend/app/modules/proxmox_manager frontend/src/features/modules/proxmox backend/tests/test_proxmox_manager_operations.py
          if git diff --cached --quiet; then
            echo 'No generated maintenance changes.'
            exit 0
          fi
          git commit -m 'chore: sync Proxmox release metadata and contracts'
          git push origin HEAD:feat/proxmox-manager-operations
