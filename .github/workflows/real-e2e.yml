name: Real stack E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-stack-e2e:
    name: Browser to FastAPI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend test runtime
        working-directory: .
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run browser against real FastAPI and SQLite
        env:
          CI: "true"
        run: npm run test:e2e:real
      - name: Upload real-stack Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-real-stack-report
          path: |
            frontend/playwright-report-real/
            frontend/test-results-real/
          if-no-files-found: ignore
          retention-days: 14
