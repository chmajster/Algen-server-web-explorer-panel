name: Recovery development verification
on:
  push:
    branches: [feat/update-version-recovery-20260914]
    paths:
      - '.recovery-*.patch'
      - '.github/workflows/recovery-development.yml'
permissions:
  contents: write
concurrency:
  group: recovery-development
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'chmajster/Algen-server-web-explorer-panel' && github.ref == 'refs/heads/feat/update-version-recovery-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/update-version-recovery-20260914
      - name: Apply reviewed implementation and regression tests
        run: |
          set -euo pipefail
          if test -f .recovery-implementation.patch; then
            git apply --check --recount .recovery-implementation.patch .recovery-frontend.patch .recovery-tests.patch
            git apply --index --recount .recovery-implementation.patch .recovery-frontend.patch .recovery-tests.patch
            git rm .recovery-implementation.patch .recovery-frontend.patch .recovery-tests.patch
          fi
          git diff --check
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm --prefix frontend ci
      - name: Regenerate the API contract
        working-directory: frontend
        run: npm run api:generate
      - name: Commit implementation to the feature branch only
        run: |
          set -euo pipefail
          git config user.name 'chmajster'
          git config user.email '44300091+chmajster@users.noreply.github.com'
          git add backend/app backend/tests frontend/src install/install-standard.sh CHANGELOG.d
          if ! git diff --cached --quiet; then
            git commit -m 'feat: recover failed WebNAS updates with a selected repository version'
            git push origin HEAD:feat/update-version-recovery-20260914
          fi
          git rev-parse HEAD
      - name: Run recovery and existing update tests
        run: python -m pytest -q backend/tests/test_update_versions.py backend/tests/test_update_recovery.py backend/tests/test_update_recovery_broker.py backend/tests/test_update_coordination.py backend/tests/test_user_settings.py backend/tests/test_installer.py
      - name: Backend lint and types
        run: |
          python -m ruff check backend
          python -m mypy
      - name: Frontend lint, types and recovery tests
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test -- src/features/settings/UpdateVersionRecovery.test.tsx src/features/settings/UpdateStatusPage.test.tsx
      - name: Export source and verification state
        if: always()
        run: |
          git status --short > recovery-state.txt
          git rev-parse HEAD >> recovery-state.txt
          git archive HEAD -o recovery-source.tar
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recovery-verified-source
          path: |
            recovery-source.tar
            recovery-state.txt
          retention-days: 1
