name: Refactor bootstrap lock

on:
  push:
    branches:
      - refactor/frontend-platform-20260828

permissions:
  contents: write

jobs:
  refresh-generated-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/frontend-platform-20260828
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Refresh npm lockfile and generated OpenAPI types
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run api:generate
      - name: Commit deterministic generated assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json frontend/src/generated/api-types.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json frontend/src/generated/api-types.ts
          git commit -m "Generate OpenAPI TypeScript contract and npm lock"
          git push origin HEAD:refactor/frontend-platform-20260828
