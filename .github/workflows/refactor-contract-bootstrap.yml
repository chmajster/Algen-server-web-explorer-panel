name: Bootstrap generated API contracts

on:
  push:
    branches:
      - refactor/persistent-jobs-plugins-openapi

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/persistent-jobs-plugins-openapi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Synchronize version metadata
        run: python scripts/sync-version.py
      - name: Generate OpenAPI snapshot
        run: python scripts/generate-openapi.py
      - name: Generate TypeScript API types
        working-directory: frontend
        run: npm run api:generate
      - name: Commit generated contracts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Generated contracts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json openapi/openapi.json frontend/src/core/api/generated/api-types.ts
          git commit -m "chore: refresh generated API contracts"
          git push origin HEAD:refactor/persistent-jobs-plugins-openapi
