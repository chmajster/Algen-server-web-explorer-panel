name: Refresh OpenAPI contract

on:
  push:
    branches:
      - feature/webnas-shell-foundation

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[api-contract-refreshed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/webnas-shell-foundation
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate and verify OpenAPI TypeScript contract
        working-directory: frontend
        run: |
          npm run api:generate
          npm run api:check
          npm run typecheck
      - name: Commit generated contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/generated/api-types.ts
          if git diff --cached --quiet; then
            echo "Contract already current"
            exit 0
          fi
          git commit -m "chore(frontend): refresh OpenAPI contract [api-contract-refreshed] [skip ci]"
          git push origin HEAD:feature/webnas-shell-foundation
