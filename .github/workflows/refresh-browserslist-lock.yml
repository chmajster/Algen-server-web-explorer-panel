name: Refresh browserslist lock

on:
  push:
    branches:
      - feature/webnas-shell-foundation

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refreshed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/webnas-shell-foundation
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh browserslist dependency tree
        working-directory: frontend
        run: npm update browserslist --package-lock-only --ignore-scripts
      - name: Verify high and critical audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: refresh browserslist lock [lock-refreshed] [skip ci]"
          git push origin HEAD:feature/webnas-shell-foundation
