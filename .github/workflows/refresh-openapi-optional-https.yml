name: Refresh OpenAPI contract for optional HTTPS

on:
  push:
    branches:
      - feat/optional-https-settings
    paths:
      - .github/workflows/refresh-openapi-optional-https.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/optional-https-settings
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate OpenAPI TypeScript contract
        working-directory: frontend
        run: npm run api:generate
      - name: Commit generated contract
        run: |
          rm -f .github/workflows/refresh-openapi-optional-https.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/generated/api-types.ts .github/workflows/refresh-openapi-optional-https.yml
          git diff --cached --check
          git commit -m "Refresh OpenAPI contract for HTTPS settings"
          git push origin HEAD:feat/optional-https-settings
