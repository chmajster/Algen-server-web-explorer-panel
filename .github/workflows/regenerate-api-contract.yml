name: Regenerate API contract

on:
  push:
    branches:
      - feat/ldap-authentication

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ldap-authentication
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate OpenAPI TypeScript contract
        working-directory: frontend
        run: npm run api:generate
      - name: Commit generated contract
        run: |
          if git diff --quiet -- frontend/src/generated/api-types.ts; then
            echo 'API contract is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/generated/api-types.ts
          git commit -m 'chore(api): regenerate merged OpenAPI types'
          git push origin HEAD:feat/ldap-authentication
