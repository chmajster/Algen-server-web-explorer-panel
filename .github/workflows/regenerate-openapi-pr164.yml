name: Regenerate OpenAPI contract for PR 164

on:
  push:
    branches:
      - fix/package-less-module-installation

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/package-less-module-installation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Regenerate committed OpenAPI types
        working-directory: frontend
        run: npm run api:generate
      - name: Commit generated contract
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/src/generated/api-types.ts; then
            echo "OpenAPI contract already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/generated/api-types.ts
          git commit -m "Regenerate OpenAPI contract"
          git push origin HEAD:fix/package-less-module-installation
