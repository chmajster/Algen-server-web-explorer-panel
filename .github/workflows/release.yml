name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate tag, main ancestry and synchronized version
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync-version.py --check
          version="$(tr -d '\r\n' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "${tag_version}" != "${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION=${version}."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tagged commit is not reachable from main."
            exit 1
          fi

      - name: Install backend development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Run backend quality, security and tests
        run: |
          python -m ruff check backend scripts/export_openapi.py scripts/rollback_release.py
          python -m mypy
          python -m bandit -c pyproject.toml -r backend/app
          python -m pip_audit -r backend/requirements.txt
          python -m pytest -ra -m "not system"

      - name: Build backend distribution
        run: python -m build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend checks
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run api:check
          npm audit --audit-level=high
          npm test
          npm run build

      - name: Verify frontend production build
        run: python scripts/verify_frontend_build.py frontend/dist

      - name: Prepare release artifact directory
        run: mkdir -p release-artifacts

      - name: Generate backend CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: cyclonedx-json
          output-file: ./release-artifacts/sbom-backend.json
          upload-artifact: false

      - name: Generate frontend CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./frontend
          format: cyclonedx-json
          output-file: ./release-artifacts/sbom-frontend.json
          upload-artifact: false

      - name: Package release artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          cp dist/* release-artifacts/
          tar -C frontend -czf "release-artifacts/webnas-frontend-${version}.tar.gz" dist
          (
            cd release-artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/* --verify-tag --generate-notes
