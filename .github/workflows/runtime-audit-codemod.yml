name: Runtime audit codemod

on:
  push:
    branches:
      - fix/runtime-audit-followup
    paths:
      - .github/workflows/runtime-audit-codemod.yml

permissions:
  contents: write

jobs:
  inspect-network-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-audit-followup
          fetch-depth: 0
      - name: List Network Management UI copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("frontend/src/features/settings/NetworkManagementPanels.tsx")
          text = path.read_text(encoding="utf-8")
          values = set()

          for match in re.finditer(r'(?P<q>["\'])(?P<value>.*?)(?P=q)', text):
              value = match.group("value").strip()
              if not value or value.startswith(("network-", "api/", "/api/", "ipv", "active-", "balance-", "layer", "button", "dialog", "presentation")):
                  continue
              if re.search(r'[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]', value) and (" " in value or re.search(r'[ĄĆĘŁŃÓŚŹŻąćęłńóśźż]', value)):
                  values.add(value)

          for match in re.finditer(r'>([^<{][^<]*?)<', text):
              value = re.sub(r'\s+', ' ', match.group(1)).strip()
              if value and re.search(r'[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]', value):
                  values.add(value)

          print("NETWORK_UI_COPY_BEGIN")
          for value in sorted(values, key=str.casefold):
              print(value)
          print("NETWORK_UI_COPY_END")
          PY
