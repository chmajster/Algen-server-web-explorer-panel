name: Runtime audit finalize

on:
  push:
    branches:
      - fix/runtime-audit-followup
    paths:
      - .github/workflows/runtime-audit-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-audit-followup
          fetch-depth: 0
      - name: Remove codemod self-import and temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          transport = Path("frontend/src/core/api/transport.ts")
          text = transport.read_text(encoding="utf-8")
          text = text.replace('import { apiUrl } from "./transport";\n', "")
          transport.write_text(text, encoding="utf-8")
          Path(".github/workflows/runtime-audit-finalize.yml").unlink()
          PY
      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(api): remove transport self-import"
          git push origin HEAD:fix/runtime-audit-followup
