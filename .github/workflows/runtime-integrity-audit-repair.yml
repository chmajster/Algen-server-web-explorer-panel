name: Runtime integrity audit repair

on:
  push:
    branches:
      - fix/runtime-integrity-audit-2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-integrity-audit-2
          fetch-depth: 0
      - name: Apply audited fixes and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1. Persisted transfer state: one corrupt row must not break manager startup.
          replace_once(
              "backend/app/services/file_task_manager.py",
              '            rows = conn.execute("SELECT payload,username,type,source_paths,destination_path,status,priority FROM file_tasks").fetchall()\n',
              '            rows = conn.execute("SELECT id,payload,username,type,source_paths,destination_path,status,priority FROM file_tasks").fetchall()\n',
          )
          replace_once(
              "backend/app/services/file_task_manager.py",
              '''            for row in rows:\n                payload = json.loads(row["payload"])\n                # Older WebNAS versions omitted these required fields from the\n                # JSON payload. The normalized table columns are the migration\n                # source of truth and let upgrades start without losing history.\n                payload.setdefault("username", row["username"])\n                payload.setdefault("type", row["type"])\n                payload.setdefault("source_paths", json.loads(row["source_paths"]))\n                payload.setdefault("destination_path", row["destination_path"])\n                payload["status"] = row["status"]\n                payload.setdefault("priority", row["priority"])\n                task = self._task_from_payload(payload)\n''',
              '''            for row in rows:\n                try:\n                    payload = json.loads(row["payload"])\n                    if not isinstance(payload, dict):\n                        raise ValueError("stored transfer payload is not an object")\n                    source_paths = json.loads(row["source_paths"])\n                    if not isinstance(source_paths, list):\n                        raise ValueError("stored transfer sources are not a list")\n                    # Older WebNAS versions omitted required fields from the JSON\n                    # payload. The normalized table columns are the migration source\n                    # of truth and let upgrades start without losing history.\n                    payload.setdefault("id", row["id"])\n                    payload.setdefault("username", row["username"])\n                    payload.setdefault("type", row["type"])\n                    payload.setdefault("source_paths", source_paths)\n                    payload.setdefault("destination_path", row["destination_path"])\n                    payload["status"] = row["status"]\n                    payload.setdefault("priority", row["priority"])\n                    task = self._task_from_payload(payload)\n                except (json.JSONDecodeError, TypeError, ValueError, KeyError, AttributeError):\n                    task = FileTask(\n                        id=str(row["id"]),\n                        username=str(row["username"]),\n                        type=str(row["type"]),\n                        source_paths=[],\n                        destination_path=str(row["destination_path"] or ""),\n                        status=TaskStatus.failed,\n                        priority=row["priority"] if isinstance(row["priority"], int) else 0,\n                        finished_at=now(),\n                        error_message="Stored transfer state is corrupted",\n                    )\n                    task.append_log("Stored transfer state could not be restored; create a new transfer to retry")\n''',
          )

          rsync_tests = Path("backend/tests/test_rsync_tasks.py")
          text = rsync_tests.read_text(encoding="utf-8")
          if "test_corrupt_persisted_transfer_does_not_break_manager_startup" not in text:
              text += '''\n\ndef test_corrupt_persisted_transfer_does_not_break_manager_startup(monkeypatch, tmp_path: Path):\n    monkeypatch.setattr(FileTaskManager, "_schedule", lambda self: None)\n    manager = FileTaskManager()\n    healthy = manager.create_transfer("alice", "copy", [str(tmp_path / "healthy")], str(tmp_path / "target"))\n    with manager._connect() as conn:\n        conn.execute(\n            "INSERT INTO file_tasks (id,username,type,source_paths,destination_path,status,priority,payload) VALUES (?,?,?,?,?,?,?,?)",\n            ("broken-task", "alice", "copy", "not-json", str(tmp_path / "broken-target"), "queued", 0, "{broken"),\n        )\n\n    loaded = FileTaskManager()\n\n    assert loaded.get("alice", healthy.id) is not None\n    broken = loaded.get("alice", "broken-task")\n    assert broken is not None\n    assert broken.status == TaskStatus.failed\n    assert broken.error_message == "Stored transfer state is corrupted"\n    assert "could not be restored" in "\\n".join(broken.log_tail).lower()\n'''
              rsync_tests.write_text(text, encoding="utf-8")

          # 2. Hosts Manager group hierarchy: reject orphan/cyclic parents and parent deletion.
          replace_once(
              "backend/app/modules/hosts_manager/service.py",
              '''            if connection.execute(\n                "SELECT 1 FROM apmid_environment_groups WHERE group_id=?", (item_id,)\n            ).fetchone():\n                raise ManagedGroupProtectedError("APMID environment groups can be changed only through APMID or environment settings")\n            conflict = connection.execute(\n''',
              '''            if connection.execute(\n                "SELECT 1 FROM apmid_environment_groups WHERE group_id=?", (item_id,)\n            ).fetchone():\n                raise ManagedGroupProtectedError("APMID environment groups can be changed only through APMID or environment settings")\n            if payload.parent_id:\n                if payload.parent_id == item_id:\n                    raise ManagedGroupConflictError("group cannot be its own parent")\n                visited = {item_id}\n                ancestor_id = payload.parent_id\n                while ancestor_id:\n                    if ancestor_id in visited:\n                        raise ManagedGroupConflictError("group hierarchy cannot contain a cycle")\n                    visited.add(ancestor_id)\n                    ancestor = connection.execute("SELECT parent_id FROM groups WHERE id=?", (ancestor_id,)).fetchone()\n                    if ancestor is None:\n                        raise ManagedGroupConflictError("parent group does not exist")\n                    ancestor_id = str(ancestor["parent_id"]) if ancestor["parent_id"] else ""\n            conflict = connection.execute(\n''',
          )
          replace_once(
              "backend/app/modules/hosts_manager/service.py",
              '''            if connection.execute(\n                "SELECT 1 FROM apmid_environment_groups WHERE group_id=?", (group_id,)\n            ).fetchone():\n                raise ManagedGroupProtectedError("APMID environment groups cannot be deleted manually")\n            return bool(connection.execute("DELETE FROM groups WHERE id=?", (group_id,)).rowcount)\n''',
              '''            if connection.execute(\n                "SELECT 1 FROM apmid_environment_groups WHERE group_id=?", (group_id,)\n            ).fetchone():\n                raise ManagedGroupProtectedError("APMID environment groups cannot be deleted manually")\n            if connection.execute("SELECT 1 FROM groups WHERE parent_id=? LIMIT 1", (group_id,)).fetchone():\n                raise ManagedGroupConflictError("group cannot be deleted while it has child groups")\n            return bool(connection.execute("DELETE FROM groups WHERE id=?", (group_id,)).rowcount)\n''',
          )
          replace_once(
              "backend/app/modules/hosts_manager/router.py",
              '''    except ManagedGroupProtectedError as error:\n        api_error(409, "MANAGED_GROUP_PROTECTED", str(error))\n    if removed:\n''',
              '''    except ManagedGroupProtectedError as error:\n        api_error(409, "MANAGED_GROUP_PROTECTED", str(error))\n    except ManagedGroupConflictError as error:\n        api_error(409, "GROUP_IN_USE", str(error))\n    if removed:\n''',
          )

          hosts_tests = Path("backend/tests/test_hosts_manager.py")
          text = hosts_tests.read_text(encoding="utf-8")
          if "test_group_hierarchy_rejects_orphans_cycles_and_parent_deletion" not in text:
              text += '''\n\ndef test_group_hierarchy_rejects_orphans_cycles_and_parent_deletion(tmp_path: Path):\n    store = service(tmp_path)\n    with pytest.raises(ManagedGroupConflictError, match="parent group does not exist"):\n        store.save_group(GroupInput(name="orphan", parent_id="f" * 32), "admin")\n\n    parent = store.save_group(GroupInput(name="parent"), "admin")\n    child = store.save_group(GroupInput(name="child", parent_id=parent["id"]), "admin")\n\n    with pytest.raises(ManagedGroupConflictError, match="own parent"):\n        store.save_group(GroupInput(name="parent", parent_id=parent["id"]), "admin", parent["id"])\n    with pytest.raises(ManagedGroupConflictError, match="cycle"):\n        store.save_group(GroupInput(name="parent", parent_id=child["id"]), "admin", parent["id"])\n    with pytest.raises(ManagedGroupConflictError, match="child groups"):\n        store.delete_group(parent["id"])\n\n    assert store.delete_group(child["id"]) is True\n    assert store.delete_group(parent["id"]) is True\n'''
              hosts_tests.write_text(text, encoding="utf-8")

          # 3. Auto-update: generic exceptions must not leak internal details into API/state.
          replace_once(
              "backend/app/settings.py",
              '''        except Exception as exc:  # noqa: BLE001\n            state.update({"last_error": str(exc), "next_check": now + 3600})\n            _write_auto_update_state(state)\n            if force:\n                raise HTTPException(500, str(exc)) from exc\n            return {"ok": False, "error": str(exc)}\n''',
              '''        except Exception as exc:  # noqa: BLE001\n            public_error = "Update operation failed"\n            logger.warning("Auto-update failed for actor %s: %s", actor, type(exc).__name__)\n            state.update({"last_error": public_error, "next_check": now + 3600})\n            _write_auto_update_state(state)\n            if force:\n                raise HTTPException(500, public_error) from exc\n            return {"ok": False, "error": public_error}\n''',
          )

          settings_tests = Path("backend/tests/test_user_settings.py")
          text = settings_tests.read_text(encoding="utf-8")
          if "test_unexpected_auto_update_error_is_sanitized" not in text:
              text += '''\n\ndef test_unexpected_auto_update_error_is_sanitized(monkeypatch):\n    written = []\n    state = settings._default_auto_update_state()\n    monkeypatch.setattr(settings, "read_update_request", lambda: {})\n    monkeypatch.setattr(settings, "_read_auto_update_state", lambda: dict(state))\n    monkeypatch.setattr(settings, "_write_auto_update_state", lambda value: written.append(dict(value)) or value)\n\n    def fail_status():\n        raise RuntimeError("secret token=abc123 path=/srv/private")\n\n    monkeypatch.setattr(settings, "_update_status", fail_status)\n\n    result = settings._run_auto_update_once(actor="alice")\n    assert result == {"ok": False, "error": "Update operation failed"}\n    assert written[-1]["last_error"] == "Update operation failed"\n    assert "abc123" not in json.dumps(written)\n    assert "/srv/private" not in json.dumps(written)\n\n    with pytest.raises(settings.HTTPException) as exc:\n        settings._run_auto_update_once(actor="alice", force=True)\n    assert exc.value.status_code == 500\n    assert exc.value.detail == "Update operation failed"\n'''
              settings_tests.write_text(text, encoding="utf-8")

          # 4. Image Converter: preserve access to lower controls in a resized desktop window.
          replace_once(
              "frontend/src/styles/windows.css",
              '.desktop .window-content { min-width: 0; min-height: 0; container: app-window / inline-size; }\n',
              '''.desktop .window-content { min-width: 0; min-height: 0; container: app-window / inline-size; }\n.desktop .window-content > .image-converter-app {\n  height: 100%;\n  min-height: 0;\n  box-sizing: border-box;\n  overflow-x: hidden;\n  overflow-y: auto;\n  overscroll-behavior: contain;\n  align-content: start;\n}\n''',
          )
          replace_once(
              "frontend/src/styles/visual-regressions.test.js",
              'const compatCss = readFileSync(resolve(cwd(), "src/styles/legacy-window-compat.css"), "utf8");\n',
              'const compatCss = readFileSync(resolve(cwd(), "src/styles/legacy-window-compat.css"), "utf8");\nconst windowsCss = readFileSync(resolve(cwd(), "src/styles/windows.css"), "utf8");\n',
          )
          replace_once(
              "frontend/src/styles/visual-regressions.test.js",
              '''  it("lets the Playwright configuration control CI reporters", () => {\n''',
              '''  it("keeps the image converter scrollable inside a resized desktop window", () => {\n    expect(windowsCss).toContain(".desktop .window-content > .image-converter-app {");\n    expect(windowsCss).toContain("height: 100%");\n    expect(windowsCss).toContain("min-height: 0");\n    expect(windowsCss).toContain("overflow-y: auto");\n    expect(windowsCss).toContain("overflow-x: hidden");\n    expect(windowsCss).toContain("overscroll-behavior: contain");\n  });\n\n  it("lets the Playwright configuration control CI reporters", () => {\n''',
          )

          Path(".github/workflows/runtime-integrity-audit-repair.yml").unlink()
          PY
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden runtime state integrity and UI overflow"
          git push origin HEAD:fix/runtime-integrity-audit-2
