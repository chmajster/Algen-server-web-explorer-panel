name: Secure local bootstrap patch

on:
  push:
    branches:
      - feat/ldap-authentication

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ldap-authentication
          fetch-depth: 0
      - name: Replace plaintext bootstrap storage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch context not found in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = "backend/app/local_auth.py"
          replace_once(
              path,
              "from .config import get_config\nfrom .privileged_broker.runtime import broker_command, broker_required\n",
              "from .audit import logger\nfrom .config import get_config\nfrom .modules.secrets_manager.models import SecretInput\nfrom .modules.secrets_manager.service import service as secrets_service\nfrom .privileged_broker.runtime import broker_command, broker_required\n",
          )
          replace_once(
              path,
              "SCRYPT_DKLEN = 32\n",
              "SCRYPT_DKLEN = 32\nLOCAL_BOOTSTRAP_SECRET_PREFIX = \"__webnas_initial_local_admin__\"\nLOCAL_BOOTSTRAP_SECRET_MODULE = \"authentication-bootstrap\"\n",
          )
          replace_once(
              path,
              "        self.homes_root = root / \"local-homes\"\n        self.bootstrap_path = self.path.parent / \"initial-local-admin.txt\"\n        self._lock = threading.RLock()\n        self._initialize()\n        self._ensure_initial_admin()\n",
              "        self.homes_root = root / \"local-homes\"\n        self._lock = threading.RLock()\n        self._initialize()\n        if self.auth_mode() == \"local\":\n            self._ensure_initial_admin()\n",
          )
          replace_once(
              path,
              "                    auth_mode TEXT NOT NULL DEFAULT 'local',\n                    updated_at REAL NOT NULL DEFAULT 0,\n",
              "                    auth_mode TEXT NOT NULL DEFAULT 'local',\n                    bootstrap_secret_id TEXT NOT NULL DEFAULT '',\n                    updated_at REAL NOT NULL DEFAULT 0,\n",
          )
          replace_once(
              path,
              "                \"\"\"\n            )\n        self.homes_root.mkdir(parents=True, exist_ok=True)\n",
              "                \"\"\"\n            )\n            columns = {str(row[1]) for row in connection.execute(\"PRAGMA table_info(local_auth_settings)\").fetchall()}\n            if \"bootstrap_secret_id\" not in columns:\n                connection.execute(\"ALTER TABLE local_auth_settings ADD COLUMN bootstrap_secret_id TEXT NOT NULL DEFAULT ''\")\n        self.homes_root.mkdir(parents=True, exist_ok=True)\n",
          )
          old_bootstrap = '''    def _ensure_initial_admin(self) -> None:\n        with self._lock:\n            if self.count() > 0:\n                return\n            password = secrets.token_urlsafe(24)\n            self.create_user(\n                \"admin\",\n                password,\n                role=\"admin\",\n                display_name=\"WebNAS Administrator\",\n            )\n            self.bootstrap_path.write_text(\n                \"WebNAS initial local administrator\\n\"\n                \"Username: admin\\n\"\n                f\"Password: {password}\\n\"\n                \"This file is removed after the first successful local login.\\n\",\n                encoding=\"utf-8\",\n            )\n            try:\n                os.chmod(self.bootstrap_path, 0o600)\n            except OSError:\n                pass\n\n    def _consume_bootstrap_file(self, username: str) -> None:\n        if username.casefold() != \"admin\" or not self.bootstrap_path.exists():\n            return\n        try:\n            self.bootstrap_path.unlink()\n        except OSError:\n            pass\n\n'''
          new_bootstrap = '''    def _bootstrap_secret_id(self) -> str:\n        with self.connect() as connection:\n            row = connection.execute(\n                \"SELECT bootstrap_secret_id FROM local_auth_settings WHERE id=1\"\n            ).fetchone()\n        return str(row[\"bootstrap_secret_id\"] or \"\") if row else \"\"\n\n    def _set_bootstrap_secret_id(self, secret_id: str) -> None:\n        with self.connect() as connection:\n            connection.execute(\n                \"UPDATE local_auth_settings SET bootstrap_secret_id=? WHERE id=1\",\n                (secret_id,),\n            )\n\n    @staticmethod\n    def _bootstrap_password(secret_id: str) -> str:\n        item = secrets_service().verified_secret(\n            secret_id,\n            module_id=LOCAL_BOOTSTRAP_SECRET_MODULE,\n            purpose=\"initial-local-admin\",\n        )\n        password = str(item.get(\"secret\") or \"\")\n        if not password:\n            raise LocalAuthConfigurationError(\"Initial local administrator credential is unavailable\")\n        return password\n\n    def _ensure_initial_admin(self) -> None:\n        with self._lock:\n            if self.count() > 0:\n                return\n            secret_id = self._bootstrap_secret_id()\n            if secret_id:\n                password = self._bootstrap_password(secret_id)\n            else:\n                password = secrets.token_urlsafe(24)\n                stored = secrets_service().save(\n                    SecretInput(\n                        name=f\"{LOCAL_BOOTSTRAP_SECRET_PREFIX}-{secrets.token_hex(8)}\",\n                        type=\"generic_secret\",\n                        secret=password,\n                        description=\"One-time WebNAS local administrator bootstrap credential\",\n                        shared_with=[LOCAL_BOOTSTRAP_SECRET_MODULE],\n                    ),\n                    \"local-auth-bootstrap\",\n                )\n                secret_id = str(stored[\"id\"])\n                self._set_bootstrap_secret_id(secret_id)\n            self.create_user(\n                \"admin\",\n                password,\n                role=\"admin\",\n                display_name=\"WebNAS Administrator\",\n            )\n\n    def consume_bootstrap_credential(self) -> dict[str, str] | None:\n        secret_id = self._bootstrap_secret_id()\n        if not secret_id:\n            return None\n        password = self._bootstrap_password(secret_id)\n        credentials = {\"username\": \"admin\", \"password\": password}\n        secrets_service().delete(secret_id, \"local-auth-installer\")\n        self._set_bootstrap_secret_id(\"\")\n        return credentials\n\n    def _consume_bootstrap_secret(self, username: str) -> None:\n        if username.casefold() != \"admin\":\n            return\n        secret_id = self._bootstrap_secret_id()\n        if not secret_id:\n            return\n        try:\n            secrets_service().delete(secret_id, \"local-auth-login\")\n            self._set_bootstrap_secret_id(\"\")\n        except Exception as error:\n            logger.warning(\"local_bootstrap_secret_cleanup_failed error=%s\", type(error).__name__)\n\n'''
          replace_once(path, old_bootstrap, new_bootstrap)
          replace_once(path, "        self._consume_bootstrap_file(username)\n", "        self._consume_bootstrap_secret(username)\n")
          replace_once(path, "            self._consume_bootstrap_file(username)\n", "            self._consume_bootstrap_secret(username)\n")
          replace_once(
              path,
              "def local_posix_mapping(username: str) -> dict[str, Any] | None:\n    return _posix_mapping(username)\n",
              "def local_posix_mapping(username: str) -> dict[str, Any] | None:\n    return _posix_mapping(username)\n\n\ndef consume_initial_admin_credentials() -> dict[str, str] | None:\n    return repository().consume_bootstrap_credential()\n",
          )

          helper = Path("scripts/consume_local_bootstrap.py")
          helper.write_text('''#!/usr/bin/env python3\nfrom __future__ import annotations\n\nfrom app.local_auth import consume_initial_admin_credentials\n\n\ndef main() -> int:\n    credentials = consume_initial_admin_credentials()\n    if not credentials:\n        return 0\n    print(\"Initial local administrator credentials:\")\n    print(f\"Username: {credentials['username']}\")\n    print(f\"Password: {credentials['password']}\")\n    print(\"IMPORTANT: this password is displayed once and is not stored in plaintext.\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n''', encoding="utf-8")

          path = "install-standard.sh"
          replace_once(
              path,
              "  info \"Panel login uses local Linux users authenticated through PAM service '${SERVICE_NAME}'\"\n",
              "  info \"PAM service '${SERVICE_NAME}' is available when System authentication mode is enabled\"\n",
          )
          insert = '''\nprint_initial_local_admin() {\n  section \"Authentication\"\n  local scheme=\"\"\n  local helper=\"${INSTALL_DIR}/current/scripts/consume_local_bootstrap.py\"\n  local python=\"${INSTALL_DIR}/current/backend/.venv/bin/python\"\n  local curl_options=(--fail --silent --show-error --max-time 5)\n  scheme=\"$(effective_transport_scheme)\"\n  [[ \"$scheme\" != \"https\" ]] || curl_options+=(--insecure)\n  curl \"${curl_options[@]}\" \"${scheme}://127.0.0.1:${PORT}/api/auth/config\" >/dev/null \\\n    || fail \"Could not initialize the authentication subsystem\"\n  [[ -x \"$python\" && -f \"$helper\" ]] || fail \"Local administrator bootstrap helper is unavailable\"\n  if command -v runuser >/dev/null 2>&1; then\n    runuser -u \"$SERVICE_USER\" -- env \\\n      WEBNAS_CONFIG=\"$CONFIG_FILE\" \\\n      PYTHONPATH=\"${INSTALL_DIR}/current/backend\" \\\n      \"$python\" \"$helper\"\n  else\n    fail \"runuser is required to retrieve the one-time local administrator credential safely\"\n  fi\n  info \"Default authentication mode: Local database. PAM and optional LDAP can be enabled later in Settings -> Administration -> Authentication.\"\n}\n\n'''
          replace_once(path, "main() {\n", insert + "main() {\n")
          replace_once(
              path,
              "  validate_release_installation\n  INSTALL_COMPLETED=\"yes\"\n  print_finish\n",
              "  validate_release_installation\n  print_initial_local_admin\n  INSTALL_COMPLETED=\"yes\"\n  print_finish\n",
          )

          path = "install-portable.sh"
          replace_once(
              path,
              "  health_check\n  rm -f -- \"${WORK_DIR}/runtime/data/initial-local-admin.txt\"\n",
              "  health_check\n",
          )
          PY
      - name: Commit secure bootstrap implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/local_auth.py scripts/consume_local_bootstrap.py install-standard.sh install-portable.sh
          git commit -m 'fix(auth): keep bootstrap password out of plaintext storage'
          git push origin HEAD:feat/ldap-authentication
