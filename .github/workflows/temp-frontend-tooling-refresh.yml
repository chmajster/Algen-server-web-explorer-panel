name: Temporary frontend tooling refresh

on:
  push:
    branches:
      - deps/frontend-tooling-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deps/frontend-tooling-refresh
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Align frontend development dependencies
        working-directory: frontend
        run: >-
          npm install --save-dev --save-exact
          @types/react@19.2.18
          @types/react-dom@19.2.7
          @eslint/js@10.0.1
          @testing-library/jest-dom@7.0.1
          @typescript-eslint/eslint-plugin@8.69.0
          @typescript-eslint/parser@8.69.0
      - name: Commit refreshed dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps-dev): refresh frontend tooling dependencies"
          git push origin HEAD:deps/frontend-tooling-refresh
