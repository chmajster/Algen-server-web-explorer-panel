name: Temporary React 19 types refresh

on:
  push:
    branches:
      - deps/react19-types

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: deps/react19-types
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh React type dependencies
        working-directory: frontend
        run: npm install --save-dev --save-exact @types/react@19.2.18 @types/react-dom@19.2.7
      - name: Commit refreshed dependency files
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "chore(deps-dev): align React 19 type definitions"
          git push origin HEAD:deps/react19-types
