name: Temporary Bandit fix

on:
  push:
    branches:
      - feature/infrastructure-managers
    paths:
      - .github/workflows/tmp-bandit-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/infrastructure-managers
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Apply explicit exception logging
        run: |
          python - <<'PY'
          from pathlib import Path

          login = Path('backend/app/modules/login_history/service.py')
          text = login.read_text()
          text = text.replace('import json\n', 'import json\nimport logging\n', 1)
          text = text.replace('from ...privileged_broker.runtime import broker_required\n\n', 'from ...privileged_broker.runtime import broker_required\n\n\nlogger = logging.getLogger(__name__)\n\n', 1)
          old = '''            except Exception:\n                pass\n        return findings\n'''
          new = '''            except Exception:\n                logger.exception("Failed to emit login security alert", extra={"alert_key": key})\n        return findings\n'''
          if old not in text:
              raise SystemExit('Expected login_history exception block not found')
          login.write_text(text.replace(old, new, 1))

          routing = Path('backend/app/modules/routing_manager/service.py')
          text = routing.read_text()
          text = text.replace('import json\n', 'import json\nimport logging\n', 1)
          text = text.replace('from .models import PolicyRuleInput, RouteInput\n\n', 'from .models import PolicyRuleInput, RouteInput\n\n\nlogger = logging.getLogger(__name__)\n\n', 1)
          old_restore = '''            try:\n                self._restore_persistent(persistent, actor=actor)\n            except Exception:\n                pass\n            raise\n'''
          new_restore = '''            try:\n                self._restore_persistent(persistent, actor=actor)\n            except Exception:\n                logger.exception("Failed to restore persistent routing state after apply failure")\n            raise\n'''
          if old_restore not in text:
              raise SystemExit('Expected routing restore exception block not found')
          text = text.replace(old_restore, new_restore, 1)
          old_reconcile = '''                try:\n                    self.rollback(str(transaction["id"]), automatic=True)\n                except Exception:\n                    pass\n'''
          new_reconcile = '''                try:\n                    self.rollback(str(transaction["id"]), automatic=True)\n                except Exception:\n                    logger.exception(\n                        "Failed to reconcile expired routing transaction",\n                        extra={"transaction_id": str(transaction.get("id") or "")},\n                    )\n'''
          if old_reconcile not in text:
              raise SystemExit('Expected routing reconcile exception block not found')
          routing.write_text(text.replace(old_reconcile, new_reconcile, 1))
          PY
      - name: Format targeted files
        run: python -m ruff format backend/app/modules/login_history/service.py backend/app/modules/routing_manager/service.py
      - name: Validate backend quality gates
        run: |
          python -m ruff check backend scripts/export_openapi.py scripts/rollback_release.py
          python -m ruff format --check backend scripts/export_openapi.py scripts/rollback_release.py
          python -m mypy
          python -m bandit -c pyproject.toml -r backend/app
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/login_history/service.py backend/app/modules/routing_manager/service.py
          git commit -m "fix: log infrastructure recovery failures"
          git push origin HEAD:feature/infrastructure-managers
