name: Temporary Hosts Manager credential diagnostics patch

on:
  push:
    branches:
      - fix/proxmox-informative-errors
    paths:
      - .github/workflows/tmp-fix-hosts-credential-errors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/proxmox-informative-errors
          fetch-depth: 0

      - name: Patch credential error handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/modules/hosts_manager/router.py")
          text = path.read_text()

          old = "import json\nimport os"
          new = "import json\nimport logging\nimport os"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = 'router = APIRouter(prefix="/api/modules/hosts-manager", tags=["hosts-manager"])\n'
          new = 'logger = logging.getLogger(__name__)\nrouter = APIRouter(prefix="/api/modules/hosts-manager", tags=["hosts-manager"])\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          marker = '''@router.get("/credentials")
          def credentials(user: SessionUser = Depends(require_permission(Permission.HOSTS_MANAGER_CREDENTIALS_VIEW))):
          '''
          assert text.count(marker) == 1
          helper = '''def _credential_failure(error: Exception, *, operation: str) -> None:
              if isinstance(error, sqlite3.Error):
                  hint = "Check the Hosts Manager SQLite database, free disk space, and write permissions for the WebNAS data directory."
              elif isinstance(error, OSError):
                  hint = "Check ownership and permissions of the WebNAS data directory and the Hosts Manager credential encryption key."
              else:
                  hint = "Check the Hosts Manager credential encryption key, WebNAS data-directory permissions, and backend logs for the matching traceback."
              logger.exception("Hosts Manager credential %s failed", operation)
              api_error(
                  500,
                  "CREDENTIAL_STORAGE_ERROR",
                  "Hosts Manager could not securely save the credential.",
                  stage="credential_storage",
                  component="hosts-manager",
                  operation=operation,
                  reason=type(error).__name__,
                  hint=hint,
              )


'''
          text = text.replace(marker, helper + marker, 1)

          old = '''@router.post("/credentials")
          def create_credential(payload: CredentialInput, user: SessionUser = Depends(require_permission(Permission.HOSTS_MANAGER_CREDENTIALS_MANAGE))):
              item = _service().save_credential(payload, user.username)
              _activity(user.username, "credential_create", item["id"], {"type": item["type"]})
              return item
          '''
          new = '''@router.post("/credentials")
          def create_credential(payload: CredentialInput, user: SessionUser = Depends(require_permission(Permission.HOSTS_MANAGER_CREDENTIALS_MANAGE))):
              try:
                  item = _service().save_credential(payload, user.username)
              except Exception as error:
                  _credential_failure(error, operation="create")
              _activity(user.username, "credential_create", item["id"], {"type": item["type"]})
              return item
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''@router.put("/credentials/{credential_id}")
          def update_credential(credential_id: str, payload: CredentialInput, user: SessionUser = Depends(require_permission(Permission.HOSTS_MANAGER_CREDENTIALS_MANAGE))):
              item = _service().save_credential(payload, user.username, credential_id)
              _activity(user.username, "credential_update", credential_id, {"type": item["type"]})
              return item
          '''
          new = '''@router.put("/credentials/{credential_id}")
          def update_credential(credential_id: str, payload: CredentialInput, user: SessionUser = Depends(require_permission(Permission.HOSTS_MANAGER_CREDENTIALS_MANAGE))):
              try:
                  item = _service().save_credential(payload, user.username, credential_id)
              except Exception as error:
                  _credential_failure(error, operation="update")
              _activity(user.username, "credential_update", credential_id, {"type": item["type"]})
              return item
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          python -m compileall -q backend/app/modules/hosts_manager/router.py

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-hosts-credential-errors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/modules/hosts_manager/router.py .github/workflows/tmp-fix-hosts-credential-errors.yml
          git commit -m "fix: return diagnostic credential storage errors"
          git push origin HEAD:fix/proxmox-informative-errors
