name: Temporary mypy fix

on:
  push:
    branches:
      - feature/infrastructure-managers
    paths:
      - .github/workflows/tmp-mypy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/infrastructure-managers
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Apply targeted typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          repository = Path('backend/app/jobs/repository.py')
          text = repository.read_text()
          if 'import builtins\n' not in text:
              text = text.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nimport builtins\n', 1)
          text = text.replace('list[', 'builtins.list[')
          repository.write_text(text)

          ntp = Path('backend/app/modules/ntp_manager/service.py')
          text = ntp.read_text()
          old = '''        items: list[dict[str, Any]] = []\n        if backend == NtpBackend.timesyncd:\n            for line in text.splitlines():\n                stripped = line.strip()\n                if stripped.startswith("NTP=") or stripped.startswith("FallbackNTP="):\n                    key, values = stripped.split("=", 1)\n                    for server in values.split():\n                        items.append({"server": server, "selected": False, "state": "configured", "kind": key})\n        else:\n            for line in text.splitlines():\n                match = _SERVER_RE.match(line.strip().lstrip("#").strip())\n                if match:\n                    items.append({"server": match.group(1), "selected": False, "state": "configured", "enabled": not line.lstrip().startswith("#")})\n        return items\n'''
          new = '''        configured_items: list[dict[str, Any]] = []\n        if backend == NtpBackend.timesyncd:\n            for line in text.splitlines():\n                stripped = line.strip()\n                if stripped.startswith("NTP=") or stripped.startswith("FallbackNTP="):\n                    key, values = stripped.split("=", 1)\n                    for server in values.split():\n                        configured_items.append({"server": server, "selected": False, "state": "configured", "kind": key})\n        else:\n            for line in text.splitlines():\n                match = _SERVER_RE.match(line.strip().lstrip("#").strip())\n                if match:\n                    configured_items.append({"server": match.group(1), "selected": False, "state": "configured", "enabled": not line.lstrip().startswith("#")})\n        return configured_items\n'''
          if old not in text:
              raise SystemExit('Expected NTP block not found')
          ntp.write_text(text.replace(old, new, 1))
          PY
      - name: Validate backend typing and lint
        run: |
          python -m ruff check backend scripts/export_openapi.py scripts/rollback_release.py
          python -m mypy
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/jobs/repository.py backend/app/modules/ntp_manager/service.py
          git commit -m "fix: satisfy infrastructure manager typing checks"
          git push origin HEAD:feature/infrastructure-managers
