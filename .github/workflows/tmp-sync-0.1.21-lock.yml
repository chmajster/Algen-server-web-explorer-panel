name: Temporary 0.1.21 lockfile sync

on:
  push:

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/fix/proxmox-informative-errors'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/proxmox-informative-errors
          fetch-depth: 0

      - name: Sync package-lock version
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('frontend/package-lock.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['version'] = '0.1.21'
          payload['packages']['']['version'] = '0.1.21'
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit final metadata and remove helper
        shell: bash
        run: |
          rm .github/workflows/tmp-sync-0.1.21-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/tmp-sync-0.1.21-lock.yml
          git commit -m "chore: finish WebNAS 0.1.21 metadata"
          git push origin HEAD:fix/proxmox-informative-errors
