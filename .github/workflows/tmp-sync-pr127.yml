name: Sync PR 127 with main

on:
  push:
    branches:
      - feature/infrastructure-managers
    paths:
      - .github/workflows/tmp-sync-pr127.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/infrastructure-managers
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          cd frontend
          npm ci
      - name: Merge main and resolve known conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          if [[ "$merge_rc" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'Conflicts:\n%s\n' "${conflicts[*]}"
            expected=(
              "backend/app/privileged_broker/protocol.py"
              "backend/app/privileged_broker/server.py"
              "frontend/src/generated/api-types.ts"
            )
            mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
            if [[ "${conflicts[*]}" != "${expected_sorted[*]}" ]]; then
              echo "Unexpected merge conflict set"
              exit 1
            fi

            git checkout --ours backend/app/privileged_broker/protocol.py
            git checkout --ours backend/app/privileged_broker/server.py
            git checkout --theirs frontend/src/generated/api-types.ts

            python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/privileged_broker/protocol.py")
          text = path.read_text(encoding="utf-8")
          if 'FIREWALL = "firewall"' not in text:
              anchor = '    STORAGE_PROBE = "storage_probe"\n'
              if anchor not in text:
                  raise SystemExit("protocol operation anchor missing")
              text = text.replace(anchor, anchor + '    FIREWALL = "firewall"\n', 1)
          required = {
              'FIREWALL = "firewall"',
              'NTP = "ntp"',
              'ROUTING = "routing"',
              'SESSION = "session"',
          }
          missing = sorted(item for item in required if item not in text)
          if missing:
              raise SystemExit(f"missing broker operations: {missing}")
          path.write_text(text, encoding="utf-8")
          PY

            git add backend/app/privileged_broker/protocol.py
            git add backend/app/privileged_broker/server.py
            git add frontend/src/generated/api-types.ts
          fi

          rm -f .github/workflows/tmp-bandit-fix.yml
          git add -A
      - name: Regenerate API contract
        working-directory: frontend
        run: npm run api:generate
      - name: Validate merged code
        run: |
          python -m ruff format backend/app/privileged_broker/protocol.py backend/app/privileged_broker/server.py backend/app/modules/ntp_manager/router.py backend/app/modules/routing_manager/router.py
          python -m ruff check backend scripts/export_openapi.py scripts/rollback_release.py
          python -m mypy
          python -m bandit -c pyproject.toml -r backend/app
          python -m pytest -q backend/tests/test_infrastructure_managers.py backend/tests/test_privileged_broker_final_boundary.py
          cd frontend
          npm run typecheck
          npm run api:check
      - name: Commit and push synchronized branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git status --short
          git commit -m "Merge main into feature/infrastructure-managers"
          git push origin HEAD:feature/infrastructure-managers
