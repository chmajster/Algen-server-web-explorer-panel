name: Trusted homelab jobs

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected main revision after trusted checks
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: trusted-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trusted-integration:
    name: Trusted integration checks
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
    timeout-minutes: 35

    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify merged main revision
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3.14 scripts/sync-version.py --check

      - name: Prepare isolated trusted test environment
        shell: bash
        run: |
          set -euo pipefail
          python3.14 -m venv .trusted-venv
          .trusted-venv/bin/pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Run trusted Linux, PAM and systemd tests
        run: .trusted-venv/bin/python -m pytest -ra -m system

      - name: Run release deployment regression tests
        run: .trusted-venv/bin/python -m pytest -q backend/tests/test_release_deployment.py backend/tests/test_installer.py

  production-deployment:
    name: Production blue-green deployment
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    needs:
      - trusted-integration
    runs-on:
      - self-hosted
      - linux
      - deploy
    environment: production
    timeout-minutes: 45
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Check out approved main revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify deployment provenance
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3.14 scripts/sync-version.py --check

      - name: Deploy candidate through existing blue-green release mechanism
        shell: bash
        env:
          WEBNAS_ROOT: ${{ vars.WEBNAS_ROOT || '/opt/webnas' }}
          WEBNAS_CONFIG: ${{ vars.WEBNAS_CONFIG || '/etc/webnas/config.yaml' }}
          WEBNAS_SERVICE_USER: ${{ vars.WEBNAS_SERVICE_USER || 'webnas' }}
        run: |
          set -euo pipefail
          sudo --preserve-env=WEBNAS_ROOT,WEBNAS_CONFIG,WEBNAS_SERVICE_USER \
            ./scripts/deploy_from_checkout.sh "${GITHUB_WORKSPACE}" "${GITHUB_SHA}"

      - name: Record deployed revision
        run: printf 'Deployed trusted main revision %s\n' "${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
