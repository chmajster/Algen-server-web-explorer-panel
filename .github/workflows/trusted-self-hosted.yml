name: Trusted homelab jobs

on:
  workflow_run:
    workflows:
      - Automated tests
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected main revision after trusted checks
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: trusted-main-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  trusted-integration:
    name: Trusted integration checks
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - linux
    timeout-minutes: 35

    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify tested main revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main
          python3.14 scripts/sync-version.py --check

      - name: Require successful hosted CI before manual production deployment
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3.14 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          query = urllib.parse.urlencode(
              {
                  "branch": "main",
                  "event": "push",
                  "head_sha": target_sha,
                  "status": "success",
                  "per_page": 100,
              }
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs?{query}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          matching_runs = [
              run
              for run in payload.get("workflow_runs", [])
              if run.get("head_sha") == target_sha
              and run.get("head_branch") == "main"
              and run.get("event") == "push"
              and run.get("conclusion") == "success"
          ]
          if not matching_runs:
              raise SystemExit(
                  f"Refusing manual production deployment: no successful Automated tests push run for main commit {target_sha}."
              )
          print(f"Verified successful Automated tests run for {target_sha}.")
          PY

      - name: Prepare isolated trusted test environment
        shell: bash
        run: |
          set -euo pipefail
          python3.14 -m venv .trusted-venv
          .trusted-venv/bin/pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Run trusted Linux, PAM and systemd tests
        run: .trusted-venv/bin/python -m pytest -ra -m system

      - name: Run release deployment regression tests
        run: .trusted-venv/bin/python -m pytest -q backend/tests/test_release_deployment.py backend/tests/test_installer.py

  production-deployment:
    name: Production blue-green deployment
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    needs:
      - trusted-integration
    runs-on:
      - self-hosted
      - linux
      - deploy
    environment: production
    timeout-minutes: 45
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Check out approved main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify deployment provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main
          python3.14 scripts/sync-version.py --check

      - name: Deploy candidate through existing blue-green release mechanism
        shell: bash
        env:
          WEBNAS_ROOT: ${{ vars.WEBNAS_ROOT || '/opt/webnas' }}
          WEBNAS_CONFIG: ${{ vars.WEBNAS_CONFIG || '/etc/webnas/config.yaml' }}
          WEBNAS_SERVICE_USER: ${{ vars.WEBNAS_SERVICE_USER || 'webnas' }}
        run: |
          set -euo pipefail
          sudo --preserve-env=WEBNAS_ROOT,WEBNAS_CONFIG,WEBNAS_SERVICE_USER \
            ./scripts/deploy_from_checkout.sh "${GITHUB_WORKSPACE}" "${TARGET_SHA}"

      - name: Record deployed revision
        run: printf 'Deployed trusted main revision %s\n' "${TARGET_SHA}" >> "${GITHUB_STEP_SUMMARY}"
