name: Trusted homelab jobs

on:
  workflow_run:
    workflows:
      - Automated tests
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected main revision after trusted checks
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: trusted-main-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  trusted-integration:
    name: Trusted integration checks
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on:
      - self-hosted
      - linux
    timeout-minutes: 35
    outputs:
      ci_run_id: ${{ steps.resolve-ci-run.outputs.run_id }}

    steps:
      - name: Check out trusted main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Set up Node.js for installer validation
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify tested main revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main
          python3.14 scripts/sync-version.py --check

      - name: Resolve successful hosted CI artifact provenance
        id: resolve-ci-run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_REQUESTED: ${{ inputs.deploy }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            [[ "${WORKFLOW_RUN_ID}" =~ ^[0-9]+$ ]] || {
              echo "Workflow-run event is missing its source run id." >&2
              exit 1
            }
            printf 'run_id=%s\n' "${WORKFLOW_RUN_ID}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${DEPLOY_REQUESTED:-false}" != "true" ]]; then
            printf 'run_id=\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          python3.14 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          query = urllib.parse.urlencode(
              {
                  "branch": "main",
                  "event": "push",
                  "head_sha": target_sha,
                  "status": "success",
                  "per_page": 100,
              }
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs?{query}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          matching_runs = [
              run
              for run in payload.get("workflow_runs", [])
              if run.get("head_sha") == target_sha
              and run.get("head_branch") == "main"
              and run.get("event") == "push"
              and run.get("conclusion") == "success"
              and isinstance(run.get("id"), int)
          ]
          if not matching_runs:
              raise SystemExit(
                  f"Refusing manual production deployment: no successful Automated tests push run for main commit {target_sha}."
              )
          run_id = matching_runs[0]["id"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"run_id={run_id}\n")
          print(f"Verified successful Automated tests run {run_id} for {target_sha}.")
          PY

      - name: Prepare isolated trusted test environment
        shell: bash
        run: |
          set -euo pipefail
          python3.14 -m venv .trusted-venv
          .trusted-venv/bin/pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Run trusted Linux, PAM and systemd tests
        run: .trusted-venv/bin/python -m pytest -ra -m system

      - name: Run release deployment regression tests
        run: .trusted-venv/bin/python -m pytest -q backend/tests/test_release_deployment.py backend/tests/test_installer.py

  production-deployment:
    name: Production blue-green deployment
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    needs:
      - trusted-integration
    runs-on:
      - self-hosted
      - linux
      - deploy
    environment: production
    timeout-minutes: 45
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Check out approved main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Set up Node.js for frontend artifact validation
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify deployment provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main
          python3.14 scripts/sync-version.py --check
          [[ "${{ needs.trusted-integration.outputs.ci_run_id }}" =~ ^[0-9]+$ ]]

      - name: Download tested frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: .trusted-artifacts/frontend-dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.trusted-integration.outputs.ci_run_id }}

      - name: Download tested Python wheelhouse
        uses: actions/download-artifact@v8
        with:
          name: python-wheelhouse
          path: .trusted-artifacts/python-wheelhouse
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.trusted-integration.outputs.ci_run_id }}

      - name: Verify tested frontend artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/.trusted-artifacts/frontend-dist"
          test -f "${artifact}/index.html"
          test -f "${artifact}/.webnas-assets.json"
          test -f "${artifact}/.webnas-source-sha"
          test "$(tr -d '\r\n' < "${artifact}/.webnas-source-sha")" = "${TARGET_SHA}"
          python3.14 scripts/verify_frontend_build.py "${artifact}"
          manifest_sha="$(sha256sum "${artifact}/.webnas-assets.json" | awk '{print $1}')"
          printf 'FRONTEND_ARTIFACT_MANIFEST_SHA256=%s\n' "${manifest_sha}" >> "${GITHUB_ENV}"
          printf 'Verified frontend artifact from CI run %s with manifest SHA-256 %s\n' \
            "${{ needs.trusted-integration.outputs.ci_run_id }}" "${manifest_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify tested Python wheelhouse provenance
        shell: bash
        run: |
          set -euo pipefail
          artifact="${GITHUB_WORKSPACE}/.trusted-artifacts/python-wheelhouse"
          test -f "${artifact}/.webnas-source-sha"
          test -f "${artifact}/.webnas-wheelhouse.sha256"
          test "$(tr -d '\r\n' < "${artifact}/.webnas-source-sha")" = "${TARGET_SHA}"
          (
            cd "${artifact}"
            sha256sum --check .webnas-wheelhouse.sha256
          )
          manifest_sha="$(sha256sum "${artifact}/.webnas-wheelhouse.sha256" | awk '{print $1}')"
          printf 'PYTHON_WHEELHOUSE_MANIFEST_SHA256=%s\n' "${manifest_sha}" >> "${GITHUB_ENV}"
          printf 'Verified Python wheelhouse from CI run %s with manifest SHA-256 %s\n' \
            "${{ needs.trusted-integration.outputs.ci_run_id }}" "${manifest_sha}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Deploy candidate through existing blue-green release mechanism
        shell: bash
        env:
          WEBNAS_ROOT: ${{ vars.WEBNAS_ROOT || '/opt/webnas' }}
          WEBNAS_CONFIG: ${{ vars.WEBNAS_CONFIG || '/etc/webnas/config.yaml' }}
          WEBNAS_SERVICE_USER: ${{ vars.WEBNAS_SERVICE_USER || 'webnas' }}
        run: |
          set -euo pipefail
          sudo --preserve-env=WEBNAS_ROOT,WEBNAS_CONFIG,WEBNAS_SERVICE_USER \
            ./scripts/deploy_from_checkout.sh \
            "${GITHUB_WORKSPACE}" \
            "${TARGET_SHA}" \
            "${GITHUB_WORKSPACE}/.trusted-artifacts/frontend-dist" \
            "${GITHUB_WORKSPACE}/.trusted-artifacts/python-wheelhouse"

      - name: Record deployed revision
        run: |
          printf 'Deployed trusted main revision %s using hosted CI run %s, frontend manifest %s and Python wheelhouse manifest %s\n' \
            "${TARGET_SHA}" \
            "${{ needs.trusted-integration.outputs.ci_run_id }}" \
            "${FRONTEND_ARTIFACT_MANIFEST_SHA256}" \
            "${PYTHON_WHEELHOUSE_MANIFEST_SHA256}" >> "${GITHUB_STEP_SUMMARY}"
