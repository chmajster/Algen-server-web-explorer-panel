name: Trusted homelab jobs

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Run the production deployment gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  trusted-integration:
    name: Trusted integration checks
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
    concurrency:
      group: trusted-integration-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 30

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Verify version metadata
        run: python3 scripts/sync-version.py --check

      - name: Confirm trusted runner context
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          printf 'Trusted main commit: %s\n' "${GITHUB_SHA}"

  production-deployment:
    name: Production deployment gate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true
    needs:
      - trusted-integration
    runs-on:
      - self-hosted
      - linux
      - deploy
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    environment: production
    timeout-minutes: 30

    steps:
      - name: Check out trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Validate release metadata before deployment
        run: python3 scripts/sync-version.py --check

      - name: Deployment command placeholder
        run: |
          echo "Production environment gate passed."
          echo "No repository-specific deployment target is configured; add only the required deployment command and environment secrets."
