name: Apply Debian Python 3.14 runtime cleanup hardening

on:
  push:
    branches:
      - fix/debian-trixie-python314-runtime

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: fix/debian-trixie-python314-runtime
          fetch-depth: 0

      - name: Harden runtime helper cleanup and fallbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          helper = Path("scripts/install_python314_runtime.sh")
          replace_once(
              helper,
              '  INSTALLER_DISTRO_ID="$(os_release_value ID || true)"\n'
              '  INSTALLER_DISTRO_VERSION_ID="$(os_release_value VERSION_ID || true)"\n'
              '  INSTALLER_DISTRO_CODENAME="$(os_release_value VERSION_CODENAME || true)"\n',
              '  INSTALLER_DISTRO_ID="$(os_release_value ID 2>/dev/null)" || INSTALLER_DISTRO_ID=""\n'
              '  INSTALLER_DISTRO_VERSION_ID="$(os_release_value VERSION_ID 2>/dev/null)" || INSTALLER_DISTRO_VERSION_ID=""\n'
              '  INSTALLER_DISTRO_CODENAME="$(os_release_value VERSION_CODENAME 2>/dev/null)" || INSTALLER_DISTRO_CODENAME=""\n',
          )
          replace_once(
              helper,
              '  candidate="$(command -v python3.14 2>/dev/null || true)"\n',
              '  if ! candidate="$(command -v python3.14 2>/dev/null)"; then\n'
              '    candidate=""\n'
              '  fi\n',
          )
          replace_once(
              helper,
              '    safe_remove_python314_path "$PYTHON314_BUILD_DIR" || true\n',
              '    if ! safe_remove_python314_path "$PYTHON314_BUILD_DIR"; then\n'
              '      warn "Could not fully clean the temporary Python build directory: ${PYTHON314_BUILD_DIR}"\n'
              '    fi\n',
          )
          replace_once(
              helper,
              '      safe_remove_python314_path "$PYTHON_RUNTIME_DIR" || true\n',
              '      if ! safe_remove_python314_path "$PYTHON_RUNTIME_DIR"; then\n'
              '        warn "Could not fully remove the incomplete WebNAS Python runtime: ${PYTHON_RUNTIME_DIR}"\n'
              '      fi\n',
          )
          replace_once(
              helper,
              '      PYTHON_BIN="$(command -v python3.14 || true)"\n',
              '      PYTHON_BIN="$(command -v python3.14)" || fail "Python 3.14 executable was not found after package installation"\n',
          )
          replace_once(
              helper,
              '        PYTHON_BIN="$(command -v python3.14 || true)"\n',
              '        PYTHON_BIN="$(command -v python3.14)" || fail "Python 3.14 executable was not found after package installation"\n',
          )
          # The dnf and yum blocks contain the same assignment, so replace the second remaining copy.
          replace_once(
              helper,
              '        PYTHON_BIN="$(command -v python3.14 || true)"\n',
              '        PYTHON_BIN="$(command -v python3.14)" || fail "Python 3.14 executable was not found after package installation"\n',
          )

          tests = Path("backend/tests/test_installer_debian_python314.py")
          text = tests.read_text(encoding="utf-8")
          marker = '    assert "apt dist-upgrade" not in RUNTIME_HELPER\n'
          if marker not in text:
              raise SystemExit("Could not find helper safety-test insertion point")
          tests.write_text(
              text.replace(marker, marker + '    assert "|| true" not in RUNTIME_HELPER\n', 1),
              encoding="utf-8",
          )
          PY

      - name: Validate hardening
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh install-standard.sh scripts/install_python314_runtime.sh
          python3 -m pip install --disable-pip-version-check pytest
          python3 -m pytest -q backend/tests/test_installer_debian_python314.py
          shellcheck -e SC2015,SC2064,SC2317 install.sh install-standard.sh
          shellcheck scripts/install_python314_runtime.sh

      - name: Commit runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/install_python314_runtime.sh backend/tests/test_installer_debian_python314.py
          git commit -m "installer: harden private Python runtime cleanup"
          git push origin HEAD:fix/debian-trixie-python314-runtime
