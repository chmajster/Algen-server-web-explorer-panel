id: os-repositories
name: OS Repositories
category: system
icon: package
permissions: [modules.view]
routers: [app.modules.os_repositories.router:router, app.modules.os_repositories.offline_router:router]
dependencies: [hosts-manager]
capabilities: [repositories, mirrors, synchronization, jobs, offline-bundles, air-gap]
actions: [sync, build, promote, rollback, cancel, retry, offline-export, offline-import, offline-verify]
jobs: [repository-sync, package-build]
system_capabilities: [apt, rpm]
