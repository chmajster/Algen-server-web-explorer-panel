id: docker
name: Docker
description: Containers, images, networks, volumes, logs, statistics and Compose projects.
category: containers
version: "2.0.0"
maintainer: WebNAS
homepage: https://docs.docker.com/engine/
icon: boxes
license: Apache-2.0
supported_distributions: [debian, ubuntu, raspbian, fedora, rhel, rocky, almalinux]
supported_architectures: [x86_64, aarch64, armv7l]
packages:
  apt: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
  dnf: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
  yum: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
services:
  - name: docker
    required: true
capabilities:
  install: true
  update: true
  uninstall: true
  configure: true
  service_control: true
  reload: true
  logs: true
  diagnostics: true
  backups: true
  healthcheck: true
  resources: [apps, containers, images, networks, volumes, stats, logs, compose, events, registries, backups]
  actions: [app_install, app_start, app_stop, app_restart, app_update, app_remove, container_create, container_start, container_stop, container_restart, container_pause, container_unpause, container_kill, container_rename, container_remove, container_duplicate, container_recreate, container_check_update, container_update, container_export, container_import, container_backup, container_restore, image_pull, image_update, image_remove, image_prune, image_save, image_load, registry_login, registry_logout, volume_create, volume_remove, volume_prune, volume_backup, volume_restore, volume_clone, network_create, network_remove, network_prune, network_connect, network_disconnect, compose_up, compose_down, compose_start, compose_stop, compose_pull, compose_restart, compose_recreate, compose_scale, compose_delete, system_prune]
ports: []
permissions: [package_management, systemd, docker_socket, config_write]
config_paths: [/etc/docker/daemon.json]
data_paths: [/var/lib/docker]
proxmox_safe: false
requires_root: true
removable: true
