id: syncthing
name: Syncthing
description: Continuous peer-to-peer file synchronization.
long_description: Synchronize selected folders between trusted devices without a central cloud provider.
category: backup
version: "1.0.0"
maintainer: WebNAS
homepage: https://syncthing.net/
icon: refresh-cw
license: MPL-2.0
supported_distributions: [debian, ubuntu, raspbian, fedora]
supported_architectures: [x86_64, aarch64, armv7l]
apt_packages: [syncthing]
dnf_packages: [syncthing]
systemd_services: [webnas-syncthing]
ports: [8384/tcp, 22000/tcp, 22000/udp, 21027/udp]
dependencies: []
conflicts: []
permissions: [package_management, systemd, network_listen, data_access]
config_paths: [/var/lib/webnas/syncthing/config.xml]
data_paths: [/var/lib/webnas/syncthing]
backup_paths: [/var/lib/webnas/syncthing]
proxmox_safe: false
requires_reboot: false
requires_root: true
configurable: false
removable: true
healthcheck: health.py
changelog: [Initial WebNAS module.]
