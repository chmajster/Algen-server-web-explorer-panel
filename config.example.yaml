server:
  host: "0.0.0.0"
  port: 5000
  # Standard installations terminate TLS at the stable nginx gateway. The
  # installer creates the private self-signed certificate below on first install
  # unless the administrator replaces these paths with an existing certificate.
  use_https: true
  tls_cert: "/etc/webnas/tls/webnas.crt"
  tls_key: "/etc/webnas/tls/webnas.key"

auth:
  provider: "pam"
  pam_service: "webnas"
  session_cookie_name: "webnas_session"
  # Browser-only sessions expire after this server-side limit. Remembered
  # sessions use a persistent cookie and can be revoked on logout.
  session_lifetime_hours: 12
  remember_me_lifetime_days: 30

paths:
  default_root: "home"
  allowed_roots: []
  # Network resources are not configured here. The backend always mounts them
  # as direct children of /mnt/webnas/mnt and publishes only verified mounts.
  data_dir: "/var/lib/webnas"
  log_dir: "/var/log/webnas"
  temp_dir: "/var/lib/webnas/tmp"

security:
  max_upload_size_mb: 2048
  rate_limit_login_per_minute: 5
  rate_limit_admin_per_minute: 20
  allow_chmod: true
  allow_chown: false
  system_uid_threshold: 1000
  session_secret: "change-this-secret-during-install"
  cookie_secure: true
  # Set this to true only when intentionally exposing the PAM-authenticated
  # panel over plaintext HTTP in an isolated lab. Existing pre-policy configs
  # without this key remain upgrade-compatible but are treated as legacy.
  allow_insecure_http: false

file_tasks:
  max_parallel: 2
  max_parallel_per_user: 1
  log_tail_lines: 80
  enable_sse: true
  rsync_path: null
  rsync_extra_args: []

systemd:
  allowed_services:
    - "webnas.service"
    - "webnas-backend-blue.service"
    - "webnas-backend-green.service"
    - "smbd.service"
    - "nmbd.service"
    - "nginx.service"
    - "caddy.service"
    - "docker.service"

# Compatibility alias for deployments that prefer a flat key.
systemd_allowed_services: []

proxmox:
  detect: true
  safe_mode: true
  block_system_user_management: true
  block_system_group_management: true
  block_chown: true
  block_chmod_on_protected_paths: true
  block_delete_on_protected_paths: true
  block_move_on_protected_paths: true
  block_rsync_on_protected_paths: true
  block_service_management: true
  allow_only_home_roots_on_proxmox: true
  require_explicit_install_confirmation: true
  install_abort_on_proxmox_without_flag: true
  protected_paths:
    - "/etc/pve"
    - "/var/lib/pve-cluster"
    - "/var/lib/vz"
    - "/var/lib/lxc"
    - "/etc/network"
    - "/etc/network/interfaces"
    - "/etc/hosts"
    - "/etc/hostname"
    - "/etc/resolv.conf"
    - "/etc/apt"
    - "/etc/systemd"
    - "/etc/default"
    - "/etc/modprobe.d"
    - "/etc/modules-load.d"
    - "/boot"
    - "/root"
    - "/usr/share/perl5/PVE"
    - "/var/log/pve"
    - "/run/pve"
    - "/run/lock"
    - "/dev"
    - "/proc"
    - "/sys"
    - "/run"
    - "/mnt/pve"
    - "/rpool"
