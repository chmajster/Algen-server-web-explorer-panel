[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webnas"
version = "0.1.32"
description = "WebNAS Linux web file explorer panel"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn[standard]==0.35.0",
  "python-multipart==0.0.31",
  "PyYAML==6.0.3",
  "python-pam==2.0.2",
  "ldap3==2.9.1",
  "six==1.17.0",
  "itsdangerous==2.2.0",
  "aiofiles==25.1.0",
  "httpx==0.28.1",
  "cryptography==50.0.1",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"app.modules" = ["*/manifest.yaml", "builtin/*/manifest.yaml", "*/*.py", "*/*.sh", "*/*.yaml"]

[tool.ruff]
target-version = "py314"
line-length = 160
exclude = ["frontend", "node_modules", "dist"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"backend/app/ldap_authentication/service.py" = ["F841"]

[tool.mypy]
python_version = "3.14"
platform = "linux"
mypy_path = "backend"
packages = ["app"]
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = [
  "integration: tests that cross application or infrastructure boundaries using controlled fakes/fixtures",
  "system: tests that require trusted host capabilities such as PAM, systemd, mounts or a real integration endpoint",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.bandit]
exclude_dirs = ["backend/tests", "frontend", "node_modules"]
# Reviewed project-specific uses: local nmap XML, allowlisted SQL identifiers,
# explicit administrator TLS opt-outs and POSIX directory modes. Security-
# relevant command execution remains covered by B602/B609 and architecture tests.
skips = ["B101", "B103", "B104", "B105", "B107", "B112", "B310", "B314", "B323", "B404", "B405", "B603", "B607", "B608"]
